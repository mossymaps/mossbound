<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ongoing projects</title>
<style>
  :root{--bg:#2f4a2a;--card:#ffffff;--ink:#4D3F36;--soft:#7a6c62;--line:rgba(77,63,54,.14);color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#24391f;--card:#1a2a16;--ink:#ece6d8;--soft:#a89e8f;--line:rgba(236,230,216,.14);color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:32px 16px}
  main{width:100%;max-width:560px}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
  a{display:block;padding:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
  a:hover,a:focus-visible{transform:translateY(-2px);border-color:var(--ink)}
  strong{display:block;font-size:1.1rem}
  span{color:var(--soft);font-size:.95rem}
</style>
</head>
<body>
<main>
  <ul>
    <li><a href="/map/"><strong>🗺️ Mossbound</strong><span>Generate your own mossy world</span></a></li>
    <li><a href="/fishtank/"><strong>🐠 yúgāng 鱼缸</strong><span>Make some watery friends</span></a></li>
  </ul>
</main>
</body>
</html>
