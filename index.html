<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stamp tool</title>
<style>
  :root {
    --bg: #F5F4F0;
    --panel: #ffffff;
    --border: #E0DED6;
    --border-strong: #C9C6BA;
    --ink: #2A2823;
    --muted: #8A877C;
    --accent: #3D6BFF;
    --accent-ring: rgba(61,107,255,0.18);
    --danger: #E0483E;
    --hover: #F0EFEA;
    transition: background 0.3s ease;
  }
  body.dark {
    --bg: #1B1C22;
    --panel: #26272F;
    --border: #34363F;
    --border-strong: #40424D;
    --ink: #EDEDF0;
    --muted: #8C8E99;
    --accent: #7C9CFF;
    --accent-ring: rgba(124,156,255,0.22);
    --danger: #FF6B60;
    --hover: #33343D;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
    transition: background 0.3s ease, color 0.3s ease;
  }

  #terrain {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }

  #canvas {
    position: absolute;
    inset: 0;
    cursor: default;
  }

  #toolbar {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 6px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    z-index: 10;
  }
  .stamp-btn {
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    border: none;
    border-radius: 9px;
    background: transparent;
    cursor: pointer;
    line-height: 1;
  }
  .stamp-btn:hover { background: var(--hover); }
  .stamp-btn.active {
    background: var(--accent-ring);
    box-shadow: inset 0 0 0 2px var(--accent);
  }
  .divider {
    width: 1px;
    height: 26px;
    background: var(--border);
    margin: 0 4px;
  }
  .icon-btn {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 9px;
    background: transparent;
    cursor: pointer;
    color: var(--ink);
  }
  .icon-btn:hover:not(:disabled) { background: var(--hover); }
  .icon-btn:disabled { color: var(--muted); cursor: default; opacity: 0.5; }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn.active {
    background: var(--accent-ring);
    box-shadow: inset 0 0 0 2px var(--accent);
    color: var(--accent);
  }

  .stamp {
    position: absolute;
    font-size: 34px;
    line-height: 1;
    user-select: none;
    cursor: grab;
    transform: translate(-50%, -50%) rotate(var(--r, 0deg));
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.15));
    touch-action: none;
  }
  .stamp.dragging { cursor: grabbing; z-index: 5; }
  #canvas.erasing, #canvas.erasing .stamp { cursor: var(--eraser-cur) !important; }
  .stamp .delete-x {
    position: absolute;
    top: -26px;
    left: 50%;
    transform: translateX(-50%);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--danger);
    color: white;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .stamp .delete-x svg { width: 13px; height: 13px; }
  .stamp.selected .delete-x { display: flex; }
  #mapOptions {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 300px;
    max-width: calc(100vw - 32px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    color: var(--ink);
    font-size: 13px;
    z-index: 10;
  }
  #mapOptions summary {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    border-radius: 14px;
  }
  #mapOptions summary::-webkit-details-marker { display: none; }
  #mapOptions summary:hover { background: var(--hover); }
  #mapOptions summary svg { width: 16px; height: 16px; flex: 0 0 auto; }
  #mapOptions summary .chevron { margin-left: auto; transition: transform 0.2s ease; }
  #mapOptions[open] summary .chevron { transform: rotate(180deg); }
  #mapOptions[open] summary { border-radius: 14px 14px 0 0; border-bottom: 1px solid var(--border); }
  .opts {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 12px 14px 14px;
    max-height: calc(100vh - 170px);
    overflow-y: auto;
  }
  .opt-group {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
  }
  .opt { display: flex; flex-direction: column; gap: 4px; }
  .opt label { display: flex; justify-content: space-between; color: var(--ink); }
  .opt label output { color: var(--muted); font-variant-numeric: tabular-nums; }
  .opt input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
  .opt select {
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 6px 8px;
  }
  .opt-check { display: flex; align-items: center; gap: 8px; }
  .opt-check input { accent-color: var(--accent); margin: 0; }
  .opt-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); }
  .legend-row { display: inline-flex; align-items: center; gap: 5px; }
  .legend-row .swatch { width: 10px; height: 10px; border-radius: 3px; }
  .opt-buttons { display: flex; gap: 8px; }
  .opt-buttons button {
    flex: 1;
    font: inherit;
    font-weight: 600;
    border-radius: 9px;
    padding: 8px 10px;
    cursor: pointer;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--ink);
  }
  .opt-buttons button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opt-buttons button:hover { filter: brightness(1.05); background-color: var(--hover); }
  .opt-buttons button.primary:hover { background-color: var(--accent); }
</style>
</head>
<body>

  <div id="toolbar">
    <button class="stamp-btn" data-stamp="❤️" title="Heart">❤️</button>
    <button class="stamp-btn" data-stamp="⭐" title="Star">⭐</button>
    <button class="stamp-btn" data-stamp="✅" title="Check">✅</button>
    <button class="stamp-btn" data-stamp="🔥" title="Fire">🔥</button>
    <button class="stamp-btn" data-stamp="👍" title="Thumbs up">👍</button>
    <button class="stamp-btn" data-stamp="❓" title="Question">❓</button>
    <div class="divider"></div>
    <button class="icon-btn" id="undoBtn" title="Undo (Ctrl/Cmd+Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button class="icon-btn" id="eraserBtn" title="Eraser — click a sticker to remove it">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H9l-6-6a2 2 0 0 1 0-2.83l8-8a2 2 0 0 1 2.83 0l6.17 6.17a2 2 0 0 1 0 2.83L14 18"/><path d="M6.5 12.5 12 18"/></svg>
    </button>
    <button class="icon-btn" id="clearBtn" title="Clear all">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
    </button>
    <div class="divider"></div>
    <button class="icon-btn" id="themeBtn" title="Toggle day/night mode">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
  </div>

  <details id="mapOptions">
    <summary>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
      Advanced map options
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </summary>
    <div class="opts">
      <div class="opt">
        <label for="optTerrainType">Terrain type</label>
        <select id="optTerrainType">
          <option value="valley" selected>Valley, winding canyon + tributary</option>
          <option value="island">Island, surrounded by water</option>
        </select>
      </div>
      <div class="opt-group">Noise</div>
      <div class="opt">
        <label for="optCell">Cell size <output id="val-cell"></output></label>
        <input type="range" id="optCell" min="10" max="50" value="28" step="1">
      </div>
      <div class="opt">
        <label for="optScale">Noise scale <output id="val-scale"></output></label>
        <input type="range" id="optScale" min="0.03" max="0.3" value="0.1" step="0.01">
      </div>
      <div class="opt">
        <label for="optOct">Octaves <output id="val-oct"></output></label>
        <input type="range" id="optOct" min="1" max="7" value="5" step="1">
      </div>
      <div class="opt">
        <label for="optLac">Lacunarity <output id="val-lac"></output></label>
        <input type="range" id="optLac" min="1.2" max="3.0" value="2.0" step="0.1">
      </div>
      <div class="opt">
        <label for="optGain">Ridge gain <output id="val-gain"></output></label>
        <input type="range" id="optGain" min="0.2" max="0.9" value="0.55" step="0.01">
      </div>
      <div class="opt-group">Height bands</div>
      <div class="opt-legend" id="optLegend"></div>
      <div class="opt">
        <label for="optT0">Water ↔ Shore <output id="val-t0"></output></label>
        <input type="range" id="optT0" min="0" max="1" value="0.32" step="0.01">
      </div>
      <div class="opt">
        <label for="optT1">Shore ↔ Fields <output id="val-t1"></output></label>
        <input type="range" id="optT1" min="0" max="1" value="0.4" step="0.01">
      </div>
      <div class="opt">
        <label for="optT2">Fields ↔ Hills <output id="val-t2"></output></label>
        <input type="range" id="optT2" min="0" max="1" value="0.64" step="0.01">
      </div>
      <div class="opt">
        <label for="optT3">Hills ↔ Mountains <output id="val-t3"></output></label>
        <input type="range" id="optT3" min="0" max="1" value="0.8" step="0.01">
      </div>
      <div class="opt">
        <label for="optT4">Mountains ↔ Snow <output id="val-t4"></output></label>
        <input type="range" id="optT4" min="0" max="1" value="0.94" step="0.01">
      </div>
      <div class="opt-group">Grid</div>
      <div class="opt">
        <label for="optJitter">Grid jitter <output id="val-jitter"></output></label>
        <input type="range" id="optJitter" min="0" max="0.8" value="0.35" step="0.01">
      </div>
      <label class="opt-check"><input type="checkbox" id="optShowGrid" checked> Show grid lines</label>
      <div class="opt-buttons">
        <button type="button" class="primary" id="optRegen">Regenerate</button>
        <button type="button" id="optSave">Save valley default</button>
      </div>
    </div>
  </details>

  <canvas id="terrain" aria-hidden="true"></canvas>
  <div id="canvas"></div>

<script type="module" src="/src/firebase.js"></script>
<script>
(function () {
  var canvas = document.getElementById('canvas');
  var undoBtn = document.getElementById('undoBtn');
  var eraserBtn = document.getElementById('eraserBtn');
  var clearBtn = document.getElementById('clearBtn');
  var themeBtn = document.getElementById('themeBtn');
  var themeIcon = document.getElementById('themeIcon');

  var activeStamp = null;
  var eraserActive = false;
  var stamps = [];
  var selectedEl = null;
  var idCounter = 0;

  function stampCursor(char) {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40">' +
      '<text x="20" y="27" font-size="30" text-anchor="middle">' + char + '</text></svg>';
    var url = 'data:image/svg+xml,' + encodeURIComponent(svg);
    return 'url("' + url + '") 20 20, crosshair';
  }

  var eraserCursorUrl = (function () {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32">' +
      '<g transform="translate(4,10) rotate(-40 10 8)">' +
      '<rect x="0" y="0" width="20" height="12" rx="2" fill="#FF8FA3" stroke="#8A2540" stroke-width="1.5"/>' +
      '<rect x="0" y="0" width="20" height="6" rx="2" fill="#FFC2CE" stroke="#8A2540" stroke-width="1.5"/>' +
      '</g></svg>';
    return 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '") 6 26, cell';
  })();
  document.documentElement.style.setProperty('--eraser-cur', eraserCursorUrl);

  function setArmed(char, btn) {
    if (activeStamp === char) {
      disarm();
      return;
    }
    activeStamp = char;
    eraserActive = false;
    canvas.classList.remove('erasing');
    canvas.style.cursor = stampCursor(char);
    document.querySelectorAll('.stamp-btn').forEach(function (b) { b.classList.remove('active'); });
    eraserBtn.classList.remove('active');
    btn.classList.add('active');
    deselect();
  }

  function setEraser() {
    if (eraserActive) {
      disarm();
      return;
    }
    activeStamp = null;
    eraserActive = true;
    canvas.classList.add('erasing');
    document.querySelectorAll('.stamp-btn').forEach(function (b) { b.classList.remove('active'); });
    eraserBtn.classList.add('active');
    deselect();
  }

  function disarm() {
    activeStamp = null;
    eraserActive = false;
    canvas.style.cursor = 'default';
    canvas.classList.remove('erasing');
    document.querySelectorAll('.stamp-btn').forEach(function (b) { b.classList.remove('active'); });
    eraserBtn.classList.remove('active');
  }

  document.querySelectorAll('.stamp-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      setArmed(btn.getAttribute('data-stamp'), btn);
    });
  });

  eraserBtn.addEventListener('click', setEraser);

  function deselect() {
    if (selectedEl) selectedEl.classList.remove('selected');
    selectedEl = null;
  }

  function select(el) {
    deselect();
    selectedEl = el;
    el.classList.add('selected');
  }

  function placeStamp(x, y) {
    deselect();
    var id = 'stamp-' + (idCounter++);
    var rotation = (Math.random() * 24 - 12).toFixed(1);
    var record = { id: id, char: activeStamp, x: x, y: y, r: rotation };
    stamps.push(record);
    renderStamp(record);
    undoBtn.disabled = false;
  }

  function renderStamp(record) {
    var el = document.createElement('div');
    el.className = 'stamp';
    el.id = record.id;
    el.style.left = record.x + 'px';
    el.style.top = record.y + 'px';
    el.style.setProperty('--r', record.r + 'deg');
    el.textContent = record.char;

    var del = document.createElement('div');
    del.className = 'delete-x';
    del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';
    del.addEventListener('click', function (e) {
      e.stopPropagation();
      removeStamp(record.id);
    });
    el.appendChild(del);

    canvas.appendChild(el);
    attachDrag(el, record);
  }

  function removeStamp(id) {
    stamps = stamps.filter(function (s) { return s.id !== id; });
    var el = document.getElementById(id);
    if (el) el.remove();
    if (selectedEl && selectedEl.id === id) selectedEl = null;
    undoBtn.disabled = stamps.length === 0;
  }

  function attachDrag(el, record) {
    var dragging = false;
    var offsetX = 0, offsetY = 0;

    el.addEventListener('click', function (e) {
      e.stopPropagation();
    });

    el.addEventListener('pointerdown', function (e) {
      if (e.target.closest('.delete-x')) return;
      if (eraserActive) return;
      e.stopPropagation();
      select(el);
      dragging = true;
      el.classList.add('dragging');
      el.setPointerCapture(e.pointerId);
      var rect = canvas.getBoundingClientRect();
      offsetX = (e.clientX - rect.left) - record.x;
      offsetY = (e.clientY - rect.top) - record.y;
    });

    el.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var rect = canvas.getBoundingClientRect();
      record.x = (e.clientX - rect.left) - offsetX;
      record.y = (e.clientY - rect.top) - offsetY;
      el.style.left = record.x + 'px';
      el.style.top = record.y + 'px';
    });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
    }
    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
  }

  canvas.addEventListener('click', function (e) {
    if (!activeStamp) {
      deselect();
      return;
    }
    var rect = canvas.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var y = e.clientY - rect.top;
    placeStamp(x, y);
  });

  var erasingDrag = false;

  function eraseAtPoint(clientX, clientY) {
    var el = document.elementFromPoint(clientX, clientY);
    var stampEl = el && el.closest ? el.closest('.stamp') : null;
    if (stampEl) removeStamp(stampEl.id);
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (!eraserActive) return;
    erasingDrag = true;
    eraseAtPoint(e.clientX, e.clientY);
  });

  document.addEventListener('pointermove', function (e) {
    if (!erasingDrag) return;
    eraseAtPoint(e.clientX, e.clientY);
  });

  document.addEventListener('pointerup', function () {
    erasingDrag = false;
  });

  undoBtn.addEventListener('click', function () {
    if (!stamps.length) return;
    var last = stamps[stamps.length - 1];
    removeStamp(last.id);
  });

  clearBtn.addEventListener('click', function () {
    stamps.forEach(function (s) {
      var el = document.getElementById(s.id);
      if (el) el.remove();
    });
    stamps = [];
    selectedEl = null;
    undoBtn.disabled = true;
  });

  document.addEventListener('keydown', function (e) {
    var mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      undoBtn.click();
      return;
    }
    if (e.key === 'Escape') {
      disarm();
      deselect();
      return;
    }
    if ((e.key === 'Backspace' || e.key === 'Delete') && selectedEl) {
      removeStamp(selectedEl.id);
    }
  });

  var moonPath = '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/>';
  var sunPath = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';

  function setTheme(dark) {
    document.body.classList.toggle('dark', dark);
    themeIcon.innerHTML = dark ? moonPath : sunPath;
    themeBtn.title = dark ? 'Switch to day mode' : 'Switch to night mode';
    if (activeStamp) canvas.style.cursor = stampCursor(activeStamp);
  }

  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  setTheme(prefersDark);

  themeBtn.addEventListener('click', function () {
    setTheme(!document.body.classList.contains('dark'));
  });

  undoBtn.disabled = true;
})();
</script>
<script>
(function () {
  // Ridged-multifractal terrain background, ported from the "Ridged Terrain
  // Map" sketch. Draws a full-viewport map into #terrain, behind the stamp
  // canvas. Every parameter lives in the collapsible #mapOptions panel; the
  // seed only changes on Regenerate, so tweaking a slider, resizing or
  // toggling the theme reshapes the same map rather than rolling a new one.

  const els = {
    terrainType: document.getElementById('optTerrainType'),
    cell: document.getElementById('optCell'),
    scale: document.getElementById('optScale'),
    oct: document.getElementById('optOct'),
    lac: document.getElementById('optLac'),
    gain: document.getElementById('optGain'),
    t0: document.getElementById('optT0'),
    t1: document.getElementById('optT1'),
    t2: document.getElementById('optT2'),
    t3: document.getElementById('optT3'),
    t4: document.getElementById('optT4'),
    jitter: document.getElementById('optJitter'),
    showGrid: document.getElementById('optShowGrid'),
  };
  // how many decimals each slider's readout shows
  const DECIMALS = { cell: 0, scale: 2, oct: 0, lac: 1, gain: 2, t0: 2, t1: 2, t2: 2, t3: 2, t4: 2, jitter: 2 };

  // Default settings per terrain type. Picking a type loads its defaults;
  // "Save default" stores the current controls as that type's defaults in
  // this browser, and they win over the built-in values.
  const BUILTIN = { cell: 28, scale: 0.10, oct: 5, lac: 2.0, gain: 0.55, t0: 0.32, t1: 0.40, t2: 0.64, t3: 0.80, t4: 0.94, jitter: 0.35, showGrid: true };
  const PRESETS = { valley: Object.assign({}, BUILTIN), island: Object.assign({}, BUILTIN) };
  const STORE_KEY = 'ridged-terrain-defaults-v1';
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    for (const type in PRESETS) if (saved[type]) Object.assign(PRESETS[type], saved[type]);
  } catch (e) {}

  function persistPresets() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(PRESETS)); return true; }
    catch (e) { return false; }
  }
  function currentSettings() {
    const out = {};
    for (const k in BUILTIN) out[k] = k === 'showGrid' ? els.showGrid.checked : parseFloat(els[k].value);
    return out;
  }
  function applyPreset(type) {
    const p = PRESETS[type];
    if (!p) return;
    for (const k in p) {
      if (k === 'showGrid') els.showGrid.checked = !!p[k];
      else if (els[k]) els[k].value = p[k];
    }
  }

  const BAND_STYLES = [
    { name: 'Water',     color: '#8FCDB9' },
    { name: 'Shore',     color: '#97B264' },
    { name: 'Fields',    color: '#7EAA62' },
    { name: 'Hills',     color: '#5C8858' },
    { name: 'Mountains', color: '#6F928C' },
    { name: 'Snow',      color: '#AEC4C1' },
  ];
  // thresholds = [water↔shore, shore↔fields, fields↔hills, hills↔mountains, mountains↔snow]
  function bandsFor(thresholds) {
    return BAND_STYLES.map((b, i) => ({ ...b, max: thresholds[i] ?? 1.01 }));
  }
  function bandFor(h, bands) {
    for (const b of bands) if (h < b.max) return b;
    return bands[bands.length - 1];
  }

  // --- seeded PRNG ---
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // --- seeded gradient (Perlin-style) noise, returns roughly -1..1 ---
  function makePerlin2D(seedValue) {
    const rand = mulberry32(seedValue);
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      const t = p[i]; p[i] = p[j]; p[j] = t;
    }
    const perm = new Uint8Array(512);
    for (let i = 0; i < 512; i++) perm[i] = p[i & 255];

    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const lerp = (a, b, t) => a + t * (b - a);
    const grad = (hash, x, y) => {
      const angle = (hash & 7) * (Math.PI / 4);
      return Math.cos(angle) * x + Math.sin(angle) * y;
    };
    return function perlin2D(x, y) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
      const xf = x - Math.floor(x), yf = y - Math.floor(y);
      const u = fade(xf), v = fade(yf);
      const aa = perm[perm[X] + Y], ba = perm[perm[X + 1] + Y];
      const ab = perm[perm[X] + Y + 1], bb = perm[perm[X + 1] + Y + 1];
      const x1 = lerp(grad(aa, xf, yf), grad(ba, xf - 1, yf), u);
      const x2 = lerp(grad(ab, xf, yf - 1), grad(bb, xf - 1, yf - 1), u);
      return lerp(x1, x2, v);
    };
  }

  // --- ridged multifractal: signed noise in, height 0..1 out ---
  function makeRidgedMF(perlin, { octaves, lacunarity, gain, offset = 1.0 }) {
    return function ridged(x, y) {
      let frequency = 1, amplitude = 0.5, prev = 1, sum = 0, ampSum = 0;
      for (let o = 0; o < octaves; o++) {
        let n = perlin(x * frequency, y * frequency);
        n = offset - Math.abs(n);
        n = n * n * prev;
        sum += n * amplitude;
        ampSum += amplitude;
        prev = n;
        frequency *= lacunarity;
        amplitude *= gain;
      }
      return ampSum > 0 ? sum / ampSum : 0;
    };
  }

  function smoothstep(edge0, edge1, x) {
    const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
    return t * t * (3 - 2 * t);
  }

  // Meandering canyon centerline: a main stem plus one tributary that joins
  // it, each bent by sine harmonics and noise, plus one peanut-shaped lake
  // placed clear of the river.
  function makeValleyPath(cols, rows, seed) {
    const rng = mulberry32(seed + 909);
    const warp = makePerlin2D(seed + 411);

    function bendFn(ampBase, freqBase, warpSeed) {
      const h1 = { a: ampBase * (0.7 + rng() * 0.6), f: freqBase * (0.6 + rng() * 0.8), p: rng() * Math.PI * 2 };
      const h2 = { a: ampBase * (0.3 + rng() * 0.4), f: freqBase * (1.8 + rng() * 1.4), p: rng() * Math.PI * 2 };
      return (t) =>
        Math.sin(t * Math.PI * 2 * h1.f + h1.p) * h1.a
        + Math.sin(t * Math.PI * 2 * h2.f + h2.p) * h2.a
        + warp(t * 2.2 + warpSeed, warpSeed * 0.7) * ampBase * 0.5;
    }

    const mainAmp = rows * (0.14 + rng() * 0.06);
    const mainBend = bendFn(mainAmp, 1.1, rng() * 50);
    const mainBase = rows * (0.35 + rng() * 0.3);
    const mainJ = (i) => mainBase + mainBend(i / cols);

    const splitAt = Math.floor(cols * (0.3 + rng() * 0.25));
    const dir = rng() < 0.5 ? -1 : 1;
    const tribAmp = rows * (0.08 + rng() * 0.05);
    const tribBend = bendFn(tribAmp, 1.6, rng() * 50);
    const spread = rows * (0.22 + rng() * 0.16) * dir;
    const tribJ = (i) => {
      const t = (i - splitAt) / Math.max(1, cols - splitAt);
      return mainJ(splitAt) + spread * t + tribBend(t) * (0.4 + t * 0.6);
    };

    const riverDist = (i, j) => {
      let d = Math.abs(j - mainJ(i));
      if (i >= splitAt) d = Math.min(d, Math.abs(j - tribJ(i)));
      return d;
    };

    const halfWidth = rows * 0.16;
    const lakeR = Math.max(1.7, rows * 0.052);
    const riverThread = halfWidth * 0.3;
    const lakeAngle = rng() * Math.PI;
    const lobes = [
      { off: -0.625 * lakeR, r: 0.85 * lakeR },
      { off:  0.625 * lakeR, r: 0.65 * lakeR },
    ];
    const reach = 0.625 * lakeR + 0.85 * lakeR;
    const needed = reach * 1.2 + riverThread + 1;
    let lake = null, bestClear = -Infinity;
    for (let n = 0; n < 240; n++) {
      const ci = 4 + rng() * Math.max(1, cols - 8);
      const cj = 4 + rng() * Math.max(1, rows - 8);
      const d = riverDist(ci, cj);
      if (d > halfWidth * 2.1) continue;
      const clear = d - needed;
      if (clear > bestClear) { bestClear = clear; lake = { ci, cj }; }
      if (clear >= 0) { lake = { ci, cj }; break; }
    }
    if (!lake) lake = { ci: cols * 0.5, cj: rows * 0.5 };
    lake.ax = Math.cos(lakeAngle);
    lake.ay = Math.sin(lakeAngle);
    lake.lobes = lobes;
    lake.noise = makePerlin2D(seed + 733);

    return { mainJ, tribJ, splitAt, lake };
  }

  // Reshape a raw 0..1 noise height by terrain type: "island" pulls the
  // edges down to water by distance from the map's center, "valley" carves
  // the winding canyon above with mountains rising away from it.
  function shapeHeight(rawHeight, i, j, cols, rows, terrainType, path) {
    if (terrainType === 'island') {
      const cx = cols / 2, cy = rows / 2;
      const radius = Math.min(cols, rows) / 2;
      const r = Math.max(0, Math.min(1, Math.hypot(i - cx, j - cy) / radius));
      return rawHeight * (1 - smoothstep(0.45, 0.98, r));
    }

    const halfWidth = rows * 0.16;
    let dist = Math.abs(j - path.mainJ(i));
    if (i >= path.splitAt) dist = Math.min(dist, Math.abs(j - path.tribJ(i)));
    const edgeFactor = smoothstep(0, 1, Math.max(0, Math.min(1, dist / halfWidth)));
    const centerHeight = rawHeight * 0.55;
    const edgeHeight = 0.8 + rawHeight * 0.15;
    let h = centerHeight * (1 - edgeFactor) + edgeHeight * edgeFactor;

    const riverCore = 1 - smoothstep(0, halfWidth * 0.3, dist);
    h = h * (1 - riverCore) + (rawHeight * 0.12) * riverCore;

    const L = path.lake;
    const wobble = 1 + 0.12 * L.noise(i * 0.45 + 17, j * 0.45 + 17);
    let ld = Infinity;
    for (const lobe of L.lobes) {
      const lx = L.ci + L.ax * lobe.off, ly = L.cj + L.ay * lobe.off;
      ld = Math.min(ld, Math.hypot(i - lx, j - ly) / (lobe.r * wobble));
    }
    const lakeCore = 1 - smoothstep(0.75, 1.0, ld);
    return h * (1 - lakeCore) + (rawHeight * 0.12) * lakeCore;
  }

  function shade(hex, factor) {
    const n = parseInt(hex.slice(1), 16);
    const f = 1 + factor;
    const cl = (v) => Math.max(0, Math.min(255, Math.round(v * f)));
    return `rgb(${cl((n >> 16) & 255)},${cl((n >> 8) & 255)},${cl(n & 255)})`;
  }

  function generateGrid(width, height, cellSize, jitter, noiseX, noiseY) {
    const margin = cellSize * 1.5;
    const cols = Math.ceil((width + margin * 2) / cellSize);
    const rows = Math.ceil((height + margin * 2) / cellSize);
    const points = [];
    for (let j = 0; j <= rows; j++) {
      const row = [];
      for (let i = 0; i <= cols; i++) {
        row.push({
          x: -margin + i * cellSize + noiseX(i * 0.9, j * 0.9) * cellSize * jitter,
          y: -margin + j * cellSize + noiseY(i * 0.9, j * 0.9) * cellSize * jitter,
        });
      }
      points.push(row);
    }
    return { points, cols, rows };
  }

  const canvas = document.getElementById('terrain');
  const ctx = canvas.getContext('2d');
  const legendEl = document.getElementById('optLegend');
  let seed = Math.floor(Math.random() * 1e9);

  function draw() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const s = currentSettings();
    const terrainType = els.terrainType.value;
    const bands = bandsFor([s.t0, s.t1, s.t2, s.t3, s.t4]);
    const perlinTerrain = makePerlin2D(seed);
    const perlinJX = makePerlin2D(seed + 101);
    const perlinJY = makePerlin2D(seed + 202);
    const ridged = makeRidgedMF(perlinTerrain, { octaves: s.oct, lacunarity: s.lac, gain: s.gain });

    const { points, cols, rows } = generateGrid(w, h, s.cell, s.jitter, perlinJX, perlinJY);
    const path = terrainType === 'valley' ? makeValleyPath(cols, rows, seed) : null;

    // fill each cell once, sampled at its unjittered center
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const rawH = ridged((i + 0.5) * s.scale, (j + 0.5) * s.scale);
        const band = bandFor(shapeHeight(rawH, i, j, cols, rows, terrainType, path), bands);
        ctx.fillStyle = shade(band.color, perlinJX(i * 3.1 + 40, j * 3.1 + 40) * 0.05);

        const p00 = points[j][i], p10 = points[j][i + 1];
        const p11 = points[j + 1][i + 1], p01 = points[j + 1][i];
        ctx.beginPath();
        ctx.moveTo(p00.x, p00.y);
        ctx.lineTo(p10.x, p10.y);
        ctx.lineTo(p11.x, p11.y);
        ctx.lineTo(p01.x, p01.y);
        ctx.closePath();
        ctx.fill();
      }
    }

    if (s.showGrid) {
      ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--ink').trim() || '#2A2823';
      ctx.globalAlpha = 0.22;
      ctx.lineWidth = 1;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      for (const row of points) {
        ctx.moveTo(row[0].x, row[0].y);
        for (let i = 1; i < row.length; i++) ctx.lineTo(row[i].x, row[i].y);
      }
      for (let i = 0; i < points[0].length; i++) {
        ctx.moveTo(points[0][i].x, points[0][i].y);
        for (let j = 1; j < points.length; j++) ctx.lineTo(points[j][i].x, points[j][i].y);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // legend reads high-to-low, Snow at top
    legendEl.innerHTML = bands.slice().reverse().map((b) =>
      `<span class="legend-row"><span class="swatch" style="background:${b.color}"></span>${b.name}</span>`
    ).join('');
  }

  function syncReadouts() {
    for (const k in DECIMALS) {
      document.getElementById('val-' + k).textContent = parseFloat(els[k].value).toFixed(DECIMALS[k]);
    }
  }

  let raf = null;
  function scheduleDraw() {
    syncReadouts();
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(draw);
  }

  const saveBtn = document.getElementById('optSave');
  function updateSaveLabel() { saveBtn.textContent = 'Save ' + els.terrainType.value + ' default'; }
  let saveTimer = null;

  // loading a preset must happen before the generic listeners redraw
  els.terrainType.addEventListener('change', () => {
    applyPreset(els.terrainType.value);
    clearTimeout(saveTimer);
    updateSaveLabel();
  });
  Object.values(els).forEach((el) => {
    el.addEventListener('input', scheduleDraw);
    el.addEventListener('change', scheduleDraw);
  });
  document.getElementById('optRegen').addEventListener('click', () => {
    seed = Math.floor(Math.random() * 1e9);
    scheduleDraw();
  });
  saveBtn.addEventListener('click', () => {
    PRESETS[els.terrainType.value] = currentSettings();
    saveBtn.textContent = persistPresets() ? 'Saved' : 'Could not save';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(updateSaveLabel, 1600);
  });

  window.addEventListener('resize', scheduleDraw);
  // grid lines follow the day/night theme, which toggles a class on <body>
  new MutationObserver(scheduleDraw).observe(document.body, { attributes: true, attributeFilter: ['class'] });

  applyPreset(els.terrainType.value);
  updateSaveLabel();
  syncReadouts();
  draw();
})();
</script>
</body>
</html>
