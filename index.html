<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mossbound</title>
<style>
  :root{
    --chrome-bg:rgba(240,244,214,.30);
    --chrome-bg-strong:rgba(240,244,214,.48);
    --chrome-border:rgba(255,255,255,.30);
    --chrome-fg:#4D3F36;
    --drawer-bg:rgba(30,34,24,.86);
    --drawer-border:rgba(255,255,255,.12);
    --drawer-fg:#F2EAD9;
    --drawer-muted:#B8B39C;
    --drawer-accent:#A9C77E;

    /* day/night sequence from the toggle design: day, twilight purple, night */
    --tint-day:rgba(0,0,0,0);
    --tint-twilight:rgba(96,62,140,.46);
    --tint-night:rgba(16,24,38,.64);
    --tog-dur:1.25s;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    overflow:hidden;
    background:#9aab68;
    font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- terrain background (under the builder) ---------- */
  #ground, #clouds{ position:fixed; pointer-events:none; }
  #terrain{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .cloud{
    position:absolute; height:34px; border-radius:999px;
    background:rgba(255,255,255,.16);
    animation:drift ease-in-out infinite alternate;
  }
  @keyframes drift{ from{ transform:translateX(-30vw); } to{ transform:translateX(30vw); } }

  #app{ position:fixed; inset:0; }
  #map{ width:100%; height:100%; display:block; touch-action:none; cursor:default; }
  #map.mode-active{ cursor:crosshair; }
  .feature{ cursor:grab; }
  .feature:active{ cursor:grabbing; }

  #tintRect{
    position:fixed; inset:0; pointer-events:none;
    background-color:var(--tint-day);
  }
  @keyframes seqTint{
    0%{   background-color:var(--tint-day); }
    50%{  background-color:var(--tint-twilight); }
    100%{ background-color:var(--tint-night); }
  }
  #tintRect.anim-fwd{ animation:seqTint var(--tog-dur) ease-in-out both; }
  #tintRect.anim-rev{ animation:seqTint var(--tog-dur) ease-in-out both reverse; }
  #tintRect.state-on{ background-color:var(--tint-night); }

  /* ---------- floating chrome ---------- */
  .chrome-btn{
    display:flex; align-items:center; justify-content:center;
    width:2.6rem; height:2.6rem;
    border-radius:999px;
    background:var(--chrome-bg);
    border:1px solid var(--chrome-border);
    backdrop-filter:blur(6px);
    color:var(--chrome-fg);
    cursor:pointer;
    transition:background .15s ease, transform .15s ease;
  }
  .chrome-btn:hover{ background:var(--chrome-bg-strong); }
  .chrome-btn:active{ transform:scale(.93); }
  .chrome-btn svg{ width:1.15rem; height:1.15rem; }

  #hamburger{ position:absolute; top:calc(1rem + env(safe-area-inset-top,0px)); left:1rem; z-index:5; }

  #topRight{
    position:absolute; top:calc(1rem + env(safe-area-inset-top,0px)); right:1rem; z-index:5;
    display:flex; align-items:center; gap:.55rem;
  }
  .zoom-pill{
    display:flex; align-items:center;
    background:var(--chrome-bg); border:1px solid var(--chrome-border);
    backdrop-filter:blur(6px); border-radius:999px; overflow:hidden;
  }
  .zoom-pill button{
    width:2.3rem; height:2.6rem; border:none; background:transparent; color:var(--chrome-fg);
    font-size:1.15rem; cursor:pointer; line-height:1; transition:background .15s ease;
  }
  .zoom-pill button:hover{ background:rgba(255,255,255,.2); }
  .zoom-pill .zoom-div{ width:1px; align-self:stretch; background:var(--chrome-border); }

  /* day/night switch: track and knob step through the same three stages as the tint */
  .tswitch{
    position:relative; width:3.6rem; height:2.05rem; border-radius:999px;
    background:#5E9C84; border:none; padding:0; cursor:pointer;
  }
  .tswitch:focus-visible{ outline:2px solid #fff; outline-offset:2px; }
  @keyframes tSeqTrack{
    0%{   background:#5E9C84; }
    50%{  background:#6E3A5C; }
    100%{ background:#1B1523; }
  }
  .tswitch.anim-fwd{ animation:tSeqTrack var(--tog-dur) ease-in-out both; }
  .tswitch.anim-rev{ animation:tSeqTrack var(--tog-dur) ease-in-out both reverse; }
  .tswitch.state-on{ background:#1B1523; }
  .tknob{
    position:absolute; top:.24rem; left:.24rem; width:1.57rem; height:1.57rem;
    border-radius:50%; background:#C9DC9E; transform:translateX(0);
    box-shadow:0 1px 2px rgba(0,0,0,.3);
  }
  @keyframes tSeqKnob{
    0%{   transform:translateX(0);      background:#C9DC9E; }
    50%{  transform:translateX(.78rem); background:#E2605A; }
    100%{ transform:translateX(1.56rem);background:#CDEAB4; }
  }
  .tknob.anim-fwd{ animation:tSeqKnob var(--tog-dur) ease-in-out both; }
  .tknob.anim-rev{ animation:tSeqKnob var(--tog-dur) ease-in-out both reverse; }
  .tknob.state-on{ transform:translateX(1.56rem); background:#CDEAB4; }
  @keyframes tKnobBounceOn{
    0%{  transform:translateX(1.56rem);  animation-timing-function:cubic-bezier(.22,.61,.36,1); }
    55%{ transform:translateX(1.62rem);  animation-timing-function:cubic-bezier(.5,0,.5,1); }
    100%{transform:translateX(1.56rem); }
  }
  @keyframes tKnobBounceOff{
    0%{  transform:translateX(0);        animation-timing-function:cubic-bezier(.22,.61,.36,1); }
    55%{ transform:translateX(-.06rem);  animation-timing-function:cubic-bezier(.5,0,.5,1); }
    100%{transform:translateX(0); }
  }
  .tknob.bounce-on{ animation:tKnobBounceOn .32s; }
  .tknob.bounce-off{ animation:tKnobBounceOff .32s; }

  @media (prefers-reduced-motion: reduce){
    .tknob.anim-fwd,.tknob.anim-rev,.tknob.bounce-on,.tknob.bounce-off,
    .tswitch.anim-fwd,.tswitch.anim-rev,
    #tintRect.anim-fwd,#tintRect.anim-rev,.cloud{ animation:none; }
  }

  /* ---------- bottom toolbar ---------- */
  #toolbar{
    position:absolute; left:50%; bottom:calc(1rem + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%); z-index:5;
    display:flex; align-items:center; gap:.35rem;
    background:var(--chrome-bg); border:1px solid var(--chrome-border);
    backdrop-filter:blur(8px); border-radius:999px; padding:.45rem .7rem;
    max-width:calc(100vw - 1.5rem);
  }
  .tool-btn{
    display:flex; align-items:center; justify-content:center;
    width:2.6rem; height:2.6rem; border-radius:999px; border:none; background:transparent;
    color:var(--chrome-fg); opacity:.8; cursor:pointer; transform:translateY(0);
    transition:opacity .2s ease-in-out, transform .2s ease-in-out, background .2s ease-in-out;
    flex:0 0 auto;
  }
  .tool-btn svg{ width:1.3rem; height:1.3rem; pointer-events:none; }
  .tool-btn svg.tool-icon{ width:1.9rem; height:1.9rem; overflow:visible; }
  .tool-btn:hover, .tool-btn.selected{ opacity:1; transform:translateY(-4px); }
  .tool-btn.selected{ background:rgba(255,255,255,.28); }
  .tool-btn:disabled{ opacity:.32; cursor:default; transform:none; }
  .tool-sep{ width:1px; height:1.7rem; background:var(--chrome-border); margin:0 .2rem; flex:0 0 auto; }
  @media (max-width: 480px){
    #toolbar{ gap:.1rem; padding:.35rem .45rem; }
    .tool-btn{ width:2.2rem; height:2.2rem; }
    .tool-btn svg.tool-icon{ width:1.6rem; height:1.6rem; }
    .tool-sep{ margin:0 .05rem; }
  }

  /* ---------- hamburger menu panel ---------- */
  #menuPanel{
    position:absolute; top:0; left:0; height:100%; width:min(20rem, 86vw);
    background:var(--drawer-bg); backdrop-filter:blur(10px);
    border-right:1px solid var(--drawer-border); color:var(--drawer-fg); z-index:10;
    padding:calc(1.2rem + env(safe-area-inset-top,0px)) 1.1rem 1.3rem;
    transform:translateX(-100%); transition:transform .28s cubic-bezier(.32,.72,.35,1);
    overflow-y:auto;
  }
  #menuPanel.open{ transform:translateX(0); }
  #menuScrim{
    position:absolute; inset:0; background:rgba(0,0,0,.35);
    opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:9;
  }
  #menuScrim.open{ opacity:1; pointer-events:auto; }
  #menuPanel h2{ margin:0 0 1rem; padding-left:.5rem; font-size:1.05rem; font-weight:600; letter-spacing:.01em; }
  .menu-item{
    display:block; width:100%; text-align:left; background:transparent; border:none;
    color:var(--drawer-fg); font:inherit; font-size:.92rem; padding:.7rem .5rem; border-radius:.6rem;
    cursor:pointer; transition:background .15s ease;
  }
  .menu-item:hover{ background:rgba(255,255,255,.1); }
  .menu-close{
    position:absolute; top:calc(1rem + env(safe-area-inset-top,0px)); right:1rem;
    background:transparent; border:none; color:var(--drawer-fg); cursor:pointer; width:2rem; height:2rem;
  }

  /* ---------- advanced terrain options (inside the menu) ---------- */
  #mapOptions{ margin-top:.5rem; border-top:1px solid var(--drawer-border); padding-top:.5rem; font-size:13px; }
  #mapOptions summary{
    list-style:none; display:flex; align-items:center; gap:8px;
    padding:.7rem .5rem; border-radius:.6rem; font-size:.92rem;
    cursor:pointer; user-select:none;
  }
  #mapOptions summary::-webkit-details-marker{ display:none; }
  #mapOptions summary:hover{ background:rgba(255,255,255,.1); }
  #mapOptions summary svg{ width:16px; height:16px; flex:0 0 auto; }
  #mapOptions summary .chevron{ margin-left:auto; transition:transform .2s ease; }
  #mapOptions[open] summary .chevron{ transform:rotate(180deg); }
  .opts{ display:flex; flex-direction:column; gap:12px; padding:.5rem .5rem 0; }
  .opt-group{ font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--drawer-muted); margin-top:4px; }
  .opt{ display:flex; flex-direction:column; gap:4px; }
  .opt label{ display:flex; justify-content:space-between; }
  .opt label output{ color:var(--drawer-muted); font-variant-numeric:tabular-nums; }
  .opt input[type=range]{ width:100%; accent-color:var(--drawer-accent); margin:0; }
  .opt select{
    font:inherit; color:var(--drawer-fg); background:rgba(255,255,255,.08);
    border:1px solid var(--drawer-border); border-radius:8px; padding:6px 8px;
  }
  .opt select option{ color:#2A2823; }
  .opt-check{ display:flex; align-items:center; gap:8px; }
  .opt-check input{ accent-color:var(--drawer-accent); margin:0; }
  .opt-legend{ display:flex; flex-wrap:wrap; gap:4px 12px; color:var(--drawer-muted); }
  .legend-row{ display:inline-flex; align-items:center; gap:5px; }
  .legend-row .swatch{ width:10px; height:10px; border-radius:3px; }
  .opt-buttons{ display:flex; gap:8px; }
  .opt-buttons button{
    flex:1; font:inherit; font-weight:600; border-radius:9px; padding:8px 10px; cursor:pointer;
    border:1px solid var(--drawer-border); background:transparent; color:var(--drawer-fg);
  }
  .opt-buttons button:hover{ background:rgba(255,255,255,.1); }
  .opt-buttons button.primary{ background:var(--drawer-accent); border-color:var(--drawer-accent); color:#1E2218; }
  .opt-buttons button.primary:hover{ filter:brightness(1.06); }
</style>
</head>

<script type="module" src="/src/firebase.js"></script>
<script>
(function () {
  // Ridged-multifractal terrain background, ported from the "Ridged Terrain
  // Map" sketch. Draws into #terrain, underneath the terrain builder's SVG.
  // Every parameter lives in the collapsible advanced options in the menu;
  // the seed only changes on Regenerate / New map, so tweaking a slider or
  // resizing reshapes the same map rather than rolling a new one.
  //
  // The terrain covers more than the viewport (EXTENT below) so the builder
  // can zoom out and pan without exposing an edge; window.MossTerrain lets
  // the builder keep the two layers in step.

  const els = {
    terrainType: document.getElementById('optTerrainType'),
    cell: document.getElementById('optCell'),
    scale: document.getElementById('optScale'),
    oct: document.getElementById('optOct'),
    lac: document.getElementById('optLac'),
    gain: document.getElementById('optGain'),
    t0: document.getElementById('optT0'),
    t1: document.getElementById('optT1'),
    t2: document.getElementById('optT2'),
    t3: document.getElementById('optT3'),
    t4: document.getElementById('optT4'),
    jitter: document.getElementById('optJitter'),
    sparse: document.getElementById('optSparse'),
    waterCost: document.getElementById('optWaterCost'),
    showGrid: document.getElementById('optShowGrid'),
  };
  // how many decimals each slider's readout shows
  const DECIMALS = { cell: 0, scale: 2, oct: 0, lac: 1, gain: 2, t0: 2, t1: 2, t2: 2, t3: 2, t4: 2, jitter: 2, sparse: 2, waterCost: 0 };

  // Default settings per terrain type. Picking a type loads its defaults;
  // "Save default" stores the current controls as that type's defaults in
  // this browser, and they win over the built-in values.
  const BUILTIN = { cell: 28, scale: 0.10, oct: 5, lac: 2.0, gain: 0.55, t0: 0.32, t1: 0.40, t2: 0.64, t3: 0.80, t4: 0.94, jitter: 0.35, sparse: 0.2, waterCost: 14, showGrid: true };
  const PRESETS = { valley: Object.assign({}, BUILTIN), island: Object.assign({}, BUILTIN) };
  const STORE_KEY = 'ridged-terrain-defaults-v1';
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    for (const type in PRESETS) if (saved[type]) Object.assign(PRESETS[type], saved[type]);
  } catch (e) {}

  function persistPresets() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(PRESETS)); return true; }
    catch (e) { return false; }
  }
  function currentSettings() {
    const out = {};
    for (const k in BUILTIN) out[k] = k === 'showGrid' ? els.showGrid.checked : parseFloat(els[k].value);
    return out;
  }
  function applyPreset(type) {
    const p = PRESETS[type];
    if (!p) return;
    for (const k in p) {
      if (k === 'showGrid') els.showGrid.checked = !!p[k];
      else if (els[k]) els[k].value = p[k];
    }
  }

  const BAND_STYLES = [
    { name: 'Water',     color: '#8FCDB9' },
    { name: 'Shore',     color: '#95B063' },
    { name: 'Fields',    color: '#7FAC63' },
    { name: 'Hills',     color: '#5B8757' },
    { name: 'Mountains', color: '#6F928C' },
    { name: 'Snow',      color: '#AEC4C1' },
  ];
  // thresholds = [water↔shore, shore↔fields, fields↔hills, hills↔mountains, mountains↔snow]
  function bandsFor(thresholds) {
    return BAND_STYLES.map((b, i) => ({ ...b, max: thresholds[i] ?? 1.01 }));
  }
  function bandFor(h, bands) {
    for (const b of bands) if (h < b.max) return b;
    return bands[bands.length - 1];
  }

  // --- seeded PRNG ---
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // --- seeded gradient (Perlin-style) noise, returns roughly -1..1 ---
  function makePerlin2D(seedValue) {
    const rand = mulberry32(seedValue);
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      const t = p[i]; p[i] = p[j]; p[j] = t;
    }
    const perm = new Uint8Array(512);
    for (let i = 0; i < 512; i++) perm[i] = p[i & 255];

    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const lerp = (a, b, t) => a + t * (b - a);
    const grad = (hash, x, y) => {
      const angle = (hash & 7) * (Math.PI / 4);
      return Math.cos(angle) * x + Math.sin(angle) * y;
    };
    return function perlin2D(x, y) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
      const xf = x - Math.floor(x), yf = y - Math.floor(y);
      const u = fade(xf), v = fade(yf);
      const aa = perm[perm[X] + Y], ba = perm[perm[X + 1] + Y];
      const ab = perm[perm[X] + Y + 1], bb = perm[perm[X + 1] + Y + 1];
      const x1 = lerp(grad(aa, xf, yf), grad(ba, xf - 1, yf), u);
      const x2 = lerp(grad(ab, xf, yf - 1), grad(bb, xf - 1, yf - 1), u);
      return lerp(x1, x2, v);
    };
  }

  // --- ridged multifractal: signed noise in, height 0..1 out ---
  function makeRidgedMF(perlin, { octaves, lacunarity, gain, offset = 1.0 }) {
    return function ridged(x, y) {
      let frequency = 1, amplitude = 0.5, prev = 1, sum = 0, ampSum = 0;
      for (let o = 0; o < octaves; o++) {
        let n = perlin(x * frequency, y * frequency);
        n = offset - Math.abs(n);
        n = n * n * prev;
        sum += n * amplitude;
        ampSum += amplitude;
        prev = n;
        frequency *= lacunarity;
        amplitude *= gain;
      }
      return ampSum > 0 ? sum / ampSum : 0;
    };
  }

  function smoothstep(edge0, edge1, x) {
    const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
    return t * t * (3 - 2 * t);
  }

  // Meandering canyon centerline: a main stem plus one tributary that joins
  // it, each bent by sine harmonics and noise, plus one peanut-shaped lake
  // placed clear of the river.
  function makeValleyPath(cols, rows, seed) {
    const rng = mulberry32(seed + 909);
    const warp = makePerlin2D(seed + 411);

    function bendFn(ampBase, freqBase, warpSeed) {
      const h1 = { a: ampBase * (0.7 + rng() * 0.6), f: freqBase * (0.6 + rng() * 0.8), p: rng() * Math.PI * 2 };
      const h2 = { a: ampBase * (0.3 + rng() * 0.4), f: freqBase * (1.8 + rng() * 1.4), p: rng() * Math.PI * 2 };
      return (t) =>
        Math.sin(t * Math.PI * 2 * h1.f + h1.p) * h1.a
        + Math.sin(t * Math.PI * 2 * h2.f + h2.p) * h2.a
        + warp(t * 2.2 + warpSeed, warpSeed * 0.7) * ampBase * 0.5;
    }

    const mainAmp = rows * (0.14 + rng() * 0.06);
    const mainBend = bendFn(mainAmp, 1.1, rng() * 50);
    const mainBase = rows * (0.35 + rng() * 0.3);
    const mainJ = (i) => mainBase + mainBend(i / cols);

    const splitAt = Math.floor(cols * (0.3 + rng() * 0.25));
    const dir = rng() < 0.5 ? -1 : 1;
    const tribAmp = rows * (0.08 + rng() * 0.05);
    const tribBend = bendFn(tribAmp, 1.6, rng() * 50);
    const spread = rows * (0.22 + rng() * 0.16) * dir;
    const tribJ = (i) => {
      const t = (i - splitAt) / Math.max(1, cols - splitAt);
      return mainJ(splitAt) + spread * t + tribBend(t) * (0.4 + t * 0.6);
    };

    const riverDist = (i, j) => {
      let d = Math.abs(j - mainJ(i));
      if (i >= splitAt) d = Math.min(d, Math.abs(j - tribJ(i)));
      return d;
    };

    const halfWidth = rows * 0.16;
    const lakeR = Math.max(1.7, rows * 0.052);
    const riverThread = halfWidth * 0.3;
    const lakeAngle = rng() * Math.PI;
    const lobes = [
      { off: -0.625 * lakeR, r: 0.85 * lakeR },
      { off:  0.625 * lakeR, r: 0.65 * lakeR },
    ];
    const reach = 0.625 * lakeR + 0.85 * lakeR;
    const needed = reach * 1.2 + riverThread + 1;
    let lake = null, bestClear = -Infinity;
    for (let n = 0; n < 240; n++) {
      const ci = 4 + rng() * Math.max(1, cols - 8);
      const cj = 4 + rng() * Math.max(1, rows - 8);
      const d = riverDist(ci, cj);
      if (d > halfWidth * 2.1) continue;
      const clear = d - needed;
      if (clear > bestClear) { bestClear = clear; lake = { ci, cj }; }
      if (clear >= 0) { lake = { ci, cj }; break; }
    }
    if (!lake) lake = { ci: cols * 0.5, cj: rows * 0.5 };
    lake.ax = Math.cos(lakeAngle);
    lake.ay = Math.sin(lakeAngle);
    lake.lobes = lobes;
    lake.noise = makePerlin2D(seed + 733);

    return { mainJ, tribJ, splitAt, lake };
  }

  // Reshape a raw 0..1 noise height by terrain type: "island" pulls the
  // edges down to water by distance from the map's center, "valley" carves
  // the winding canyon above with mountains rising away from it.
  function shapeHeight(rawHeight, i, j, cols, rows, terrainType, path) {
    if (terrainType === 'island') {
      const cx = cols / 2, cy = rows / 2;
      const radius = Math.min(cols, rows) / 2;
      const r = Math.max(0, Math.min(1, Math.hypot(i - cx, j - cy) / radius));
      return rawHeight * (1 - smoothstep(0.45, 0.98, r));
    }

    const halfWidth = rows * 0.16;
    let dist = Math.abs(j - path.mainJ(i));
    if (i >= path.splitAt) dist = Math.min(dist, Math.abs(j - path.tribJ(i)));
    const edgeFactor = smoothstep(0, 1, Math.max(0, Math.min(1, dist / halfWidth)));
    const centerHeight = rawHeight * 0.55;
    const edgeHeight = 0.8 + rawHeight * 0.15;
    let h = centerHeight * (1 - edgeFactor) + edgeHeight * edgeFactor;

    const riverCore = 1 - smoothstep(0, halfWidth * 0.3, dist);
    h = h * (1 - riverCore) + (rawHeight * 0.12) * riverCore;

    const L = path.lake;
    const wobble = 1 + 0.12 * L.noise(i * 0.45 + 17, j * 0.45 + 17);
    let ld = Infinity;
    for (const lobe of L.lobes) {
      const lx = L.ci + L.ax * lobe.off, ly = L.cj + L.ay * lobe.off;
      ld = Math.min(ld, Math.hypot(i - lx, j - ly) / (lobe.r * wobble));
    }
    const lakeCore = 1 - smoothstep(0.75, 1.0, ld);
    return h * (1 - lakeCore) + (rawHeight * 0.12) * lakeCore;
  }

  function shade(hex, factor) {
    const n = parseInt(hex.slice(1), 16);
    const f = 1 + factor;
    const cl = (v) => Math.max(0, Math.min(255, Math.round(v * f)));
    return `rgb(${cl((n >> 16) & 255)},${cl((n >> 8) & 255)},${cl(n & 255)})`;
  }

  // --- shore tiles ---
  // A cell that borders a lower band (land next to water, fields next to
  // shore, ...) is drawn as a shaped polygon instead of a full quad, picked
  // by which of its four sides face lower ground. Shapes are authored on a
  // 40x40 tile (from the shore mock) with the sides that face lower ground
  // listed; every rotation and mirror is generated from them, so each
  // water mask gets a few variants to pick from.
  const N = 1, E = 2, S = 4, W = 8;
  const SHORE_TEMPLATES = [
    // one side: a bite out of the water edge
    { water: N, pts: [[16.9,11.5],[25.6,1.8],[40,0],[40,40],[0,40],[0,0],[16.2,2.8]] },
    { water: N, pts: [[16.9,11.5],[30,10],[40,0],[40,40],[0,40],[0,0],[9.5,14]] },
    { water: S, pts: [[20,34.5],[10,34.5],[0,40],[0,0],[40,0],[40,40],[23.8,37.2]] },
    { water: E, pts: [[35,24],[38.2,25.6],[40,40],[0,40],[0,0],[40,0],[37.2,16.2]] },
    // two adjacent sides: a diagonal corner
    { water: N | W, pts: [[17,16.5],[40,0],[40,40],[0,40]] },
    { water: N | W, pts: [[18,30],[36,16],[40,0],[40,40],[0,40]] },
    { water: N | E, pts: [[15.5,24],[19,16],[28.5,18],[40,40],[0,40],[0,0],[13.5,13]] },
    // two opposite sides: a pinched strip
    { water: N | S, pts: [[0,9],[9,12.5],[20,10],[31,12],[40,8],[40,31],[29,28.5],[18,30.5],[8,28],[0,32]] },
    // three sides: a peninsula reaching out from the land side
    { water: N | W | S, pts: [[4.7,15.05],[15.4,7.2],[28.75,5.45],[27.85,9.8],[40,0],[40,40],[30.25,27.85],[12,32.15]] },
    // four sides: a small islet
    { water: N | E | S | W, pts: [[17.5,23.8],[7.2,24.6],[5.4,21.5],[11.2,11],[22.2,4.2],[28.6,7],[28,13.3]] },
  ];

  // water mask -> list of unit-square polygons ([[u, v], ...])
  const SHORE_SHAPES = (() => {
    const byMask = Array.from({ length: 16 }, () => []);
    // quarter turn clockwise (y points down): N->E->S->W
    const rotPt = ([u, v]) => [1 - v, u];
    const rotMask = (m) => ((m << 1) | (m >> 3)) & 15;
    // left-right mirror swaps E and W
    const mirPt = ([u, v]) => [1 - u, v];
    const mirMask = (m) => (m & (N | S)) | (m & E ? W : 0) | (m & W ? E : 0);
    for (const t of SHORE_TEMPLATES) {
      const unit = t.pts.map(([x, y]) => [x / 40, y / 40]);
      for (const [pts0, m0] of [[unit, t.water], [unit.map(mirPt), mirMask(t.water)]]) {
        let pts = pts0, m = m0;
        for (let r = 0; r < 4; r++) {
          byMask[m].push(pts);
          pts = pts.map(rotPt);
          m = rotMask(m);
        }
      }
    }
    return byMask;
  })();

  // bilinear map from the unit square onto a (possibly jittered) cell quad,
  // so straight tile edges land exactly on the shared cell edges
  function quadPoint(p00, p10, p11, p01, u, v) {
    const a = (1 - u) * (1 - v), b = u * (1 - v), c = u * v, d = (1 - u) * v;
    return {
      x: a * p00.x + b * p10.x + c * p11.x + d * p01.x,
      y: a * p00.y + b * p10.y + c * p11.y + d * p01.y,
    };
  }

  function cellHash(i, j, seed) {
    let h = Math.imul(i, 374761393) ^ Math.imul(j, 668265263) ^ seed;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return (h ^ (h >>> 16)) >>> 0;
  }

  function generateGrid(width, height, cellSize, jitter, noiseX, noiseY) {
    const margin = cellSize * 1.5;
    const cols = Math.ceil((width + margin * 2) / cellSize);
    const rows = Math.ceil((height + margin * 2) / cellSize);
    const points = [];
    for (let j = 0; j <= rows; j++) {
      const row = [];
      for (let i = 0; i <= cols; i++) {
        row.push({
          x: -margin + i * cellSize + noiseX(i * 0.9, j * 0.9) * cellSize * jitter,
          y: -margin + j * cellSize + noiseY(i * 0.9, j * 0.9) * cellSize * jitter,
        });
      }
      points.push(row);
    }
    return { points, cols, rows };
  }

  const ground = document.getElementById('ground');
  // the cloud layer sits above the builder but moves with the terrain
  const groundLayers = [ground, document.getElementById('clouds')];
  const canvas = document.getElementById('terrain');
  const ctx = canvas.getContext('2d');
  const legendEl = document.getElementById('optLegend');
  let seed = Math.floor(Math.random() * 1e9);

  // must match the builder's zoom-out limit and pan margin
  const MIN_ZOOM = 0.6, PAN_MARGIN = 160;
  const MAX_PIXELS = 16e6;
  let ext = { x: 0, y: 0, w: 0, h: 0 }, dpr = 1;
  let view = { zoom: 1, panX: 0, panY: 0 };
  const terrainListeners = [];
  const objectListeners = [];
  const routingListeners = [];
  // the last drawn grid, kept so bandAt() can answer what's under a point
  let grid = null;

  // sides of cell (i, j) whose neighbor sits below `level`; cells past the
  // grid edge never count as lower, so the border doesn't get a coastline
  function lowerMask(i, j, level) {
    const { levels, cols, rows } = grid;
    const below = (a, b) => b >= 0 && b < rows && a >= 0 && a < cols && levels[b][a] < level;
    return (below(i, j - 1) ? N : 0) | (below(i + 1, j) ? E : 0)
      | (below(i, j + 1) ? S : 0) | (below(i - 1, j) ? W : 0);
  }

  function cellQuad(i, j) {
    const { points } = grid;
    return [points[j][i], points[j][i + 1], points[j + 1][i + 1], points[j + 1][i]];
  }

  // outline of cell (i, j)'s layer at `level` (canvas coordinates): the full
  // quad, or the edge tile for the sides that face lower ground
  function layerShape(i, j, level) {
    const quad = cellQuad(i, j);
    const mask = lowerMask(i, j, level);
    if (!mask) return quad;
    const variants = SHORE_SHAPES[mask];
    const shape = variants[cellHash(i, j, grid.seed) % variants.length];
    return shape.map(([u, v]) => quadPoint(quad[0], quad[1], quad[2], quad[3], u, v));
  }

  // Masks only grow with the level, so every layer below the highest
  // unshaped one is fully hidden and never needs painting or hit-testing.
  function firstVisibleLayer(i, j) {
    for (let level = grid.levels[j][i]; level >= 1; level--) {
      if (!lowerMask(i, j, level)) return level;
    }
    return 1;
  }

  function pointInPolygon(x, y, pts) {
    let inside = false;
    for (let a = 0, b = pts.length - 1; a < pts.length; b = a++) {
      const pa = pts[a], pb = pts[b];
      if ((pa.y > y) !== (pb.y > y) && x < (pb.x - pa.x) * (y - pa.y) / (pb.y - pa.y) + pa.x) inside = !inside;
    }
    return inside;
  }

  // name of the band visibly painted at map point (x, y), or null off-grid
  function bandAt(x, y) {
    if (!grid) return null;
    const cx = x - ext.x, cy = y - ext.y;
    const i0 = Math.floor((cx + grid.margin) / grid.cell);
    const j0 = Math.floor((cy + grid.margin) / grid.cell);
    // jitter can push a point into a neighboring cell's quad
    for (let dj = -1; dj <= 1; dj++) {
      for (let di = -1; di <= 1; di++) {
        const i = i0 + di, j = j0 + dj;
        if (i < 0 || j < 0 || i >= grid.cols || j >= grid.rows) continue;
        if (!pointInPolygon(cx, cy, cellQuad(i, j))) continue;
        const bottom = firstVisibleLayer(i, j);
        for (let level = grid.levels[j][i]; level >= bottom; level--) {
          if (pointInPolygon(cx, cy, layerShape(i, j, level))) return grid.bands[level].name;
        }
        return grid.bands[Math.max(0, bottom - 1)].name;
      }
    }
    return null;
  }

  function measure() {
    const w = window.innerWidth, h = window.innerHeight;
    const ex = Math.ceil(w / (2 * MIN_ZOOM) - w / 2 + PAN_MARGIN);
    const ey = Math.ceil(h / (2 * MIN_ZOOM) - h / 2 + PAN_MARGIN);
    ext = { x: -ex, y: -ey, w: w + 2 * ex, h: h + 2 * ey };
    dpr = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(MAX_PIXELS / (ext.w * ext.h)));
    groundLayers.forEach((el) => {
      el.style.left = ext.x + 'px';
      el.style.top = ext.y + 'px';
      el.style.width = ext.w + 'px';
      el.style.height = ext.h + 'px';
      el.style.transformOrigin = (ex + w / 2) + 'px ' + (ey + h / 2) + 'px';
    });
    applyView();
  }

  // mirrors the builder's viewBox math: a map point x lands on screen at
  // (x + panX - W/2) * zoom + W/2
  function applyView() {
    const t = 'scale(' + view.zoom + ') translate(' + view.panX + 'px,' + view.panY + 'px)';
    groundLayers.forEach((el) => { el.style.transform = t; });
  }

  function draw() {
    const w = ext.w, h = ext.h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const s = currentSettings();
    const terrainType = els.terrainType.value;
    const bands = bandsFor([s.t0, s.t1, s.t2, s.t3, s.t4]);
    const perlinTerrain = makePerlin2D(seed);
    const perlinJX = makePerlin2D(seed + 101);
    const perlinJY = makePerlin2D(seed + 202);
    const ridged = makeRidgedMF(perlinTerrain, { octaves: s.oct, lacunarity: s.lac, gain: s.gain });

    const { points, cols, rows } = generateGrid(w, h, s.cell, s.jitter, perlinJX, perlinJY);
    const path = terrainType === 'valley' ? makeValleyPath(cols, rows, seed) : null;

    // sample every cell's band index once, at its unjittered center
    const levels = [];
    for (let j = 0; j < rows; j++) {
      const row = [];
      for (let i = 0; i < cols; i++) {
        const rawH = ridged((i + 0.5) * s.scale, (j + 0.5) * s.scale);
        row.push(bands.indexOf(bandFor(shapeHeight(rawH, i, j, cols, rows, terrainType, path), bands)));
      }
      levels.push(row);
    }
    grid = { points, levels, cols, rows, bands, cell: s.cell, margin: s.cell * 1.5, seed };

    // the base layer is all water; each higher band is stacked on top of it
    ctx.fillStyle = bands[0].color;
    ctx.fillRect(0, 0, w, h);

    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const top = levels[j][i];
        if (top === 0) continue;
        // Paint this cell once per band from Shore up to its own, each layer
        // shaped by the neighbors lying below it, so an edge bitten out of
        // a Hills cell shows the Fields (or lower) band underneath.
        const tint = perlinJX(i * 3.1 + 40, j * 3.1 + 40) * 0.05;
        for (let level = firstVisibleLayer(i, j); level <= top; level++) {
          const corners = layerShape(i, j, level);
          ctx.fillStyle = shade(bands[level].color, tint);
          ctx.beginPath();
          ctx.moveTo(corners[0].x, corners[0].y);
          for (let k = 1; k < corners.length; k++) ctx.lineTo(corners[k].x, corners[k].y);
          ctx.closePath();
          ctx.fill();
        }
      }
    }

    if (s.showGrid) {
      ctx.strokeStyle = '#2A2823';
      ctx.globalAlpha = 0.22;
      ctx.lineWidth = 1;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      for (const row of points) {
        ctx.moveTo(row[0].x, row[0].y);
        for (let i = 1; i < row.length; i++) ctx.lineTo(row[i].x, row[i].y);
      }
      for (let i = 0; i < points[0].length; i++) {
        ctx.moveTo(points[0][i].x, points[0][i].y);
        for (let j = 1; j < points.length; j++) ctx.lineTo(points[j][i].x, points[j][i].y);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    terrainListeners.forEach((fn) => fn());

    // legend reads high-to-low, Snow at top
    legendEl.innerHTML = bands.slice().reverse().map((b) =>
      `<span class="legend-row"><span class="swatch" style="background:${b.color}"></span>${b.name}</span>`
    ).join('');
  }

  function syncReadouts() {
    for (const k in DECIMALS) {
      document.getElementById('val-' + k).textContent = parseFloat(els[k].value).toFixed(DECIMALS[k]);
    }
  }

  let raf = null;
  function scheduleDraw() {
    syncReadouts();
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(draw);
  }

  const saveBtn = document.getElementById('optSave');
  function updateSaveLabel() { saveBtn.textContent = 'Save ' + els.terrainType.value + ' default'; }
  let saveTimer = null;

  // loading a preset must happen before the generic listeners redraw
  els.terrainType.addEventListener('change', () => {
    applyPreset(els.terrainType.value);
    clearTimeout(saveTimer);
    updateSaveLabel();
  });
  // tree sparseness and water crossing cost only change what the builder
  // draws on top, so they skip the (much slower) terrain redraw
  Object.values(els).forEach((el) => {
    if (el === els.sparse || el === els.waterCost) return;
    el.addEventListener('input', scheduleDraw);
    el.addEventListener('change', scheduleDraw);
  });
  els.sparse.addEventListener('input', () => {
    syncReadouts();
    objectListeners.forEach((fn) => fn());
  });
  els.waterCost.addEventListener('input', () => {
    syncReadouts();
    routingListeners.forEach((fn) => fn());
  });
  document.getElementById('optRegen').addEventListener('click', () => {
    seed = Math.floor(Math.random() * 1e9);
    scheduleDraw();
  });
  saveBtn.addEventListener('click', () => {
    PRESETS[els.terrainType.value] = currentSettings();
    saveBtn.textContent = persistPresets() ? 'Saved' : 'Could not save';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(updateSaveLabel, 1600);
  });

  window.addEventListener('resize', () => { measure(); scheduleDraw(); });

  window.MossTerrain = {
    extent: () => Object.assign({}, ext),
    setView(zoom, panX, panY) { view = { zoom, panX, panY }; applyView(); },
    regenerate() { seed = Math.floor(Math.random() * 1e9); scheduleDraw(); },
    bandAt,
    seed: () => seed,
    // called after every redraw, once bandAt() reflects the new terrain
    onTerrainChange(fn) { terrainListeners.push(fn); },
    // 0 = every object spot filled, 1 = no objects
    sparseness: () => parseFloat(els.sparse.value),
    // called when the sparseness slider moves
    onObjectsChange(fn) { objectListeners.push(fn); },
    // how many land steps one step across water is worth to a road
    waterCost: () => parseFloat(els.waterCost.value),
    // called when the water crossing cost slider moves
    onRoutingChange(fn) { routingListeners.push(fn); },
    // paint the on-screen map area (0,0)-(W,H) into another context, for PNG export
    drawWorld(target, outW, outH) {
      target.drawImage(canvas, -ext.x * dpr, -ext.y * dpr, window.innerWidth * dpr, window.innerHeight * dpr, 0, 0, outW, outH);
    },
  };

  applyPreset(els.terrainType.value);
  updateSaveLabel();
  syncReadouts();
  measure();
  draw();
})();
</script>
<script>
(function(){
  "use strict";
  // the map's coordinate space is the viewport itself (1 unit = 1 css px at
  // zoom 1), so it lines up with the terrain background drawn underneath
  var W = window.innerWidth, H = window.innerHeight;
  var svg = document.getElementById('map');
  var world = document.getElementById('world');
  var forestEl = document.getElementById('forest');
  var pondMaskGroup = document.getElementById('pondMaskGroup');

  function prand(seed){
    var s = Math.sin(seed * 127.1) * 43758.5453;
    return s - Math.floor(s);
  }
  var uid = 1;

  function randSeed(){ return Math.random()*1000; }
  // starter layout, authored on a 1200x800 board and scaled to the viewport
  function defaultFeatures(){
    function sx(v){ return v * W / 1200; }
    function sy(v){ return v * H / 800; }
    return [
      { id: uid++, type:'mountain', x:sx(260), y:sy(150), seed: randSeed() },
      { id: uid++, type:'pond',     x:sx(420), y:sy(290), r:60, seed: randSeed() },
      { id: uid++, type:'town',     x:sx(350), y:sy(195), seed: randSeed() },
      { id: uid++, type:'town',     x:sx(760), y:sy(330), seed: randSeed() },
      { id: uid++, type:'town',     x:sx(430), y:sy(600), seed: randSeed() },
      { id: uid++, type:'landmark', x:sx(250), y:sy(610), seed: randSeed() }
    ];
  }

  var state = { features: defaultFeatures(), history: [], mode: null, zoom: 1, panX: 0, panY: 0, pathSeeds: {} };

  function snapshot(){ return JSON.parse(JSON.stringify({ features: state.features, pathSeeds: state.pathSeeds })); }
  function pushHistory(){
    state.history.push(snapshot());
    if (state.history.length > 40) state.history.shift();
    updateUndoBtn();
  }
  function undo(){
    if (!state.history.length) return;
    var prev = state.history.pop();
    state.features = prev.features;
    state.pathSeeds = prev.pathSeeds || {};
    updateUndoBtn();
    render();
  }

  // per-edge seed overrides, set when a path is clicked to re-roll its shape —
  // falls back to the deterministic endpoint-derived seed until then
  function pathSeed(key, baseSeed){
    return state.pathSeeds[key] != null ? state.pathSeeds[key] : baseSeed;
  }
  function rerollPath(key){
    pushHistory();
    state.pathSeeds[key] = randSeed();
    render();
  }
  function updateUndoBtn(){ document.getElementById('undoBtn').disabled = state.history.length === 0; }

  /* ---------------- curve + geometry helpers ---------------- */
  function curvePath(p1, p2, strength, seedExtra){
    var dx = p2.x-p1.x, dy = p2.y-p1.y;
    var len = Math.hypot(dx,dy) || 1;
    var nx = -dy/len, ny = dx/len;
    var seed = p1.x*13.1 + p1.y*7.7 + p2.x*3.3 + p2.y*19.9 + (seedExtra||0);
    var r = (prand(seed) - 0.5) * 2;
    var mx = (p1.x+p2.x)/2 + nx * r * len * strength;
    var my = (p1.y+p2.y)/2 + ny * r * len * strength;
    return { p1:p1, p2:p2, mid:{x:mx,y:my} };
  }
  function samplePoints(c, steps){
    var pts = [];
    for (var i=0;i<=steps;i++){
      var t = i/steps;
      var x = (1-t)*(1-t)*c.p1.x + 2*(1-t)*t*c.mid.x + t*t*c.p2.x;
      var y = (1-t)*(1-t)*c.p1.y + 2*(1-t)*t*c.mid.y + t*t*c.p2.y;
      pts.push({x:x,y:y});
    }
    return pts;
  }
  function curveD(c){ return 'M '+c.p1.x+' '+c.p1.y+' Q '+c.mid.x+' '+c.mid.y+' '+c.p2.x+' '+c.p2.y; }

  // open Catmull-Rom spline through pts, rendered as cubic beziers — smooth, not jagged
  function catmullRomOpen(pts, tension){
    tension = tension || 1;
    var n = pts.length;
    if (n < 3) return 'M '+pts[0].x+' '+pts[0].y+' L '+pts[n-1].x+' '+pts[n-1].y;
    var d = 'M '+pts[0].x+' '+pts[0].y+' ';
    for (var i=0;i<n-1;i++){
      var p0 = i===0 ? pts[0] : pts[i-1];
      var p1 = pts[i], p2 = pts[i+1];
      var p3 = i+2<n ? pts[i+2] : p2;
      var c1x = p1.x + (p2.x-p0.x)/6*tension, c1y = p1.y + (p2.y-p0.y)/6*tension;
      var c2x = p2.x - (p3.x-p1.x)/6*tension, c2y = p2.y - (p3.y-p1.y)/6*tension;
      d += 'C '+c1x+' '+c1y+' '+c2x+' '+c2y+' '+p2.x+' '+p2.y+' ';
    }
    return d;
  }
  // meandering waypoints between two points — a real river snakes with a few
  // full bends, not one gentle arc
  function riverPoints(p1, p2, segments, amplitude, seedExtra){
    var dx=p2.x-p1.x, dy=p2.y-p1.y, len=Math.hypot(dx,dy)||1;
    var ux=dx/len, uy=dy/len, nx=-uy, ny=ux;
    var phase = prand(seedExtra*3.1+1) * Math.PI*2;
    var freq = 1.3 + prand(seedExtra*7.3+2) * 1.1;
    var pts = [p1];
    for (var i=1;i<segments;i++){
      var t = i/segments;
      var bx = p1.x+dx*t, by = p1.y+dy*t;
      var taper = Math.sin(Math.PI*t); // meet both endpoints exactly
      var wobble = Math.sin(t*Math.PI*2*freq + phase);
      var jitter = (prand(seedExtra*13.7 + i*5.3) - 0.5) * 0.5;
      var off = (wobble + jitter) * amplitude * taper;
      pts.push({ x: bx+nx*off, y: by+ny*off });
    }
    pts.push(p2);
    return pts;
  }

  /* jagged polyline for roads/spurs — real trails have irregular kinks, not one smooth arc */
  function jaggedPath(p1, p2, segments, jitter, seedExtra){
    var pts = [p1];
    var dx = p2.x-p1.x, dy = p2.y-p1.y;
    var len = Math.hypot(dx,dy) || 1;
    var nx = -dy/len, ny = dx/len;
    for (var i=1;i<segments;i++){
      var t = i/segments;
      var bx = p1.x + dx*t, by = p1.y + dy*t;
      var seed = p1.x*13.1 + p1.y*7.7 + p2.x*3.3 + p2.y*19.9 + (seedExtra||0) + i*11.37;
      var r = (prand(seed) - 0.5) * 2;
      var taper = Math.sin(Math.PI * t); // ease jitter to zero at both endpoints
      var off = r * jitter * taper;
      pts.push({ x: bx + nx*off, y: by + ny*off });
    }
    pts.push(p2);
    return pts;
  }
  function polyD(pts){
    var d = 'M '+pts[0].x+' '+pts[0].y;
    for (var i=1;i<pts.length;i++) d += ' L '+pts[i].x+' '+pts[i].y;
    return d;
  }

  function pointToSegmentDist(p, a, b){
    var dx=b.x-a.x, dy=b.y-a.y;
    var len2 = dx*dx+dy*dy;
    if (len2<1e-6) return Math.hypot(p.x-a.x,p.y-a.y);
    var t = ((p.x-a.x)*dx+(p.y-a.y)*dy)/len2;
    t = Math.max(0,Math.min(1,t));
    var cx=a.x+t*dx, cy=a.y+t*dy;
    return Math.hypot(p.x-cx,p.y-cy);
  }

  // waypoints that detour around any pond the direct a->b line would cut through
  function routeAroundPonds(a, b, ponds){
    var blocking = [];
    ponds.forEach(function(p){
      var r = (p.r||55) + 18;
      if (pointToSegmentDist(p, a, b) < r) blocking.push({ p:p, r:r });
    });
    if (!blocking.length) return [a, b];
    var dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
    var ux=dx/len, uy=dy/len, nx=-uy, ny=ux;
    blocking.forEach(function(bl){ bl.t = (bl.p.x-a.x)*ux + (bl.p.y-a.y)*uy; });
    blocking.sort(function(x,y){ return x.t-y.t; });
    var pts = [a];
    blocking.forEach(function(bl){
      var side = ((bl.p.x-a.x)*nx + (bl.p.y-a.y)*ny) >= 0 ? -1 : 1; // go around the side with less line already on it
      var tEntry = bl.t - bl.r*1.25, tExit = bl.t + bl.r*1.25;
      pts.push({ x: a.x + ux*tEntry + nx*bl.r*side, y: a.y + uy*tEntry + ny*bl.r*side });
      pts.push({ x: a.x + ux*tExit  + nx*bl.r*side, y: a.y + uy*tExit  + ny*bl.r*side });
    });
    pts.push(b);
    return pts;
  }

  function buildRoutePts(a, b, segs, amp, seedExtra, ponds){
    var waypoints = routeAroundPonds(a, b, ponds);
    if (waypoints.length === 2) return riverPoints(a, b, segs, amp, seedExtra);
    var out = [waypoints[0]];
    for (var i=0;i<waypoints.length-1;i++){
      var legSegs = Math.max(3, Math.round(segs / (waypoints.length-1)));
      var legAmp = i===0 || i===waypoints.length-2 ? amp*0.7 : amp*0.35;
      var leg = riverPoints(waypoints[i], waypoints[i+1], legSegs, legAmp, seedExtra + i*7);
      out = out.concat(leg.slice(1));
    }
    return out;
  }

  // final safety pass: push any point that still ends up inside a pond back out to its edge
  function nudgeOutOfPonds(pts, ponds, buffer){
    for (var i=1;i<pts.length-1;i++){
      ponds.forEach(function(p){
        var r = (p.r||55) + buffer;
        var dx = pts[i].x-p.x, dy = pts[i].y-p.y;
        var d = Math.hypot(dx,dy);
        if (d < r){
          var ux = d>0.1 ? dx/d : 1, uy = d>0.1 ? dy/d : 0;
          pts[i].x = p.x + ux*r;
          pts[i].y = p.y + uy*r;
        }
      });
    }
  }

  function segIntersect(a1,a2,b1,b2){
    var d = (a2.x-a1.x)*(b2.y-b1.y) - (a2.y-a1.y)*(b2.x-b1.x);
    if (Math.abs(d) < 1e-9) return null;
    var t = ((b1.x-a1.x)*(b2.y-b1.y) - (b1.y-a1.y)*(b2.x-b1.x))/d;
    var u = ((b1.x-a1.x)*(a2.y-a1.y) - (b1.y-a1.y)*(a2.x-a1.x))/d;
    if (t>=0 && t<=1 && u>=0 && u<=1){
      return { x:a1.x+t*(a2.x-a1.x), y:a1.y+t*(a2.y-a1.y), angle: Math.atan2(a2.y-a1.y, a2.x-a1.x)*180/Math.PI };
    }
    return null;
  }
  // closed Catmull-Rom spline through pts, rendered as cubic beziers
  function catmullRomClosed(pts, tension){
    tension = tension || 1;
    var n = pts.length;
    var d = 'M '+pts[0].x+' '+pts[0].y+' ';
    for (var i=0;i<n;i++){
      var p0 = pts[(i-1+n)%n], p1 = pts[i], p2 = pts[(i+1)%n], p3 = pts[(i+2)%n];
      var c1x = p1.x + (p2.x-p0.x)/6*tension, c1y = p1.y + (p2.y-p0.y)/6*tension;
      var c2x = p2.x - (p3.x-p1.x)/6*tension, c2y = p2.y - (p3.y-p1.y)/6*tension;
      d += 'C '+c1x+' '+c1y+' '+c2x+' '+c2y+' '+p2.x+' '+p2.y+' ';
    }
    return d + 'Z';
  }
  // an organic bean-ish blob instead of a perfect circle, stable per pond via its id
  function pondBlobPath(cx, cy, r, seed){
    var N = 10;
    var pts = [];
    for (var i=0;i<N;i++){
      var angle = (i/N) * Math.PI * 2;
      var jitter = 0.72 + prand(seed*3.7 + i*12.9) * 0.56; // ~0.72–1.28x radius
      var rad = r * jitter;
      pts.push({ x: cx + Math.cos(angle)*rad, y: cy + Math.sin(angle)*rad });
    }
    return catmullRomClosed(pts, 1);
  }

  function nearestPointOnList(pt, list){
    var best = null, bd = Infinity;
    for (var i=0;i<list.length;i++){
      var d = Math.hypot(pt.x-list[i].x, pt.y-list[i].y);
      if (d < bd){ bd = d; best = list[i]; }
    }
    return { pt:best, dist:bd };
  }

  var ICON_HALF = { town:{w:19.5,h:15.5}, mountain:{w:18,h:10.5}, landmark:{w:13,h:12.5} };
  var CLEAR_R = { town:78, mountain:70, landmark:42, tree:24 };
  var HIT_R = { town:52, mountain:45, pond:0, landmark:26, tree:20 };

  // non-pond objects can't sit on water — push a point out to just past the
  // shore of any lake it lands in
  function keepOutOfPonds(pt, buffer){
    var p = { x: pt.x, y: pt.y };
    state.features.forEach(function(pd){
      if (pd.type !== 'pond') return;
      var dx = p.x-pd.x, dy = p.y-pd.y;
      var d = Math.hypot(dx,dy);
      var r = (pd.r||55) + buffer;
      if (d < r){
        var ux = d>0.1 ? dx/d : 1, uy = d>0.1 ? dy/d : 0;
        p.x = pd.x + ux*r;
        p.y = pd.y + uy*r;
      }
    });
    return p;
  }
  // dropping a new lake (or dragging one) onto other objects pushes them out
  // from under it rather than letting them sit underwater
  function displaceFromPond(pond){
    state.features.forEach(function(f){
      if (f === pond || f.type === 'pond') return;
      var dx = f.x-pond.x, dy = f.y-pond.y;
      var d = Math.hypot(dx,dy);
      var r = (pond.r||55) + 20;
      if (d < r){
        var ux = d>0.1 ? dx/d : 1, uy = d>0.1 ? dy/d : 0;
        f.x = Math.max(10, Math.min(W-10, pond.x + ux*r));
        f.y = Math.max(10, Math.min(H-10, pond.y + uy*r));
      }
    });
  }

  function mst(nodes){
    var edges = [];
    if (nodes.length < 2) return edges;
    var inTree = [0], remaining = nodes.map(function(_,i){return i;}).slice(1);
    while (remaining.length){
      var best=null, bestDist=Infinity, bestIdx=-1;
      for (var i=0;i<inTree.length;i++){
        for (var j=0;j<remaining.length;j++){
          var a=nodes[inTree[i]], b=nodes[remaining[j]];
          var d=Math.hypot(a.x-b.x,a.y-b.y);
          if (d<bestDist){ bestDist=d; best={a:inTree[i],b:remaining[j]}; bestIdx=j; }
        }
      }
      edges.push([best.a, best.b]);
      inTree.push(remaining[bestIdx]);
      remaining.splice(bestIdx,1);
    }
    return edges;
  }
  function edgeKey(i,j){ return i<j ? i+'-'+j : j+'-'+i; }

  // true when every point sits within `thresh` units of the set's best-fit line —
  // used to skip redundant roads when towns are strung out in a row
  function isRoughlyCollinear(pts, thresh){
    if (pts.length < 3) return true;
    var n = pts.length, mx=0, my=0;
    pts.forEach(function(p){ mx+=p.x; my+=p.y; });
    mx/=n; my/=n;
    var sxx=0, syy=0, sxy=0;
    pts.forEach(function(p){
      var dx=p.x-mx, dy=p.y-my;
      sxx+=dx*dx; syy+=dy*dy; sxy+=dx*dy;
    });
    var theta = 0.5*Math.atan2(2*sxy, sxx-syy);
    var mnx = -Math.sin(theta), mny = Math.cos(theta); // minor-axis direction
    var maxDev = 0;
    pts.forEach(function(p){
      var dx=p.x-mx, dy=p.y-my;
      var dev = Math.abs(dx*mnx + dy*mny);
      if (dev > maxDev) maxDev = dev;
    });
    return maxDev < thresh;
  }

  /* ---------------- render ---------------- */
  function render(){
    var mountains = state.features.filter(function(f){return f.type==='mountain';});
    var ponds     = state.features.filter(function(f){return f.type==='pond';});
    var towns     = state.features.filter(function(f){return f.type==='town';});
    var landmarks = state.features.filter(function(f){return f.type==='landmark';});
    var placedTrees = state.features.filter(function(f){return f.type==='tree';});

    var riverCurves = [], riverSamples = [];
    mountains.forEach(function(m, mi){
      if (!ponds.length) return;
      var nearest=ponds[0], nd=Infinity;
      ponds.forEach(function(p){ var d=Math.hypot(m.x-p.x,m.y-p.y); if (d<nd){nd=d; nearest=p;} });
      var len = Math.hypot(m.x-nearest.x, m.y-nearest.y);
      var segs = Math.max(8, Math.min(16, Math.round(len/45)));
      var amp = Math.max(16, Math.min(46, len*0.11));
      var key = 'river-'+edgeKey(m.id, nearest.id);
      var pts = riverPoints(m, nearest, segs, amp, pathSeed(key, (m.seed||m.id) + (nearest.seed||nearest.id)));
      riverCurves.push({ pts: pts, key: key });
      riverSamples = riverSamples.concat(pts);
    });

    // rivers between separate lakes too, so a chain of ponds reads as one
    // connected watershed — skip pairs already merged into a single blob
    if (ponds.length > 1){
      var pondIdxEdges = mst(ponds);
      pondIdxEdges.forEach(function(e, pi){
        var a = ponds[e[0]], b = ponds[e[1]];
        var d = Math.hypot(a.x-b.x, a.y-b.y);
        if (d < (a.r||55) + (b.r||55) + 10) return; // already visually one lake
        var segs = Math.max(8, Math.min(16, Math.round(d/45)));
        var amp = Math.max(14, Math.min(40, d*0.1));
        var key = 'river-'+edgeKey(a.id, b.id);
        var pts = riverPoints(a, b, segs, amp, pathSeed(key, (a.seed||a.id) + (b.seed||b.id)));
        riverCurves.push({ pts: pts, key: key });
        riverSamples = riverSamples.concat(pts);
      });
    }

    // when several mountains (or lakes) drain toward the same water, their
    // rivers can start out nearly parallel and overlap into what reads as a
    // single river — pull them apart so each stays visible as its own strand
    if (riverCurves.length > 1){
      var riverPtsList = riverCurves.map(function(c){ return c.pts; });
      separateAllPaths(riverPtsList, 22, 3);
      riverPtsList.forEach(function(p){ nudgeOutOfPonds(p, ponds, 14); });
      riverSamples = [];
      riverPtsList.forEach(function(p){ riverSamples = riverSamples.concat(p); });
    }

    // roads: spanning tree (guarantees every town reachable) unioned with each
    // town's 2 nearest neighbors, so well-clustered towns pick up several
    // redundant routes while isolated ones stay lightly connected.
    var roadIdxEdges = mst(towns);
    var treeEdgeCount = roadIdxEdges.length;
    var edgeSet = {};
    roadIdxEdges.forEach(function(e){ edgeSet[edgeKey(e[0],e[1])] = true; });
    if (towns.length > 2 && !isRoughlyCollinear(towns, 40)){
      towns.forEach(function(t,i){
        var dists = [];
        towns.forEach(function(t2,j){
          if (i===j) return;
          dists.push({ j:j, d: Math.hypot(t.x-t2.x,t.y-t2.y) });
        });
        dists.sort(function(a,b){ return a.d-b.d; });
        var k = Math.min(2, dists.length);
        for (var n=0;n<k;n++){
          var nj = dists[n].j;
          if (!edgeSet[edgeKey(i,nj)]){
            edgeSet[edgeKey(i,nj)] = true;
            roadIdxEdges.push([i,nj]);
          }
        }
      });
    }

    // degree per town — hubs with more roads render bigger
    var townDegree = towns.map(function(){ return 0; });
    roadIdxEdges.forEach(function(e){ townDegree[e[0]]++; townDegree[e[1]]++; });

    function nudgeParallel(pts){
      // interior points only — keep both endpoints anchored to their feature
      for (var i=1;i<pts.length-1;i++){
        var near = nearestPointOnList(pts[i], riverSamples);
        if (near.pt && near.dist < 44 && near.dist > 14){
          var k = riverSamples.indexOf(near.pt);
          var t2 = riverSamples[Math.min(k+1, riverSamples.length-1)];
          var tdx = t2.x-near.pt.x, tdy = t2.y-near.pt.y;
          var tl = Math.hypot(tdx,tdy)||1;
          var nx = -tdy/tl, ny = tdx/tl;
          var side = ((pts[i].x-near.pt.x)*nx + (pts[i].y-near.pt.y)*ny) >= 0 ? 1 : -1;
          var targetX = near.pt.x + nx*30*side, targetY = near.pt.y + ny*30*side;
          pts[i].x = pts[i].x*0.35 + targetX*0.65;
          pts[i].y = pts[i].y*0.35 + targetY*0.65;
        }
      }
    }

    // mutual separation pass across every road/spur pair — moves BOTH sides apart,
    // several passes, so no two paths end up tracing on top of each other anywhere
    // along their length, not just near their shared endpoints
    function separateAllPaths(allPts, minDist, iterations){
      for (var pass=0; pass<iterations; pass++){
        for (var a=0; a<allPts.length; a++){
          for (var b=a+1; b<allPts.length; b++){
            var A = allPts[a], B = allPts[b];
            for (var i=1;i<A.length-1;i++){
              var near = nearestPointOnList(A[i], B);
              if (!near.pt || near.dist >= minDist || near.dist <= 0.1) continue;
              var dx=A[i].x-near.pt.x, dy=A[i].y-near.pt.y;
              var dl=Math.hypot(dx,dy)||1;
              var ux=dx/dl, uy=dy/dl;
              var push=(minDist-near.dist)*0.5;
              A[i].x += ux*push; A[i].y += uy*push;
              var j = B.indexOf(near.pt);
              if (j>0 && j<B.length-1){ B[j].x -= ux*push; B[j].y -= uy*push; }
            }
          }
        }
      }
    }

    function nudgeAwayFromRoads(pts, placedRoadsPts, minDist){
      for (var pass=0; pass<2; pass++){
        for (var i=1;i<pts.length-1;i++){
          for (var r=0;r<placedRoadsPts.length;r++){
            var near = nearestPointOnList(pts[i], placedRoadsPts[r]);
            if (near.pt && near.dist < minDist && near.dist > 0.1){
              var dx = pts[i].x-near.pt.x, dy = pts[i].y-near.pt.y;
              var dl = Math.hypot(dx,dy) || 1;
              var push = (minDist - near.dist) * 0.6;
              pts[i].x += (dx/dl) * push;
              pts[i].y += (dy/dl) * push;
            }
          }
        }
      }
    }

    var roadCurves = [], roadSamples = [], placedRoadPts = [];
    roadIdxEdges.forEach(function(e, idx){
      var a = towns[e[0]], b = towns[e[1]];
      var len = Math.hypot(a.x-b.x, a.y-b.y);
      var segs = Math.max(6, Math.min(12, Math.round(len/60)));
      var amp = Math.max(10, Math.min(24, len*0.055));
      var key = 'road-'+edgeKey(a.id, b.id);
      var pts = buildRoutePts(a, b, segs, amp, pathSeed(key, (a.seed||a.id) + (b.seed||b.id) + idx*0.01), ponds);
      nudgeParallel(pts);
      nudgeAwayFromRoads(pts, placedRoadPts, 28);
      nudgeOutOfPonds(pts, ponds, 18);
      roadCurves.push({ pts: pts, key: key });
      roadSamples = roadSamples.concat(pts);
      placedRoadPts.push(pts);
    });

    // candidate connection points for spurs, each tagged with which road/spur
    // curve (or town) it belongs to, so a landmark doesn't fan out twice into
    // the same route
    var roadLikeTagged = [];
    roadCurves.forEach(function(c, ci){
      c.pts.forEach(function(pt){ roadLikeTagged.push({ x:pt.x, y:pt.y, src:'road'+ci }); });
    });
    towns.forEach(function(t){ roadLikeTagged.push({ x:t.x, y:t.y, src:'town'+t.id }); });

    // spurs: each landmark connects to its nearest road/town, then fans out to
    // extra roads/towns too — as long as there's real room: the extra target
    // sits a meaningfully different direction away and isn't much further
    var spurCurves = [];
    landmarks.forEach(function(lm){
      var candidates = roadLikeTagged.map(function(c){
        return { x:c.x, y:c.y, src:c.src, d: Math.hypot(lm.x-c.x, lm.y-c.y), angle: Math.atan2(c.y-lm.y, c.x-lm.x) };
      }).sort(function(a,b){ return a.d-b.d; });
      if (!candidates.length) return;

      var chosen = [];
      var usedSrc = {};
      var primaryDist = candidates[0].d;
      candidates.forEach(function(cand){
        if (chosen.length >= 3) return;
        if (usedSrc[cand.src]) return; // don't fan into the same road/town twice
        if (cand.d > Math.max(140, primaryDist*1.7) || cand.d > 320) return; // too far to be "room to draw"
        var farEnoughInAngle = chosen.every(function(pick){
          var da = Math.abs(cand.angle - pick.angle);
          da = Math.min(da, Math.PI*2-da);
          return da > 0.75; // ~43deg apart, so lines actually fan out rather than bunch
        });
        if (!farEnoughInAngle) return;
        chosen.push(cand);
        usedSrc[cand.src] = true;
      });

      chosen.forEach(function(target, ti){
        var len2 = Math.hypot(lm.x-target.x, lm.y-target.y);
        var segs2 = Math.max(4, Math.min(7, Math.round(len2/45)));
        var amp2 = Math.max(8, Math.min(18, len2*0.05));
        var spurKey = 'spur-'+lm.id+'-'+ti;
        var pts2 = buildRoutePts(lm, target, segs2, amp2, pathSeed(spurKey, (lm.seed||lm.id) + ti*17), ponds);
        nudgeParallel(pts2);
        nudgeAwayFromRoads(pts2, placedRoadPts, 22);
        nudgeOutOfPonds(pts2, ponds, 18);
        spurCurves.push({ pts: pts2, key: spurKey });
        placedRoadPts.push(pts2);
      });
    });

    // global cleanup pass: pull apart any roads/spurs still running too close
    // together anywhere along their length, then re-check pond clearance
    separateAllPaths(placedRoadPts, 30, 3);
    placedRoadPts.forEach(function(p){ nudgeOutOfPonds(p, ponds, 18); });

    // where a road or spur would cross the terrain's water, re-route that
    // stretch to go around it or cross where it's narrowest
    roadCurves.forEach(rerouteAroundWater);
    spurCurves.forEach(rerouteAroundWater);

    // enclosed loops (redundant roads create a cycle around a town cluster) —
    // trace the loop's actual road curves and clear the forest inside it
    var enclosedLoopFills = [];
    if (roadIdxEdges.length > treeEdgeCount){
      var treeAdj = {};
      for (var te=0; te<treeEdgeCount; te++){
        var a0 = roadIdxEdges[te][0], b0 = roadIdxEdges[te][1];
        (treeAdj[a0] = treeAdj[a0]||[]).push({ to:b0, edgeIdx:te });
        (treeAdj[b0] = treeAdj[b0]||[]).push({ to:a0, edgeIdx:te });
      }
      function bfsTreePath(start, end){
        var visited = {}; visited[start]=true;
        var queue = [{ node:start, path:[] }];
        while (queue.length){
          var cur = queue.shift();
          if (cur.node === end) return cur.path;
          (treeAdj[cur.node]||[]).forEach(function(edge){
            if (!visited[edge.to]){
              visited[edge.to] = true;
              queue.push({ node:edge.to, path:cur.path.concat([{ from:cur.node, to:edge.to, edgeIdx:edge.edgeIdx }]) });
            }
          });
        }
        return null;
      }
      for (var ex=treeEdgeCount; ex<roadIdxEdges.length; ex++){
        var ei = roadIdxEdges[ex][0], ej = roadIdxEdges[ex][1];
        var treePath = bfsTreePath(ei, ej);
        if (!treePath || !treePath.length) continue;
        var cycleEdges = treePath.concat([{ from:ej, to:ei, edgeIdx:ex }]);
        var loopPts = [];
        cycleEdges.forEach(function(edge, idx){
          var srcEdge = roadIdxEdges[edge.edgeIdx];
          var raw = roadCurves[edge.edgeIdx].pts;
          var oriented = (srcEdge[0] === edge.from) ? raw : raw.slice().reverse();
          loopPts = loopPts.concat(idx===0 ? oriented : oriented.slice(1));
        });
        enclosedLoopFills.push(loopPts);
      }
    }

    // roads/spurs should meet a river head-on rather than at a shallow angle —
    // rotate the crossing segment around the intersection point so its local
    // direction is perpendicular to the river's tangent there
    function snapPerpendicularAtCrossings(curves){
      curves.forEach(function(rc){
        for (var i=0;i<rc.pts.length-1;i++){
          for (var ri=0; ri<riverCurves.length; ri++){
            var rivpts = riverCurves[ri].pts;
            for (var j=0;j<rivpts.length-1;j++){
              var hit = segIntersect(rc.pts[i], rc.pts[i+1], rivpts[j], rivpts[j+1]);
              if (!hit) continue;
              var tx = rivpts[j+1].x-rivpts[j].x, ty = rivpts[j+1].y-rivpts[j].y;
              var tl = Math.hypot(tx,ty) || 1;
              tx/=tl; ty/=tl;
              var px = -ty, py = tx; // perpendicular to the river tangent
              var rx = rc.pts[i+1].x-rc.pts[i].x, ry = rc.pts[i+1].y-rc.pts[i].y;
              if (rx*px + ry*py < 0){ px=-px; py=-py; } // keep the road's original general direction
              var d0 = Math.hypot(rc.pts[i].x-hit.x, rc.pts[i].y-hit.y);
              var d1 = Math.hypot(rc.pts[i+1].x-hit.x, rc.pts[i+1].y-hit.y);
              rc.pts[i]   = { x: hit.x - px*d0, y: hit.y - py*d0 };
              rc.pts[i+1] = { x: hit.x + px*d1, y: hit.y + py*d1 };
            }
          }
        }
      });
    }
    snapPerpendicularAtCrossings(roadCurves);
    snapPerpendicularAtCrossings(spurCurves);

    // if a road/spur would cross a river right where a feature icon sits, slide
    // that segment along the river until the crossing lands on empty water
    function featureClearance(f){
      return f.type === 'pond' ? (f.r||55) + 15 : (CLEAR_R[f.type] || 30);
    }
    function pointCollides(pt){
      for (var i=0;i<state.features.length;i++){
        var f = state.features[i];
        if (Math.hypot(pt.x-f.x, pt.y-f.y) < featureClearance(f)) return true;
      }
      return false;
    }
    function avoidBridgeCollisions(curves){
      curves.forEach(function(rc){
        for (var i=0;i<rc.pts.length-1;i++){
          for (var pass=0; pass<6; pass++){ // a fix can shift into a new collision, so retry
            var moved = false;
            for (var ri=0; ri<riverCurves.length; ri++){
              var rivpts = riverCurves[ri].pts;
              for (var j=0;j<rivpts.length-1;j++){
                var hit = segIntersect(rc.pts[i], rc.pts[i+1], rivpts[j], rivpts[j+1]);
                if (!hit || !pointCollides(hit)) continue;
                var tx = rivpts[j+1].x-rivpts[j].x, ty = rivpts[j+1].y-rivpts[j].y;
                var tl = Math.hypot(tx,ty) || 1;
                tx/=tl; ty/=tl;
                var fixed = false;
                var steps = [26,52,78,104,130,-26,-52,-78,-104,-130];
                for (var s=0;s<steps.length && !fixed;s++){
                  var shift = steps[s];
                  var np1 = { x: rc.pts[i].x + tx*shift, y: rc.pts[i].y + ty*shift };
                  var np2 = { x: rc.pts[i+1].x + tx*shift, y: rc.pts[i+1].y + ty*shift };
                  var hit2 = segIntersect(np1, np2, rivpts[j], rivpts[j+1]);
                  if (hit2 && !pointCollides(hit2)){
                    rc.pts[i] = np1; rc.pts[i+1] = np2;
                    fixed = true; moved = true;
                  }
                }
                if (fixed) break;
              }
              if (moved) break;
            }
            if (!moved) break;
          }
        }
      });
    }
    avoidBridgeCollisions(roadCurves);
    avoidBridgeCollisions(spurCurves);

    // bridges: where a road/spur polyline crosses a river curve
    var bridges = [];
    function findBridges(curves){
      curves.forEach(function(rc){
        var rpts = rc.pts;
        riverCurves.forEach(function(riv){
          var rivpts = riv.pts;
          for (var i=0;i<rpts.length-1;i++){
            for (var j=0;j<rivpts.length-1;j++){
              var hit = segIntersect(rpts[i], rpts[i+1], rivpts[j], rivpts[j+1]);
              if (hit){
                var dup = bridges.some(function(b){ return Math.hypot(b.x-hit.x,b.y-hit.y) < 18; });
                if (!dup) bridges.push(hit);
              }
            }
          }
        });
      });
    }
    findBridges(roadCurves);
    findBridges(spurCurves);

    // Roads cross the terrain's water on straight bridges: each road and
    // spur is traced along its drawn curve, and every stretch over the Water
    // band (plus a little bank on each side) is replaced by a straight span
    // from bank to bank, which gets a plank deck. c.line is the final
    // centerline and c.d the path actually drawn.
    var waterBridges = [];
    function bridgeWaterCrossings(curves, deck){
      curves.forEach(function(rc){
        var line = curveLine(rc.pts);
        rc.line = line; rc.d = catmullRomOpen(rc.pts, 1);
        if (!window.MossTerrain || rc.pts.length < 2) return;
        line = resamplePolyline(line, 3);
        var runs = [], start = -1;
        for (var k = 0; k <= line.length; k++){
          var wet = k < line.length && window.MossTerrain.bandAt(line[k].x, line[k].y) === 'Water';
          if (wet && start < 0) start = k;
          if (!wet && start >= 0){
            var from = Math.max(0, start-2), to = Math.min(line.length-1, k+1);
            var prev = runs[runs.length-1];
            if (prev && from <= prev.to) prev.to = to; else runs.push({ from:from, to:to });
            start = -1;
          }
        }
        if (!runs.length) return;
        var out = [], next = 0;
        runs.forEach(function(r){
          out = out.concat(line.slice(next, r.from + 1));
          out.push(line[r.to]);
          next = r.to + 1;
          waterBridges.push({ pts:[line[r.from], line[r.to]], deck:deck });
        });
        out = out.concat(line.slice(next));
        rc.line = out;
        rc.d = polyD(out.map(function(p){ return { x:Math.round(p.x*10)/10, y:Math.round(p.y*10)/10 }; }));
      });
    }
    bridgeWaterCrossings(roadCurves, 12);
    bridgeWaterCrossings(spurCurves, 9);
    // a river crossing on a straight span is already covered by its deck
    bridges = bridges.filter(function(b){
      return !waterBridges.some(function(wb){ return distToSegmentSq(b.x, b.y, wb.pts[0], wb.pts[1]) < 144; });
    });

    // forest clearings: circles around features, the ground inside road
    // loops, and corridors along rivers, roads and spurs
    forestClearings = {
      circles: state.features.map(function(f){
        return { x:f.x, y:f.y, r: f.type==='pond' ? (f.r||55)+18 : (CLEAR_R[f.type]||30) };
      }),
      polygons: enclosedLoopFills,
      corridors: []
    };
    riverCurves.forEach(function(c){ forestClearings.corridors.push(corridorOf(curveLine(c.pts), 12)); });
    roadCurves.forEach(function(c){ forestClearings.corridors.push(corridorOf(c.line, 12)); });
    spurCurves.forEach(function(c){ forestClearings.corridors.push(corridorOf(c.line, 9)); });
    drawForest();

    // pond mask (goo merge)
    pondMaskGroup.innerHTML = ponds.map(function(p){
      return '<path d="'+pondBlobPath(p.x, p.y, p.r||55, p.id)+'" fill="white"/>';
    }).join('');

    /* ---- build world markup ---- */
    var parts = [];

    // wide, invisible stroke behind each path so it's easy to click without
    // hitting the exact centerline; clicking it re-rolls just that path's shape
    function pathHit(d, key){
      return '<path class="path-hit" data-pathkey="'+key+'" d="'+d+'" fill="none" stroke="transparent" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" style="cursor:pointer;pointer-events:stroke"/>';
    }

    var riverMarkup = riverCurves.map(function(c){
      var d = catmullRomOpen(c.pts, 1);
      return '<path d="'+d+'" fill="none" stroke="#4fa5a3" stroke-width="9" stroke-linecap="round"/>'+
             '<path d="'+d+'" fill="none" stroke="#8fdbd2" stroke-width="5" stroke-linecap="round"/>'+
             pathHit(d, c.key);
    }).join('');
    parts.push(riverMarkup);

    var roadMarkup = roadCurves.map(function(c){
      var d = c.d;
      return '<path d="'+d+'" fill="none" stroke="#948aa8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>'+
             '<path d="'+d+'" fill="none" stroke="#bbb2cb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 10"/>'+
             pathHit(d, c.key);
    }).join('');
    parts.push(roadMarkup);

    var spurMarkup = spurCurves.map(function(c){
      var d = c.d;
      return '<path d="'+d+'" fill="none" stroke="#948aa8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>'+
             pathHit(d, c.key);
    }).join('');
    parts.push(spurMarkup);

    // water bridges sit on the road but under the features; each layer is
    // drawn for every bridge before the next, so bridges that meet or
    // overlap (roads joining over water) merge into one deck
    var bridgeLayers = [
      function(b){ return 'stroke="#6b4a30" stroke-width="'+(b.deck+3.2)+'"'; },
      function(b){ return 'stroke="#a9835a" stroke-width="'+b.deck+'"'; },
      function(b){ return 'stroke="#6b4a30" stroke-opacity=".55" stroke-width="'+b.deck+'" stroke-dasharray="1.2 4.5"'; }
    ];
    if (waterBridges.length){
      parts.push('<g fill="none" stroke-linejoin="round" style="pointer-events:none">');
      bridgeLayers.forEach(function(layer){
        waterBridges.forEach(function(b){ parts.push('<path d="'+polyD(b.pts)+'" '+layer(b)+'/>'); });
      });
      parts.push('</g>');
    }

    // ponds (masked pattern rect showing merged blobs) + invisible drag hit circles
    var pext = window.MossTerrain ? window.MossTerrain.extent() : { x:0, y:0, w:W, h:H };
    parts.push('<rect x="'+pext.x+'" y="'+pext.y+'" width="'+pext.w+'" height="'+pext.h+'" fill="url(#pondPattern)" mask="url(#pondMask)" style="pointer-events:none"></rect>');
    ponds.forEach(function(p){
      parts.push('<circle class="feature" data-id="'+p.id+'" data-type="pond" cx="'+p.x+'" cy="'+p.y+'" r="'+(p.r||55)+'" fill="transparent" style="pointer-events:all"></circle>');
    });

    mountains.forEach(function(m){

  /* ---------------- pointer coordinate helper ---------------- */
  function toSvgPoint(e){
    var pt = svg.createSVGPoint();

    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  /* ---------------- dragging placed objects ---------------- */
  function wireDraggable(){
    var els = world.querySelectorAll('.feature');
    els.forEach(function(el){
      el.addEventListener('pointerdown', function(e){
        if (e.button === 2) return; // right button pans the map instead of dragging the feature
        if (state.mode === 'erase') return; // let this bubble to the erase hit-test
        e.stopPropagation();
        // dragging an existing object should never also place a new one under it,
        // even while a placement tool is selected — swallow the click this gesture produces
        el.addEventListener('click', function(ce){ ce.stopPropagation(); }, { once:true, capture:true });
        var id = +el.getAttribute('data-id');
        var type = el.getAttribute('data-type');
        var feature = state.features.find(function(f){ return f.id===id; });
        if (!feature) return;

        pushHistory();
        var startPt = toSvgPoint(e);
        var offX = startPt.x - feature.x, offY = startPt.y - feature.y;
        var isPond = (type === 'pond');
        el.setPointerCapture(e.pointerId);

        function onMove(ev){
          var p = toSvgPoint(ev);
          var nx = p.x - offX, ny = p.y - offY;
          nx = Math.max(10, Math.min(W-10, nx));
          ny = Math.max(10, Math.min(H-10, ny));
          if (!isPond){
            var safe = keepOutOfPonds({x:nx,y:ny}, 4);
            nx = safe.x; ny = safe.y;
          }
          if (isPond){
            el.setAttribute('cx', nx); el.setAttribute('cy', ny);
          } else {
            el.setAttribute('transform', 'translate('+nx+','+ny+')');
          }
          feature._dx = nx; feature._dy = ny;
        }
        function onUp(){
          el.removeEventListener('pointermove', onMove);
          el.removeEventListener('pointerup', onUp);
          if (feature._dx != null){
            feature.x = feature._dx; feature.y = feature._dy;
            delete feature._dx; delete feature._dy;
          }
          if (isPond) displaceFromPond(feature);
          render();
        }
        el.addEventListener('pointermove', onMove);
        el.addEventListener('pointerup', onUp);
      });
    });
  }

  /* ---------------- zoom + pan ---------------- */
  function clampPan(){
    var vbW=W/state.zoom, vbH=H/state.zoom;

    state.panY = Math.max(-maxPanY, Math.min(maxPanY, state.panY));

  function applyZoom(){
    clampPan();

    function settle(){
