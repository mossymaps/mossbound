n  const now=performance.now();\n  if(now-lastTap.t<320&&Math.hypot(x-lastTap.x,y-lastTap.y)<40){\n    clearTimeout(pending);pending=null;lastTap.t=0;dropFood(x,y);return;\n  }\n  lastTap={t:now,x,y};\n  clearTimeout(pending);\n  pending=setTimeout(()=>{pending=null;\n    let hit=null,best=1e9;for(const f of fish){const d=Math.hypot(f.x-x,f.y-y);if(d<Math.max(18,f.L*.55)&&d<best){best=d;hit=f}}\n    if(hit)select(hit);else{const q=sandShells.find(q=>Math.hypot(q.x-x,q.y-y)<shellById(q.id).cap*.6);if(q)offerShell(q.id);else{if(selected)closeCard();tapGlass(x,y)}}\n  },280);\n});\ncv.addEventListener('dblclick',e=>e.preventDefault());\n$('screen').addEventListener('wheel',e=>{e.preventDefault();live=false;playing=false;hour=((hour+Math.sign(e.deltaY)*.25)%24+24)%24;syncUI()},{passive:false});\naddEventListener('pagehide',save);\n\n// full screen: the tank fills the window (and the real screen where the browser allows it)\nconst btnFull=$('btn-full');\nfunction setFull(on){\n  document.body.classList.toggle('full',on);btnFull.setAttribute('aria-pressed',String(on));\n  if(on){try{const r=document.documentElement.requestFullscreen?.();if(r&&r.catch)r.catch(()=>{})}catch(e){}}\n  else if(document.fullscreenElement){try{const r=document.exitFullscreen();if(r&&r.catch)r.catch(()=>{})}catch(e){}}\n  fitCanvas();if(on)requestAnimationFrame(paintGarden);\n  (on?$('btn-exit'):btnFull).focus();\n}\nbtnFull.addEventListener('click',()=>setFull(true));\n$('btn-exit').addEventListener('click',()=>setFull(false));\naddEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('full'))setFull(false)});\ndocument.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('full'))setFull(false)});\n// the zen garden around the bowl: raked gravel rings, moss islands and mossy stones\nconst garden=$('garden');\nfunction paintGarden(){\n  if(!document.body.classList.contains('full'))return;\n  const dpr=.35,W=innerWidth,H=innerHeight;   // painted small and scaled up: the softness is the point, and it's quick\n  garden.width=Math.round(W*dpr);garden.height=Math.round(H*dpr);\n  const g=garden.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);\n  const blob=(x,y,rx,ry,rot,c,bl)=>{g.save();g.shadowColor=c;g.shadowBlur=bl*dpr;g.shadowOffsetX=10000*dpr;g.beginPath();g.ellipse(x-10000,y,rx,ry,rot,0,6.283);g.fillStyle='#000';g.fill();g.restore()};   // soft blob at this canvas's scale\n  const rnd=mulberry(88),br=document.querySelector('.bowl').getBoundingClientRect();\n  const bx=br.left+br.width/2,by=br.top+br.height/2,bR=br.width/2,u=Math.max(.8,Math.min(W,H)/520);\n  // damp earth with a loose underpainting of greens and browns\n  g.fillStyle='#2c3520';g.fillRect(0,0,W,H);\n  for(let i=0;i<46;i++){const r=(60+rnd()*160)*u;blob(rnd()*W,rnd()*H,r,r*(.5+rnd()*.5),rnd()*3,['rgba(86,108,44,.55)','rgba(62,54,36,.5)','rgba(110,128,52,.4)','rgba(40,58,30,.55)'][i%4],r*.7)}\n  // weathered rocks, placed first so the moss can grow around them\n  const rocks=[];\n  for(let tries=0;tries<300&&rocks.length<10;tries++){\n    const x=-W*.05+rnd()*W*1.1,y=-H*.05+rnd()*H*1.1,r=Math.min(W,H)*(.07+rnd()*.11)+20;\n    if(Math.hypot(x-bx,y-by)<bR+r*.6)continue;\n    if(rocks.some(s=>Math.hypot(s.x-x,s.y-y)<s.r+r+30*u))continue;\n    rocks.push({x,y,r,pts:[...Array(12)].map((_,i)=>[i/12*6.283+(rnd()-.5)*.3,.72+rnd()*.34]),sq:.7+rnd()*.2});\n  }\n  const inRock=(x,y,pad=0)=>rocks.some(s=>((x-s.x)/(s.r+pad))**2+((y-s.y)/((s.r+pad)*s.sq))**2<.85);\n  // moss: thousands of fine fibres in cushions, lit from the top left so each cushion looks soft and round\n  const SH=['#1d2c14','#28401a','#33521f','#406526','#4f7a2c','#628f34','#7aa63e','#96bd52','#b6d36e'];\n  const fibre=SH.map(()=>new Path2D());\n  const cushion=(cx,cy,r)=>{const tone=(rnd()-.5)*.4;\n    blob(cx+r*.18,cy+r*.25,r*.95,r*.85,0,'rgba(10,14,6,.45)',r*.5);\n    const sh=k=>SH[Math.max(0,Math.min(SH.length-1,Math.round(k+tone*6)))];   // a soft cushion: body, then a lit top-left\n    blob(cx,cy,r*.85,r*.75,0,sh(4),r*.35);\n    blob(cx-r*.22,cy-r*.28,r*.5,r*.4,0,sh(6)+'b0',r*.35);\n  };\n  const flush=()=>{g.save();g.lineCap='round';g.lineWidth=1.1*u;SH.forEach((c,i)=>{g.strokeStyle=c;g.stroke(fibre[i]);fibre[i]=new Path2D()});g.restore()};\n  const step=24*u;\n  for(let y=-step;y<H+step;y+=step*.8)for(let x=-step;x<W+step;x+=step*.85){\n    const cx=x+(rnd()-.5)*step*.8,cy=y+(rnd()-.5)*step*.8;\n    if(Math.hypot(cx-bx,cy-by)<bR*.92||inRock(cx,cy)||rnd()<.16)continue;   // a few bare gaps of earth\n    cushion(cx,cy,step*(.35+rnd()*.85));\n  }\n  flush();\n  // the rocks: rounded, cracked, flecked with lichen\n  for(const st of rocks){\n    const pt=i=>{const [a,k]=st.pts[(i+12)%12];return[st.x+Math.cos(a)*st.r*k,st.y+Math.sin(a)*st.r*k*st.sq]};\n    const path=()=>{g.beginPath();for(let i=0;i<=12;i++){const [x1,y1]=pt(i),[x2,y2]=pt(i+1),mx=(x1+x2)/2,my=(y1+y2)/2;if(!i){const [x0,y0]=pt(-1);g.moveTo((x0+x1)/2,(y0+y1)/2)}g.quadraticCurveTo(x1,y1,mx,my)}g.closePath()};\n    g.save();g.shadowColor='rgba(10,12,6,.6)';g.shadowBlur=18*u;g.shadowOffsetX=8*u;g.shadowOffsetY=12*u;path();g.fillStyle='#5f5b50';g.fill();g.restore();\n    g.save();path();g.clip();\n    const gr=g.createRadialGradient(st.x-st.r*.4,st.y-st.r*.5,st.r*.05,st.x,st.y,st.r*1.15);gr.addColorStop(0,'#c9c2b0');gr.addColorStop(.5,'#8e887a');gr.addColorStop(1,'#4b4840');\n    g.fillStyle=gr;g.fillRect(st.x-st.r*1.3,st.y-st.r*1.3,st.r*2.6,st.r*2.6);\n    for(let k=0;k<8;k++)blob(st.x+(rnd()-.5)*st.r*1.4,st.y+(rnd()-.5)*st.r,st.r*(.15+rnd()*.25),st.r*(.1+rnd()*.15),rnd()*3,k%2?'rgba(255,250,235,.18)':'rgba(30,28,22,.2)',st.r*.15);\n    for(let k=0;k<st.r*st.r*.08;k++){g.fillStyle=rnd()<.5?'rgba(40,36,28,.3)':'rgba(240,235,220,.3)';g.fillRect(st.x+(rnd()-.5)*st.r*2.2,st.y+(rnd()-.5)*st.r*2,1,1)}\n    g.strokeStyle='rgba(35,32,26,.5)';g.lineWidth=1.1*u;g.lineCap='round';\n    for(let k=0;k<4;k++){let x=st.x+(rnd()-.5)*st.r,y=st.y+(rnd()-.5)*st.r*.8,a=rnd()*6.283;g.beginPath();g.moveTo(x,y);for(let j=0;j<6;j++){a+=(rnd()-.5)*1.2;x+=Math.cos(a)*st.r*.09;y+=Math.sin(a)*st.r*.09;g.lineTo(x,y)}g.stroke()}\n    for(let k=0;k<6;k++){const lx=st.x+(rnd()-.5)*st.r*1.3,ly=st.y+(rnd()-.5)*st.r;blob(lx,ly,(3+rnd()*7)*u,(2+rnd()*5)*u,rnd()*3,rnd()<.5?'rgba(214,214,160,.65)':'rgba(190,200,120,.6)',3*u)}\n    g.restore();\n  }\n  // moss creeping over the rock edges and caps\n  for(const st of rocks){\n    for(let k=0;k<14;k++){const a=rnd()*6.283,x=st.x+Math.cos(a)*st.r*(.85+rnd()*.2),y=st.y+Math.sin(a)*st.r*st.sq*(.85+rnd()*.2);if(Math.hypot(x-bx,y-by)<bR)continue;cushion(x,y,step*(.3+rnd()*.4))}\n    for(let k=0;k<3;k++)cushion(st.x+st.r*(rnd()-.3)*.6,st.y+st.r*(.1+rnd()*.3)*st.sq,st.r*(.12+rnd()*.14));\n  }\n  flush();\n  // spore stalks: fine reddish threads with tiny capsules\n  g.lineCap='round';\n  for(let k=0;k<W*H/14000;k++){const x=rnd()*W,y=rnd()*H;if(Math.hypot(x-bx,y-by)<bR||inRock(x,y))continue;\n    const a=-Math.PI/2+(rnd()-.5)*1.4,len=(6+rnd()*9)*u,ex=x+Math.cos(a)*len,ey=y+Math.sin(a)*len;\n    g.strokeStyle='rgba(150,84,40,.7)';g.lineWidth=.7*u;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+(rnd()-.5)*4*u,y-len*.5,ex,ey);g.stroke();\n    g.beginPath();g.ellipse(ex,ey,1.1*u,1.8*u,a+Math.PI/2,0,6.283);g.fillStyle=rnd()<.5?'#a8642c':'#c98a3c';g.fill()}\n  // painterly speckle\n  for(let k=0;k<W*H/400;k++){g.fillStyle=rnd()<.5?'rgba(255,255,220,.08)':'rgba(0,0,0,.1)';g.fillRect(rnd()*W,rnd()*H,1.5,1.5)}\n  // soft focus, baked in: shrink the painting and scale it back up (works in every browser, costs nothing per frame)\n  {const sm=document.createElement('canvas');sm.width=Math.max(8,garden.width/5|0);sm.height=Math.max(8,garden.height/5|0);const q=sm.getContext('2d');q.imageSmoothingQuality='high';q.drawImage(garden,0,0,sm.width,sm.height);\n   g.save();g.setTransform(1,0,0,1,0,0);g.imageSmoothingQuality='high';g.drawImage(sm,0,0,garden.width,garden.height);g.restore()}\n  // the bowl's soft shadow on the ground\n  const sg=g.createRadialGradient(bx+14,by+22,bR*.7,bx+14,by+22,bR*1.3);sg.addColorStop(0,'rgba(10,12,5,.5)');sg.addColorStop(1,'rgba(10,12,5,0)');\n  g.fillStyle=sg;g.fillRect(0,0,W,H);\n  syncGardenLight();\n}\nlet PAPER0=null;\nfunction syncRimLight(){const a=skyAt(hour).amb,n=nightness(hour),k=1-.38*n;$('rim-light').style.backgroundColor=css(a.map(v=>v*k));\n  // the page around the tank takes a gentler wash of the same light, so text stays easy to read\n  if(!PAPER0)PAPER0=hex(getComputedStyle(document.documentElement).getPropertyValue('--paper').trim()||'#f2ead9');\n  const lit=PAPER0.map((v,i)=>v*a[i]/255*(1-.18*n));document.documentElement.style.setProperty('--paper',css(mix(PAPER0,lit,.6)))}\nfunction syncGardenLight(){const a=skyAt(hour).amb;$('garden-light').style.backgroundColor=css(a.map(v=>v*.8+50))}\naddEventListener('resize',()=>{clearTimeout(paintGarden.t);paintGarden.t=setTimeout(paintGarden,150)});\n\nconst rimCv=document.getElementById('rim');\nfunction rimSize(){const box=rimCv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1),D=Math.round(box.width*dpr);\n  const scr=document.getElementById('screen').getBoundingClientRect().width*dpr;if(D&&rimCv.width!==D){rimCv.width=rimCv.height=D}return{D,dpr,Rb:D/2,Ri:scr/2}}\n/* ---------- faux rock rim: lumpy sculpted stone, grey-brown, rough edges ---------- */\nfunction paintRim(){\n  const {D,dpr,Rb,Ri}=rimSize();if(!D)return;\n  const g=rimCv.getContext('2d'),R2=mulberry(77);g.clearRect(0,0,D,D);g.save();g.translate(Rb,Rb);\n  const wav=(n,amp)=>{const p=[...Array(n)].map(()=>[R2()*6.283,1+(R2()*7|0),R2()]);return a=>p.reduce((s,[ph,f,w])=>s+Math.sin(a*f+ph)*w,0)/n*amp};\n  const wo=wav(9,4.5),wi=wav(7,4),M=360;\n  const ro=a=>Rb*(.93+.035*wo(a)), ri=a=>Ri*(.985-.045*Math.max(0,.3+.7*wi(a)));\n  const ann=()=>{g.beginPath();for(let k=0;k<=M;k++){const a=k/M*6.283,r=ro(a);k?g.lineTo(Math.cos(a)*r,Math.sin(a)*r):g.moveTo(Math.cos(a)*r,Math.sin(a)*r)}\n    for(let k=M;k>=0;k--){const a=k/M*6.283,r=ri(a);g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath()};\n  // the stone casts a shadow on the ground and a dark lip into the water\n  g.save();g.shadowColor='rgba(30,22,12,.45)';g.shadowBlur=18*dpr;g.shadowOffsetY=10*dpr;ann();g.fillStyle='#7d6f5c';g.fill('evenodd');g.restore();\n  const wg=g.createRadialGradient(0,0,Ri*.9,0,0,Ri*1.0);wg.addColorStop(0,'rgba(20,15,8,0)');wg.addColorStop(1,'rgba(20,15,8,.45)');\n  g.beginPath();g.arc(0,0,Ri*1.0,0,6.283);g.fillStyle=wg;g.fill();\n  ann();const bg=g.createRadialGradient(-Rb*.25,-Rb*.3,Ri*.6,0,0,Rb);bg.addColorStop(0,'#b2a48c');bg.addColorStop(.75,'#8e806a');bg.addColorStop(1,'#6a5d4b');g.fillStyle=bg;g.fill('evenodd');\n  g.save();ann();g.clip('evenodd');\n  const RW=Rb-Ri, rp=()=>{const a=R2()*6.283,t=R2();const r=ri(a)+(ro(a)-ri(a))*t;return[Math.cos(a)*r,Math.sin(a)*r,a]};\n  // lumpy stones: lit from the top left\n  for(let k=0;k<55;k++){const [x,y,a]=rp(),s=RW*(.3+R2()*.45),rot=a+R2()*.8;\n    g.save();g.translate(x,y);g.rotate(rot);g.beginPath();\n    for(let j=0;j<=10;j++){const t=j/10*6.283,q=s*(.75+R2()*.3);j?g.lineTo(Math.cos(t)*q,Math.sin(t)*q*.7):g.moveTo(Math.cos(t)*q,Math.sin(t)*q*.7)}g.closePath();\n    g.rotate(-rot);const lg=g.createLinearGradient(-s,-s,s,s);const tone=R2();\n    lg.addColorStop(0,tone<.5?'rgba(222,210,186,.95)':'rgba(196,182,156,.95)');lg.addColorStop(.5,'rgba(140,126,104,.9)');lg.addColorStop(1,'rgba(58,48,36,.95)');\n    g.fillStyle=lg;g.shadowColor='rgba(40,30,18,.5)';g.shadowBlur=4*dpr;g.shadowOffsetX=2*dpr;g.shadowOffsetY=3*dpr;g.fill();g.restore()}\n  // pitted, crackly surface\n  for(let k=0;k<D*6;k++){const [x,y]=rp();g.fillStyle=R2()<.55?'rgba(50,40,28,.35)':'rgba(240,230,210,.35)';const z=(.6+R2()*1.4)*dpr;g.fillRect(x,y,z,z)}\n  g.strokeStyle='rgba(45,35,22,.45)';g.lineWidth=1*dpr;g.lineCap='round';\n  for(let k=0;k<90;k++){let [x,y]=rp(),a=R2()*6.283;g.beginPath();g.moveTo(x,y);for(let j=0;j<5;j++){a+=(R2()-.5)*1.4;x+=Math.cos(a)*RW*.06;y+=Math.sin(a)*RW*.06;g.lineTo(x,y)}g.stroke()}\n  g.restore();\n  // a wet, darker band where stone meets water\n  g.beginPath();for(let k=0;k<=M;k++){const a=k/M*6.283,r=ri(a);k?g.lineTo(Math.cos(a)*r,Math.sin(a)*r):g.moveTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath();\n  g.strokeStyle='rgba(55,45,30,.55)';g.lineWidth=3*dpr;g.stroke();g.strokeStyle='rgba(255,250,235,.25)';g.lineWidth=1*dpr;g.stroke();\n  g.restore();\n  // the hour's light only falls on the stone: mask the light layer with the rim's own shape\n  const rl=document.getElementById('rim-light');if(rl){const m='url('+rimCv.toDataURL()+')';Object.assign(rl.style,{webkitMaskImage:m,maskImage:m,webkitMaskSize:'100% 100%',maskSize:'100% 100%',inset:'0',borderRadius:'0'})}\n}\nif(rimCv){paintRim();addEventListener('resize',paintRim);if(window.ResizeObserver)new ResizeObserver(paintRim).observe(rimCv)}\nfunction fitCanvas(){\n  const w=cv.getBoundingClientRect().width||S;\n  const k=Math.round(clamp(w*(window.devicePixelRatio||1)/S,1,2)*4)/4;\n  if(k!==K){K=k;cv.width=cv.height=Math.round(S*K)}\n}\naddEventListener('resize',fitCanvas);\nfitCanvas();\n// shells: offering one, the toast, and the list beside the tank\nlet toastT=0;\nfunction toast(m){const el=$('toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}\nfunction offerShell(id){\n  const f=fish[0],sh=shellById(id),fit=fitOf(sh,f.L),q=sandShells.find(q=>q.id===id);\n  if(id===crab.current){toast('Pebble is already wearing it');return}\n  if(!q){toast(fit==='tight'?'Pebble has outgrown the '+sh.name:'The '+sh.name+' hasn\\'t washed up yet');return}\n  if(fit==='big'){toast('Too big for Pebble for now');return}\n  if(fit==='tight'){toast('Too small for Pebble now');return}\n  f.goShell=q;f.restT=0;toast('Pebble is going to try the '+sh.name);\n}\nfunction renderShells(){\n  const ul=$('shells');if(!ul)return;const f=fish[0];ul.innerHTML='';\n  for(const sh of SHELLS){\n    const found=crab.found.includes(sh.id),now=sh.id===crab.current,onSand=sandShells.some(q=>q.id===sh.id),fit=fitOf(sh,f.L);\n    const li=document.createElement('li');li.className=now?'now':found?'':'locked';\n    const c=document.createElement('canvas');c.width=96;c.height=96;c.style.width='48px';c.style.height='48px';\n    const g=c.getContext('2d');g.translate(48,48);g.rotate(-.5);const sc=80/sh.cap;g.scale(sc*.95,sc*.95);drawShell(g,sh,sh.cap,!now);\n    const status=now?({tight:'Wearing it \u00b7 too tight!',snug:'Wearing it \u00b7 snug',roomy:'Wearing it \u00b7 roomy',big:'Wearing it'})[fit]\n      :!found?(sh.rare?'Rare \u00b7 washes up when Pebble is big':'Washes up as Pebble grows'):fit==='tight'?'Outgrown':onSand?(fit==='big'?'On the sand \u00b7 still too big':'On the sand \u00b7 fits now'):'Found';\n    const info=document.createElement('div');info.innerHTML=`<b>${found||!sh.rare?sh.name:'Rare shell'}<\/b><span>${status}<\/span>`;\n    li.append(c,info);\n    if(onSand&&(fit==='roomy'||fit==='snug')){const b=document.createElement('button');b.textContent='Try it on';b.addEventListener('click',()=>offerShell(sh.id));li.append(b)}else li.append(document.createElement('span'));\n    ul.append(li);\n  }\n}\nsetInterval(renderShells,2000);renderShells();\nwindow.__tank={taps,cleanliness,crab,sandShells,offerShell,ANEM,food,step,render,setHour:h=>{live=false;playing=false;hour=h},fish,dropFood};\n\nconst go=()=>requestAnimationFrame(t=>{last=t;frame(t)});\n(document.fonts&&document.fonts.load?Promise.race([document.fonts.load('700 15px Manrope'),new Promise(r=>setTimeout(r,1200))]):Promise.resolve()).then(go,go);\nsyncUI();\n})();\n<\/script>\n<\/body><\/html>"};
const MODES=["koi", "lotus", "reef", "wadepool", "snails"];
const view=document.getElementById('view');
let current=null;
function show(mode){
  if(!MODES.includes(mode))mode=MODES[0];
  if(mode===current)return;current=mode;
  view.srcdoc=PAGES[mode];
  for(const b of document.querySelectorAll('.tabs button'))b.setAttribute('aria-selected',String(b.dataset.mode===mode));
  if(location.hash!=='#'+mode)history.replaceState(null,'','#'+mode);
  try{localStorage.setItem('yugang-mode',mode)}catch(e){}
}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-mode]');if(b)show(b.dataset.mode)});
document.querySelector('.tabs').addEventListener('keydown',e=>{if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;const i=MODES.indexOf(current),n=MODES[(i+(e.key==='ArrowRight'?1:MODES.length-1))%MODES.length];show(n);document.getElementById('tab-'+n).focus()});
addEventListener('hashchange',()=>show(location.hash.slice(1)));
let start=location.hash.slice(1);if(!MODES.includes(start)){try{start=localStorage.getItem('yugang-mode')||''}catch(e){start=''}}
show(start);
})();
