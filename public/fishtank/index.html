c=0, uiAcc=0, saveAcc=0;\nconst reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;\nfunction step(dt){\n  tAcc+=dt;\n  if(playing){hour=(hour+dt*.25)%24}else if(live){hour=nowHour()}\n  update(dt,tAcc);\n  uiAcc+=dt;if(uiAcc>.25){uiAcc=0;syncUI()}\n  saveAcc+=dt;if(saveAcc>5){saveAcc=0;save()}\n}\nfunction frame(now){\n  if(now-last<30){requestAnimationFrame(frame);return}   // about 30 fps: calm fish don't need more, and phones stay cool\n  let dt=Math.min(.1,(now-last)/1000);last=now;\n  if(reduced)dt*=.6;\n  step(dt);render(tAcc);\n  requestAnimationFrame(frame);\n}\n\n/* ---------- UI ---------- */\nconst $=id=>document.getElementById(id);\nconst slider=$('time-slider'), card=$('card');\n(()=>{const stops=[];for(let h=0;h<=24;h+=.5){const s=skyAt(h);stops.push(css(s.deep.map((v,i)=>v*.45+s.sky[i]*.55))+' '+(h/24*100).toFixed(1)+'%')}$('skybar').style.background=`linear-gradient(90deg,${stops.join(',')})`})();\n\nconst rosterEl=$('roster'); const rows={};\nfish.forEach(f=>{\n  const li=document.createElement('li');li.tabIndex=0;\n  const sw=f.kind==='turtle'?'radial-gradient(circle at 40% 35%,#9a9358,#6a6640 55%,#2f2d18)':f.id==='tuan'?'radial-gradient(circle at 35% 40%,#e5532a 0 30%,#f5f2ec 31% 60%,#e5532a 61%)':f.id==='tao'?'radial-gradient(circle at 50% 30%,#d8332a 0 28%,#f6f3ee 29%)':f.pal.body;\n  li.innerHTML=`<span class=\"dot\" style=\"background:${sw}\"><\/span><span class=\"nm\">${f.cn}<small>${f.py}<\/small><\/span><span class=\"md\"><\/span><div class=\"bar\"><i><\/i><\/div>`;\n  li.addEventListener('click',()=>select(f));li.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(f)}});\n  rosterEl.appendChild(li);rows[f.id]=li;\n});\nlet cardTimer=0;\nfunction select(f){selected=f;card.hidden=false;f.mood=clamp(f.mood+3,0,100);pop(f.x,f.y-f.L*.3);cardTimer=12;syncUI()}\nfunction closeCard(){selected=null;card.hidden=true;syncUI()}\n$('card-x').addEventListener('click',e=>{e.stopPropagation();closeCard()});\n\nfunction syncUI(){\n  syncRimLight();\n  if(document.body.classList.contains('full'))syncGardenLight();\n  $('clock').textContent=fmt(hour);\n  const [cn,en]=periodOf(hour);$('period').innerHTML=cn+' <small>'+en+'<\/small>';\n  const tag=$('livetag');tag.textContent=playing?'Playing a day':live?'Live clock':'Preview';tag.classList.toggle('off',!live);\n  if(document.activeElement!==slider)slider.value=hour.toFixed(2);\n  $('btn-live').setAttribute('aria-pressed',String(live&&!playing));\n  $('btn-play').setAttribute('aria-pressed',String(playing));\n  for(const f of fish){const li=rows[f.id];const [mc,me]=moodOf(f);li.querySelector('.md').textContent=mc+' '+me;\n    const bi=li.querySelector('i');bi.style.width=f.hunger.toFixed(0)+'%';bi.style.background=hungerColor(f.hunger);li.classList.toggle('sel',f===selected)}\n  if(selected){\n    const f=selected,[mc,me]=moodOf(f);\n    $('c-seal').textContent=f.seal;\n    $('c-name').innerHTML=`${f.cn}<small>${f.py}<\/small>`;\n    $('c-meta').textContent=`${f.breed} \u00b7 ${f.colorName} \u00b7 ${ageText(f)} old`;\n    $('c-mood').textContent=mc+' '+me;$('c-moodbar').style.width=f.mood.toFixed(0)+'%';$('c-moodbar').style.background='#2d4c8c';\n    $('c-hunger').textContent=hungerText(f.hunger);$('c-hungerbar').style.width=f.hunger.toFixed(0)+'%';$('c-hungerbar').style.background=hungerColor(f.hunger);\n    cardTimer-=.25;if(cardTimer<=0)closeCard();\n  }\n}\n\nslider.addEventListener('input',()=>{live=false;playing=false;hour=parseFloat(slider.value);syncUI()});\n$('btn-live').addEventListener('click',()=>{live=true;playing=false;hour=nowHour();syncUI()});\n$('btn-play').addEventListener('click',()=>{playing=!playing;if(playing)live=false;syncUI()});\n$('jumps').addEventListener('click',e=>{const b=e.target.closest('button[data-h]');if(!b)return;live=false;playing=false;hour=+b.dataset.h;syncUI()});\n$('btn-speed').addEventListener('click',e=>{lifeSpeed=lifeSpeed===1?60:1;e.currentTarget.setAttribute('aria-pressed',String(lifeSpeed>1))});\n$('btn-reset').addEventListener('click',()=>{fish.forEach(f=>{f.hunger=START_HUNGER[f.id];f.mood=60;f.bornAt=Date.now()-f.born*DAY});save();$('reset-msg').hidden=false;setTimeout(()=>$('reset-msg').hidden=true,2500);syncUI()});\n\nfunction toTank(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*S/r.width,(e.clientY-r.top)*S/r.height]}\n/* tapping the glass: a ripple rings out and nearby creatures startle away from it */\nfunction tapGlass(x,y){\n  taps.push({x,y,t:0});\n  for(const f of fish){const d=Math.hypot(f.x-x,f.y-y);if(d>170)continue;const k=1-d/170;\n    f.mood=clamp(f.mood-3*k,0,100);\n    if(f.kind==='snail'){f.retract=Math.max(f.retract||0,1.5+k*2.5);continue}   // snails just pull into their shells\n    if(f.swap)continue;\n    if(f.kind==='puffer'&&d<110)f.puff=1;\n    f.scare=.7+k*1.3;f.scx=x;f.scy=y;\n    f.dash=f.kind==='turtle'?16:f.kind==='crab'?36:f.kind==='puffer'?26:f.kind==='small'?82:66;\n    if(f.kind!=='crab'&&f.kind!=='turtle'){   // a quick flick of the body away from the tap\n      const away=Math.atan2(f.y-y,f.x-x);let diff=Math.atan2(Math.sin(away-f.ang),Math.cos(away-f.ang));f.ang+=diff*.55;}\n    f.speed=Math.max(f.speed,f.dash*.5*k+4);\n  }\n}\nlet lastTap={t:0,x:0,y:0}, pending=null;\ncv.addEventListener('pointerup',e=>{\n  const [x,y]=toTank(e);if(Math.hypot(x-C,y-C)>R)return;\n  const now=performance.now();\n  if(now-lastTap.t<320&&Math.hypot(x-lastTap.x,y-lastTap.y)<40){\n    clearTimeout(pending);pending=null;lastTap.t=0;dropFood(x,y);return;\n  }\n  lastTap={t:now,x,y};\n  clearTimeout(pending);\n  pending=setTimeout(()=>{pending=null;\n    let hit=null,best=1e9;for(const f of fish){const d=Math.hypot(f.x-x,f.y-y);if(d<Math.max(18,f.L*.55)&&d<best){best=d;hit=f}}\n    if(hit)select(hit);else{if(selected)closeCard();tapGlass(x,y)}\n  },280);\n});\ncv.addEventListener('dblclick',e=>e.preventDefault());\n$('screen').addEventListener('wheel',e=>{e.preventDefault();live=false;playing=false;hour=((hour+Math.sign(e.deltaY)*.25)%24+24)%24;syncUI()},{passive:false});\naddEventListener('pagehide',save);\n\n// full screen: the tank fills the window (and the real screen where the browser allows it)\nconst btnFull=$('btn-full');\nfunction setFull(on){\n  document.body.classList.toggle('full',on);btnFull.setAttribute('aria-pressed',String(on));\n  if(on){try{const r=document.documentElement.requestFullscreen?.();if(r&&r.catch)r.catch(()=>{})}catch(e){}}\n  else if(document.fullscreenElement){try{const r=document.exitFullscreen();if(r&&r.catch)r.catch(()=>{})}catch(e){}}\n  fitCanvas();if(on)requestAnimationFrame(paintGarden);\n  (on?$('btn-exit'):btnFull).focus();\n}\nbtnFull.addEventListener('click',()=>setFull(true));\n$('btn-exit').addEventListener('click',()=>setFull(false));\naddEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('full'))setFull(false)});\ndocument.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('full'))setFull(false)});\n// the zen garden around the bowl: raked gravel rings, moss islands and mossy stones\nconst garden=$('garden');\nfunction paintGarden(){\n  if(!document.body.classList.contains('full'))return;\n  const dpr=.35,W=innerWidth,H=innerHeight;   // painted small and scaled up: the softness is the point, and it's quick\n  garden.width=Math.round(W*dpr);garden.height=Math.round(H*dpr);\n  const g=garden.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);\n  const blob=(x,y,rx,ry,rot,c,bl)=>{g.save();g.shadowColor=c;g.shadowBlur=bl*dpr;g.shadowOffsetX=10000*dpr;g.beginPath();g.ellipse(x-10000,y,rx,ry,rot,0,6.283);g.fillStyle='#000';g.fill();g.restore()};   // soft blob at this canvas's scale\n  const rnd=mulberry(88),br=document.querySelector('.bowl').getBoundingClientRect();\n  const bx=br.left+br.width/2,by=br.top+br.height/2,bR=br.width/2,u=Math.max(.8,Math.min(W,H)/520);\n  // damp earth with a loose underpainting of greens and browns\n  g.fillStyle='#2c3520';g.fillRect(0,0,W,H);\n  for(let i=0;i<46;i++){const r=(60+rnd()*160)*u;blob(rnd()*W,rnd()*H,r,r*(.5+rnd()*.5),rnd()*3,['rgba(86,108,44,.55)','rgba(62,54,36,.5)','rgba(110,128,52,.4)','rgba(40,58,30,.55)'][i%4],r*.7)}\n  // weathered rocks, placed first so the moss can grow around them\n  const rocks=[];\n  for(let tries=0;tries<300&&rocks.length<10;tries++){\n    const x=-W*.05+rnd()*W*1.1,y=-H*.05+rnd()*H*1.1,r=Math.min(W,H)*(.07+rnd()*.11)+20;\n    if(Math.hypot(x-bx,y-by)<bR+r*.6)continue;\n    if(rocks.some(s=>Math.hypot(s.x-x,s.y-y)<s.r+r+30*u))continue;\n    rocks.push({x,y,r,pts:[...Array(12)].map((_,i)=>[i/12*6.283+(rnd()-.5)*.3,.72+rnd()*.34]),sq:.7+rnd()*.2});\n  }\n  const inRock=(x,y,pad=0)=>rocks.some(s=>((x-s.x)/(s.r+pad))**2+((y-s.y)/((s.r+pad)*s.sq))**2<.85);\n  // moss: thousands of fine fibres in cushions, lit from the top left so each cushion looks soft and round\n  const SH=['#1d2c14','#28401a','#33521f','#406526','#4f7a2c','#628f34','#7aa63e','#96bd52','#b6d36e'];\n  const fibre=SH.map(()=>new Path2D());\n  const cushion=(cx,cy,r)=>{const tone=(rnd()-.5)*.4;\n    blob(cx+r*.18,cy+r*.25,r*.95,r*.85,0,'rgba(10,14,6,.45)',r*.5);\n    const sh=k=>SH[Math.max(0,Math.min(SH.length-1,Math.round(k+tone*6)))];   // a soft cushion: body, then a lit top-left\n    blob(cx,cy,r*.85,r*.75,0,sh(4),r*.35);\n    blob(cx-r*.22,cy-r*.28,r*.5,r*.4,0,sh(6)+'b0',r*.35);\n  };\n  const flush=()=>{g.save();g.lineCap='round';g.lineWidth=1.1*u;SH.forEach((c,i)=>{g.strokeStyle=c;g.stroke(fibre[i]);fibre[i]=new Path2D()});g.restore()};\n  const step=24*u;\n  for(let y=-step;y<H+step;y+=step*.8)for(let x=-step;x<W+step;x+=step*.85){\n    const cx=x+(rnd()-.5)*step*.8,cy=y+(rnd()-.5)*step*.8;\n    if(Math.hypot(cx-bx,cy-by)<bR*.92||inRock(cx,cy)||rnd()<.16)continue;   // a few bare gaps of earth\n    cushion(cx,cy,step*(.35+rnd()*.85));\n  }\n  flush();\n  // the rocks: rounded, cracked, flecked with lichen\n  for(const st of rocks){\n    const pt=i=>{const [a,k]=st.pts[(i+12)%12];return[st.x+Math.cos(a)*st.r*k,st.y+Math.sin(a)*st.r*k*st.sq]};\n    const path=()=>{g.beginPath();for(let i=0;i<=12;i++){const [x1,y1]=pt(i),[x2,y2]=pt(i+1),mx=(x1+x2)/2,my=(y1+y2)/2;if(!i){const [x0,y0]=pt(-1);g.moveTo((x0+x1)/2,(y0+y1)/2)}g.quadraticCurveTo(x1,y1,mx,my)}g.closePath()};\n    g.save();g.shadowColor='rgba(10,12,6,.6)';g.shadowBlur=18*u;g.shadowOffsetX=8*u;g.shadowOffsetY=12*u;path();g.fillStyle='#5f5b50';g.fill();g.restore();\n    g.save();path();g.clip();\n    const gr=g.createRadialGradient(st.x-st.r*.4,st.y-st.r*.5,st.r*.05,st.x,st.y,st.r*1.15);gr.addColorStop(0,'#c9c2b0');gr.addColorStop(.5,'#8e887a');gr.addColorStop(1,'#4b4840');\n    g.fillStyle=gr;g.fillRect(st.x-st.r*1.3,st.y-st.r*1.3,st.r*2.6,st.r*2.6);\n    for(let k=0;k<8;k++)blob(st.x+(rnd()-.5)*st.r*1.4,st.y+(rnd()-.5)*st.r,st.r*(.15+rnd()*.25),st.r*(.1+rnd()*.15),rnd()*3,k%2?'rgba(255,250,235,.18)':'rgba(30,28,22,.2)',st.r*.15);\n    for(let k=0;k<st.r*st.r*.08;k++){g.fillStyle=rnd()<.5?'rgba(40,36,28,.3)':'rgba(240,235,220,.3)';g.fillRect(st.x+(rnd()-.5)*st.r*2.2,st.y+(rnd()-.5)*st.r*2,1,1)}\n    g.strokeStyle='rgba(35,32,26,.5)';g.lineWidth=1.1*u;g.lineCap='round';\n    for(let k=0;k<4;k++){let x=st.x+(rnd()-.5)*st.r,y=st.y+(rnd()-.5)*st.r*.8,a=rnd()*6.283;g.beginPath();g.moveTo(x,y);for(let j=0;j<6;j++){a+=(rnd()-.5)*1.2;x+=Math.cos(a)*st.r*.09;y+=Math.sin(a)*st.r*.09;g.lineTo(x,y)}g.stroke()}\n    for(let k=0;k<6;k++){const lx=st.x+(rnd()-.5)*st.r*1.3,ly=st.y+(rnd()-.5)*st.r;blob(lx,ly,(3+rnd()*7)*u,(2+rnd()*5)*u,rnd()*3,rnd()<.5?'rgba(214,214,160,.65)':'rgba(190,200,120,.6)',3*u)}\n    g.restore();\n  }\n  // moss creeping over the rock edges and caps\n  for(const st of rocks){\n    for(let k=0;k<14;k++){const a=rnd()*6.283,x=st.x+Math.cos(a)*st.r*(.85+rnd()*.2),y=st.y+Math.sin(a)*st.r*st.sq*(.85+rnd()*.2);if(Math.hypot(x-bx,y-by)<bR)continue;cushion(x,y,step*(.3+rnd()*.4))}\n    for(let k=0;k<3;k++)cushion(st.x+st.r*(rnd()-.3)*.6,st.y+st.r*(.1+rnd()*.3)*st.sq,st.r*(.12+rnd()*.14));\n  }\n  flush();\n  // spore stalks: fine reddish threads with tiny capsules\n  g.lineCap='round';\n  for(let k=0;k<W*H/14000;k++){const x=rnd()*W,y=rnd()*H;if(Math.hypot(x-bx,y-by)<bR||inRock(x,y))continue;\n    const a=-Math.PI/2+(rnd()-.5)*1.4,len=(6+rnd()*9)*u,ex=x+Math.cos(a)*len,ey=y+Math.sin(a)*len;\n    g.strokeStyle='rgba(150,84,40,.7)';g.lineWidth=.7*u;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+(rnd()-.5)*4*u,y-len*.5,ex,ey);g.stroke();\n    g.beginPath();g.ellipse(ex,ey,1.1*u,1.8*u,a+Math.PI/2,0,6.283);g.fillStyle=rnd()<.5?'#a8642c':'#c98a3c';g.fill()}\n  // painterly speckle\n  for(let k=0;k<W*H/400;k++){g.fillStyle=rnd()<.5?'rgba(255,255,220,.08)':'rgba(0,0,0,.1)';g.fillRect(rnd()*W,rnd()*H,1.5,1.5)}\n  // soft focus, baked in: shrink the painting and scale it back up (works in every browser, costs nothing per frame)\n  {const sm=document.createElement('canvas');sm.width=Math.max(8,garden.width/5|0);sm.height=Math.max(8,garden.height/5|0);const q=sm.getContext('2d');q.imageSmoothingQuality='high';q.drawImage(garden,0,0,sm.width,sm.height);\n   g.save();g.setTransform(1,0,0,1,0,0);g.imageSmoothingQuality='high';g.drawImage(sm,0,0,garden.width,garden.height);g.restore()}\n  // the bowl's soft shadow on the ground\n  const sg=g.createRadialGradient(bx+14,by+22,bR*.7,bx+14,by+22,bR*1.3);sg.addColorStop(0,'rgba(10,12,5,.5)');sg.addColorStop(1,'rgba(10,12,5,0)');\n  g.fillStyle=sg;g.fillRect(0,0,W,H);\n  syncGardenLight();\n}\nlet PAPER0=null;\nfunction syncRimLight(){const a=skyAt(hour).amb,n=nightness(hour),k=1-.38*n;$('rim-light').style.backgroundColor=css(a.map(v=>v*k));\n  // the page around the tank takes a gentler wash of the same light, so text stays easy to read\n  if(!PAPER0)PAPER0=hex(getComputedStyle(document.documentElement).getPropertyValue('--paper').trim()||'#f2ead9');\n  const lit=PAPER0.map((v,i)=>v*a[i]/255*(1-.18*n));document.documentElement.style.setProperty('--paper',css(mix(PAPER0,lit,.6)))}\nfunction syncGardenLight(){const a=skyAt(hour).amb;$('garden-light').style.backgroundColor=css(a.map(v=>v*.92+20))}\naddEventListener('resize',()=>{clearTimeout(paintGarden.t);paintGarden.t=setTimeout(paintGarden,150)});\n\n/* ---------- blue-and-white porcelain rim: diamond lattice on top, Greek key around the outer edge ---------- */\nconst rimCv=document.getElementById('rim');\nfunction paintRim(){\n  const box=rimCv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1),D=Math.round(box.width*dpr);if(!D)return;\n  if(rimCv.width!==D){rimCv.width=rimCv.height=D}\n  const g=rimCv.getContext('2d'),Rb=D/2,scr=document.getElementById('screen').getBoundingClientRect().width*dpr,Ri=scr/2,RW=Rb-Ri;\n  g.clearRect(0,0,D,D);g.save();g.translate(Rb,Rb);\n  const ink='#23468f',inkSoft='rgba(35,70,143,.55)';\n  const ring=(fr,w,col)=>{g.beginPath();g.arc(0,0,Ri+RW*fr,0,6.283);g.strokeStyle=col||ink;g.lineWidth=w*dpr;g.stroke()};\n  // a band runs from radius fraction a to b; (u,v) inside one repeat -> canvas point\n  const band=(a,b,n)=>{const r0=Ri+RW*a,r1=Ri+RW*b;return(i,u,v)=>{const ang=(i+u)/n*6.283-Math.PI/2,r=r0+(r1-r0)*v;return[Math.cos(ang)*r,Math.sin(ang)*r]}};\n  const poly=(P,i,pts,close)=>{g.beginPath();pts.forEach(([u,v],k)=>{\n      if(k){const [pu,pv]=pts[k-1];for(let s=1;s<=4;s++){const [x,y]=P(i,pu+(u-pu)*s/4,pv+(v-pv)*s/4);g.lineTo(x,y)}}else{const [x,y]=P(i,u,v);g.moveTo(x,y)}});\n    if(close)g.closePath()};\n  // lattice band: a ring of diamonds, each holding a little four-petal flower\n  const la=.12,lb=.6,lw=RW*(lb-la),nL=Math.max(24,Math.round(2*Math.PI*(Ri+RW*(la+lb)/2)/lw));\n  const L=band(la,lb,nL);\n  g.lineJoin='round';g.lineCap='round';\n  for(let i=0;i<nL;i++){\n    g.lineWidth=Math.max(.8,lw*.045);g.strokeStyle=ink;\n    poly(L,i,[[.5,0],[1,.5],[.5,1],[0,.5]],true);g.stroke();\n    // corner triangles filled in light blue wash\n    g.fillStyle='rgba(35,70,143,.18)';\n    for(const tri of [[[0,0],[.5,0],[0,.5]],[[1,0],[.5,0],[1,.5]],[[0,1],[.5,1],[0,.5]],[[1,1],[.5,1],[1,.5]]]){poly(L,i,tri,true);g.fill()}\n    // inner square and flower\n    g.lineWidth=Math.max(.7,lw*.035);poly(L,i,[[.5,.2],[.8,.5],[.5,.8],[.2,.5]],true);g.stroke();\n    g.fillStyle=ink;for(const [u,v] of [[.5,.36],[.64,.5],[.5,.64],[.36,.5]]){const [x,y]=L(i,u,v);g.beginPath();g.arc(x,y,lw*.055,0,6.283);g.fill()}\n    const [cx,cy]=L(i,.5,.5);g.beginPath();g.arc(cx,cy,lw*.035,0,6.283);g.fillStyle='#fff';g.fill();\n  }\n  ring(la,1.6);ring(lb,1.6);ring(lb+.035,.8,inkSoft);\n  // Greek key band around the outer edge\n  const ka=.68,kb=.93,kw=RW*(kb-ka),nK=Math.max(30,Math.round(2*Math.PI*(Ri+RW*(ka+kb)/2)/(kw*1.15)));\n  const Kp=band(ka,kb,nK);\n  g.lineWidth=Math.max(.8,kw*.1);g.strokeStyle=ink;g.lineCap='square';\n  for(let i=0;i<nK;i++){\n    poly(Kp,i,[[.08,.88],[.08,.12],[.82,.12],[.82,.72],[.32,.72],[.32,.4],[.58,.4]],false);g.stroke();\n    poly(Kp,i,[[.08,.88],[1.08,.88]],false);g.stroke();\n  }\n  ring(ka-.02,1.4);ring(kb+.02,1.4);\n  ring(.03,1,inkSoft);   // a fine line where the glaze meets the water\n  g.restore();\n}\nif(rimCv){paintRim();addEventListener('resize',paintRim);if(window.ResizeObserver)new ResizeObserver(paintRim).observe(rimCv)}\nfunction fitCanvas(){\n  const w=cv.getBoundingClientRect().width||S;\n  const k=Math.round(clamp(w*(window.devicePixelRatio||1)/S,1,2)*4)/4;\n  if(k!==K){K=k;cv.width=cv.height=Math.round(S*K)}\n}\naddEventListener('resize',fitCanvas);\nfitCanvas();\nwindow.__tank={taps,step,render,setHour:h=>{live=false;playing=false;hour=h},fish,dropFood};\n\nconst go=()=>requestAnimationFrame(t=>{last=t;frame(t)});\n(document.fonts&&document.fonts.load?Promise.race([document.fonts.load('22px \"Ma Shan Zheng\"'),new Promise(r=>setTimeout(r,1200))]):Promise.resolve()).then(go,go);\nsyncUI();\n})();\n<\/script>\n<\/body><\/html>", "reef": "<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>[hidden]{display:none!important}body{margin:0}<\/style><\/head><body><title>Reef Tank<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap\">\n<style>\n/* Layout: a clear glass bowl holding the 480px round screen, with a quiet control column beside it (stacked on phones). */\n:root{\n  --paper:#f3f6f7;\n  --paper-deep:#e3eaec;\n  --ink:#0f1c22;\n  --ink-soft:#66767c;\n  --cinnabar:#ff6a4d;\n  --cobalt:#0f7fb8;\n  --jade:#14a088;\n  --porcelain:#ffffff;\n  --f-brush:\"Manrope\",system-ui,sans-serif;\n  --f-text:\"Manrope\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --scr:min(480px, calc(100vw - 72px));\n  color-scheme:light;\n}\nhtml,body{min-height:100%}\n[hidden]{display:none!important}\nbody{\n  background:var(--paper);\n  color:var(--ink);\n  font-family:var(--f-text);\n  font-size:15px;\n  line-height:1.5;\n}\n.page{\n  max-width:1060px;margin:0 auto;\n  padding-block:28px 48px;\n  padding-left:max(16px, env(safe-area-inset-left, 0px));\n  padding-right:max(16px, env(safe-area-inset-right, 0px));\n  display:grid;gap:28px;\n}\nheader{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}\nheader h1{font-family:var(--f-brush);font-weight:400;font-size:52px;line-height:1;margin:0;letter-spacing:.04em}\nheader .sub{color:var(--ink-soft);padding-bottom:6px}\n.seal{\n  display:inline-grid;place-items:center;width:40px;height:40px;border-radius:6px;\n  background:var(--cinnabar);color:var(--porcelain);font-family:var(--f-brush);font-size:20px;line-height:1;\n  transform:rotate(-4deg);margin-bottom:6px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)\n}\n.main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:36px;align-items:start}\n@media (max-width:900px){.main{grid-template-columns:1fr;justify-items:center}}\n\n/* The porcelain bowl */\n.bowl{\n  --rim:calc(var(--scr) * .075);\n  position:relative;width:calc(var(--scr) + var(--rim)*2);aspect-ratio:1;max-width:100%;\n  border-radius:50%;\n  background:radial-gradient(circle at 34% 28%, rgba(255,255,255,.95) 0 30%, #e6eef1 62%, #c9d7dc 100%);\n  box-shadow:0 22px 40px -18px rgba(60,45,25,.45), 0 4px 10px rgba(60,45,25,.12);\n  display:grid;place-items:center;\n}\n.bowl::before{ /* a single fine line where the glass thickens */\n  content:\"\";position:absolute;inset:calc(var(--rim)*.22);border-radius:50%;\n  border:1px solid rgba(15,127,184,.22);\n  pointer-events:none;\n}\n.screen{\n  position:relative;width:var(--scr);height:var(--scr);border-radius:50%;overflow:hidden;\n  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08), 0 0 0 3px rgba(255,255,255,.9);\n  font-size:calc(var(--scr) * .027);\n  touch-action:manipulation;user-select:none;-webkit-user-select:none;\n}\ncanvas#tank{display:block;width:100%;height:100%;cursor:pointer}\n\n/* Fish card on the screen */\n.card{\n  position:absolute;left:50%;bottom:9%;transform:translateX(-50%);\n  width:64%;padding:.9em 1.1em .85em;\n  background:rgba(255,255,255,.94);\n  border-radius:.6em;\n  box-shadow:0 .4em 1.2em rgba(40,30,20,.25);\n  color:var(--ink);\n  display:grid;grid-template-columns:auto 1fr;gap:.2em .8em;align-items:center;\n  animation:card-in .25s ease-out;\n}\n@keyframes card-in{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}\n.card .cseal{\n  grid-row:span 2;width:2.6em;height:2.6em;border-radius:.3em;background:var(--cinnabar);color:var(--porcelain);\n  display:grid;place-items:center;font-family:var(--f-brush);font-size:1.5em;line-height:1;transform:rotate(-5deg)\n}\n.card .cname{font-family:var(--f-brush);font-size:1.75em;line-height:1}\n.card .cname small{font-family:var(--f-text);font-size:.45em;color:var(--ink-soft);margin-left:.4em;letter-spacing:.02em}\n.card .cmeta{font-size:.95em;color:var(--ink-soft);line-height:1.3}\n.card .stats{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto;gap:.25em .6em;align-items:center;margin-top:.45em;font-size:.95em}\n.card .stats b{font-weight:600}\n.card .x{position:absolute;top:.25em;right:.45em;border:0;background:none;color:var(--ink-soft);font-size:1.3em;cursor:pointer;padding:.1em .3em}\n.bar{height:.55em;border-radius:1em;background:rgba(43,38,34,.1);overflow:hidden}\n.bar i{display:block;height:100%;border-radius:1em;transition:width .4s}\n\n/* Control sheet */\n.sheet{display:grid;gap:22px;min-width:0;width:100%;max-width:560px}\n.sheet h2{font-family:var(--f-brush);font-weight:400;font-size:26px;margin:0 0 6px;line-height:1.1}\n.sheet h2 small{font-family:var(--f-text);font-size:13px;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase;margin-left:8px}\n.block{padding-top:16px;border-top:1px solid rgba(43,38,34,.14)}\n.timebig{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}\n.timebig .clock{font-size:34px;font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.02em}\n.timebig .period{font-family:var(--f-brush);font-size:24px}\n.timebig .period small{font-family:var(--f-text);font-size:15px;color:var(--ink-soft)}\n.timebig .tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:20px;border:1px solid currentColor;color:var(--jade)}\n.timebig .tag.off{color:var(--ink-soft)}\n.skybar{height:14px;border-radius:8px;margin:12px 0 4px;position:relative}\ninput[type=range]{width:100%;margin:0;accent-color:var(--cobalt)}\n.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}\n.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}\nbutton.btn{\n  font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;cursor:pointer;\n  border:1px solid rgba(43,38,34,.28);background:rgba(255,255,255,.45);color:var(--ink);\n}\nbutton.btn:hover{background:rgba(255,255,255,.8)}\nbutton.btn[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}\nbutton:focus-visible,input:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}\n.roster{display:grid;gap:2px;margin:0;padding:0;list-style:none}\n.roster li{\n  display:grid;grid-template-columns:22px minmax(0,1fr) 84px 70px;gap:10px;align-items:center;\n  padding:6px 8px;border-radius:8px;cursor:pointer\n}\n.roster li:hover,.roster li.sel{background:rgba(255,255,255,.5)}\n.roster .dot{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}\n.roster .nm{font-family:var(--f-brush);font-size:20px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.roster .nm small{font-family:var(--f-text);font-size:12px;color:var(--ink-soft);margin-left:6px}\n.roster .md{font-size:13px;color:var(--ink-soft);white-space:nowrap}\n.roster .hdr{cursor:default;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding-block:0}\n.roster .hdr:hover{background:none}\n.howto{margin:0;padding:0;list-style:none;display:grid;gap:6px}\n.howto li{display:grid;grid-template-columns:110px 1fr;gap:10px}\n.howto b{font-weight:600}\n.note{color:var(--ink-soft);font-size:13px;max-width:62ch}\n@media (max-width:480px){\n  header h1{font-size:42px}\n  .roster li{grid-template-columns:18px minmax(0,1fr) 64px 56px;gap:8px}\n  .howto li{grid-template-columns:1fr;gap:0}\n}\n@media (prefers-reduced-motion:reduce){.card{animation:none}}\n/* Full screen tank */\n.stage{display:grid;justify-items:center;gap:14px;min-width:0;max-width:100%}\n.fs-exit{display:none}\nbody.full{overflow:hidden}\nbody.full .stage{\n  position:fixed;inset:0;z-index:50;place-content:center;justify-content:center;gap:0;overflow:hidden;\n  background:#55673a;\n  --scr:min(70vw, 76vh);\n}\n@supports (height:1dvh){body.full .stage{--scr:min(70vw, 76dvh)}}\n/* tall screens (phones): the bowl spills past the sides so the water is as big as it can be */\n@media (max-aspect-ratio:1/1){\n  body.full .stage{--scr:min(112vw, 78vh)}\n  @supports (height:1dvh){body.full .stage{--scr:min(112vw, 78dvh)}}\n}\n.garden,.garden-light{display:none}\nbody.full .garden{display:block;position:absolute;inset:0;width:100%;height:100%}\nbody.full .garden-light{display:block;position:absolute;inset:0;mix-blend-mode:multiply;pointer-events:none;transition:background-color 1s}\nbody.full .bowl{z-index:1;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:none;box-shadow:0 30px 50px -20px rgba(20,25,10,.65), 0 6px 14px rgba(20,25,10,.35)}\nbody.full .fs-open{display:none}\nbody.full .fs-exit{\n  display:grid;place-items:center;position:fixed;z-index:51;\n  top:calc(12px + env(safe-area-inset-top, 0px));right:calc(12px + env(safe-area-inset-right, 0px));\n  width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);\n  background:rgba(35,32,26,.72);color:#f2ead9;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:26px;line-height:1;cursor:pointer;\n}\nbody.full .fs-exit:hover{background:rgba(35,32,26,.9)}\n/* modern minimal overrides */\nheader h1{font-weight:700;font-size:40px;letter-spacing:-.03em}\nheader .sub{padding-bottom:4px}\n.sheet h2{font-weight:700;font-size:20px;letter-spacing:-.01em}\n.timebig .period{font-size:20px;font-weight:500}\n.card{border-radius:1em;box-shadow:0 .5em 1.6em rgba(10,30,40,.18)}\n.card .cseal{border-radius:50%;transform:none;font-weight:700;font-size:1.25em}\n.card .cname{font-size:1.4em;font-weight:700;letter-spacing:-.01em}\n.roster .nm{font-size:15px;font-weight:600}\nbutton.btn{border-color:rgba(15,28,34,.16);background:#fff}\nbutton.btn:hover{background:#eef4f6}\nbody.full .stage{background:linear-gradient(165deg,#eef3f5,#cbd8dd)}\nbody.full .bowl{box-shadow:0 40px 60px -30px rgba(10,40,55,.45), 0 8px 18px rgba(10,40,55,.12)}\n\n/* deep-water glass rim: a clear acrylic ring you look down through */\n.bowl{background:#06142c!important}\n.bowl::before{display:none}\n.bowl .rim{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;pointer-events:none}\n.bowl .screen{position:relative;z-index:1}\n/* the rim takes the light of the hour, like the water does */\n.bowl .rim-light{position:absolute;inset:-2px;border-radius:50%;pointer-events:none;z-index:3;mix-blend-mode:multiply;transition:background-color 1s;\n  -webkit-mask:radial-gradient(closest-side,transparent 85.5%,#000 86.5%);mask:radial-gradient(closest-side,transparent 85.5%,#000 86.5%)}\n<\/style>\n\n<div class=\"page\">\n  <header>\n    <h1>Reef<\/h1>\n    <div class=\"sub\">A modern glass reef for the 2.1&Prime; round screen (480 \u00d7 480)<\/div>\n  <\/header>\n\n  <div class=\"main\">\n    <div class=\"stage\" id=\"stage\">\n      <canvas class=\"garden\" id=\"garden\" aria-hidden=\"true\"><\/canvas>\n      <div class=\"garden-light\" id=\"garden-light\"><\/div>\n    <div class=\"bowl\">\n      <canvas class=\"rim\" id=\"rim\" aria-hidden=\"true\"><\/canvas>\n      <div class=\"rim-light\" id=\"rim-light\" aria-hidden=\"true\"><\/div>\n      <div class=\"screen\" id=\"screen\">\n        <canvas id=\"tank\" width=\"480\" height=\"480\" aria-label=\"Fish tank. Double-tap to feed, tap a fish to see its card.\"><\/canvas>\n        <div class=\"card\" id=\"card\" hidden>\n          <button class=\"x\" id=\"card-x\" aria-label=\"Close card\">\u00d7<\/button>\n          <div class=\"cseal\" id=\"c-seal\">S<\/div>\n          <div class=\"cname\" id=\"c-name\">Sunny<\/div>\n          <div class=\"cmeta\" id=\"c-meta\"><\/div>\n          <div class=\"stats\">\n            <span>Mood<\/span><div class=\"bar\"><i id=\"c-moodbar\"><\/i><\/div><b id=\"c-mood\"><\/b>\n            <span>Hunger<\/span><div class=\"bar\"><i id=\"c-hungerbar\"><\/i><\/div><b id=\"c-hunger\"><\/b>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n      <button class=\"btn fs-open\" id=\"btn-full\" aria-pressed=\"false\">\u26f6 Full screen<\/button>\n      <button class=\"fs-exit\" id=\"btn-exit\" aria-label=\"Exit full screen\">\u00d7<\/button>\n    <\/div>\n\n    <div class=\"sheet\">\n      <section>\n        <h2>Light <small>Time of day<\/small><\/h2>\n        <div class=\"timebig\">\n          <span class=\"clock\" id=\"clock\">--:--<\/span>\n          <span class=\"period\" id=\"period\"><\/span>\n          <span class=\"tag\" id=\"livetag\">Live clock<\/span>\n        <\/div>\n        <div class=\"skybar\" id=\"skybar\" aria-hidden=\"true\"><\/div>\n        <label for=\"time-slider\" class=\"note\" style=\"display:block;margin-bottom:2px\">Drag to preview any hour<\/label>\n        <input type=\"range\" id=\"time-slider\" min=\"0\" max=\"24\" step=\"0.05\" value=\"12\">\n        <div class=\"ticks\"><span>0<\/span><span>3<\/span><span>6<\/span><span>9<\/span><span>12<\/span><span>15<\/span><span>18<\/span><span>21<\/span><span>24<\/span><\/div>\n        <div class=\"row\">\n          <button class=\"btn\" id=\"btn-live\" aria-pressed=\"true\">Follow my clock<\/button>\n          <button class=\"btn\" id=\"btn-play\" aria-pressed=\"false\">Play a whole day<\/button>\n        <\/div>\n        <div class=\"row\" id=\"jumps\">\n          <button class=\"btn\" data-h=\"6\">6:00 dawn<\/button>\n          <button class=\"btn\" data-h=\"12\">12:00 day<\/button>\n          <button class=\"btn\" data-h=\"17\">17:00 golden<\/button>\n          <button class=\"btn\" data-h=\"18\">18:00 sunset<\/button>\n          <button class=\"btn\" data-h=\"22\">22:00 moonlight<\/button>\n        <\/div>\n      <\/section>\n\n      <section class=\"block\">\n        <h2>Residents <small>Fish of the reef<\/small><\/h2>\n        <ul class=\"roster\" id=\"roster\">\n          <li class=\"hdr\"><span><\/span><span>Name<\/span><span>Mood<\/span><span>Hunger<\/span><\/li>\n        <\/ul>\n        <div class=\"row\">\n          <button class=\"btn\" id=\"btn-speed\" aria-pressed=\"false\">Fast hunger (60\u00d7)<\/button>\n          <button class=\"btn\" id=\"btn-reset\">Reset the fish<\/button>\n        <\/div>\n        <p class=\"note\" id=\"reset-msg\" hidden>Fish reset to their starting stats.<\/p>\n      <\/section>\n\n      <section class=\"block\">\n        <h2>How to play<\/h2>\n        <ul class=\"howto\">\n          <li><b>Double-tap<\/b><span>Drop a pinch of food. Hungry fish race to it; full ones ignore it.<\/span><\/li>\n          <li><b>Tap a fish<\/b><span>Opens its card with name, colour, age, mood and hunger. A tap is also a little pat, which cheers it up. Tap the puffer and it puffs up.<\/span><\/li>\n          <li><b>Anemones<\/b><span>They catch any food that drifts into them. Most fish steer around them and dart off if stung; the clownfish live safely inside.<\/span><\/li>\n          <li><b>Scroll on tank<\/b><span>Stands in for turning the knob: moves the hour to preview the light.<\/span><\/li>\n        <\/ul>\n        <p class=\"note\">Fish get hungrier over about 8 hours, and stats are kept in this browser. Mood drifts toward a level set by hunger, rises with food and pats, and fish get sleepy after dark.<\/p>\n      <\/section>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n(() => {\n'use strict';\nconst S = 480, C = S / 2, R = 238;\nconst cv = document.getElementById('tank');\nlet ctx = cv.getContext('2d');   // swapped briefly when a fish is drawn into its depth buffer\nlet K = 1;   // drawing scale: the tank is laid out in 480 units and drawn sharper on bigger screens\n\n/* ---------- helpers ---------- */\nfunction mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\nconst rnd = mulberry(20261115);\nconst rr = (a,b)=>a+(b-a)*Math.random();\nconst clamp=(v,a,b)=>v<a?a:v>b?b:v;\nfunction off(w=S,h=S){const c=document.createElement('canvas');c.width=w;c.height=h;return c}\nfunction hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}\nfunction mix(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}\nconst css=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;\n// soft blur that works in every browser: draw far off-canvas and let the shadow land in place\nfunction softBlob(g,x,y,rx,ry,rot,color,blur){g.save();g.shadowColor=color;g.shadowBlur=blur;g.shadowOffsetX=10000;g.beginPath();g.ellipse(x-10000,y,rx,ry,rot,0,6.283);g.fillStyle='#000';g.fill();g.restore()}\n\n/* ---------- time of day palette: reef lights that follow the sky reference ---------- */\n// [hour, deep water, sky tint, caustic tint, ambient light]\nconst SKY = [\n  [0,   '#061a3a','#12306e','#3a5adf','#4f5cbc'],\n  [4.5, '#071c3e','#143472','#3e5ee0','#525fbe'],\n  [5.5, '#0a2a4a','#2a5a8a','#6a8ac0','#8090c0'],\n  [6,   '#0d4a5a','#3ab0b0','#a8f0e0','#cfe8e6'],\n  [7,   '#0f5a78','#7ac8e0','#fff0d0','#f6efe2'],\n  [8,   '#0c6a9a','#4ab8ec','#ffffff','#ffffff'],\n  [12,  '#0a73a8','#38bff0','#ffffff','#ffffff'],\n  [16,  '#0f6896','#6ab8e6','#fff6e8','#fdf6ee'],\n  [17,  '#2a5a80','#e8b0a8','#ffd8c8','#fde2d2'],\n  [18,  '#3a3a68','#e87850','#ffa880','#f2b496'],\n  [18.6,'#1a2458','#6a5aa8','#9a8ae0','#9c90c8'],\n  [19,  '#081e4a','#1e3a8a','#5070e0','#5a68c4'],\n  [21,  '#061a3a','#12306e','#3a5adf','#4f5cbc'],\n  [24,  '#061a3a','#12306e','#3a5adf','#4f5cbc'],\n].map(k=>[k[0],hex(k[1]),hex(k[2]),hex(k[3]),hex(k[4])]);\nfunction skyAt(h){\n  h=((h%24)+24)%24;\n  for(let i=0;i<SKY.length-1;i++){\n    const a=SKY[i],b=SKY[i+1];\n    if(h>=a[0]&&h<=b[0]){const t=(h-a[0])/(b[0]-a[0]);const s=t*t*(3-2*t);\n      return{deep:mix(a[1],b[1],s),sky:mix(a[2],b[2],s),caus:mix(a[3],b[3],s),amb:mix(a[4],b[4],s)}}\n  }\n  const a=SKY[0];return{deep:a[1],sky:a[2],caus:a[3],amb:a[4]};\n}\nfunction daylight(h){h=((h%24)+24)%24;if(h<5||h>=19.2)return 0;if(h<7)return (h-5)/2;if(h>17.8)return Math.max(0,(19.2-h)/1.4);return 1}\nfunction nightness(h){return 1-daylight(h)}\nfunction sunsetGlow(h){return Math.max(0,1-Math.abs(h-17.9)/1.0)}\nfunction periodOf(h){\n  h=((h%24)+24)%24;const p=h<5?'Late night':h<7?'Dawn':h<11?'Morning':h<13?'Noon':h<16.5?'Afternoon':h<18.6?'Sunset':h<21?'Evening':'Night';\n  return[p,p];\n}\n\n/* ---------- pre-painted layers (bake once, blit every frame) ---------- */\n// sand bed with ripples and a few shells\nconst sandL = off();\n(()=>{const g=sandL.getContext('2d');\n  const gr=g.createRadialGradient(C,C,20,C,C,R);gr.addColorStop(0,'#f1e7cf');gr.addColorStop(1,'#d9caa6');g.fillStyle=gr;g.fillRect(0,0,S,S);\n  for(let i=0;i<5200;i++){const v=rnd();g.fillStyle=v<.5?'rgba(255,255,255,.5)':v<.85?'rgba(160,135,90,.35)':'rgba(90,80,70,.35)';g.fillRect(rnd()*S,rnd()*S,1.2,1.2)}\n  g.save();g.translate(C,C);g.rotate(-.5);g.lineCap='round';\n  for(let y=-S;y<S;y+=11){g.beginPath();for(let x=-S;x<=S;x+=8){const yy=y+Math.sin(x*.035+y*.2)*3.5;x===-S?g.moveTo(x,yy):g.lineTo(x,yy)}\n    g.strokeStyle='rgba(150,125,80,.18)';g.lineWidth=2.2;g.stroke();g.translate(0,-1.4);g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1.2;g.stroke();g.translate(0,1.4)}\n  g.restore();\n  for(let i=0;i<7;i++){const a=rnd()*6.283,d=40+rnd()*170,x=C+Math.cos(a)*d,y=C+Math.sin(a)*d,r=4+rnd()*4,rot=rnd()*6.283;\n    g.save();g.translate(x,y);g.rotate(rot);\n    if(i%2){for(let k=0;k<7;k++){const t=-.9+k*.3;g.beginPath();g.moveTo(0,r*.6);g.lineTo(Math.sin(t)*r*1.4,-Math.cos(t)*r*1.2);g.strokeStyle='rgba(200,150,140,.7)';g.lineWidth=2.2;g.stroke()}}\n    else{g.beginPath();for(let k=0;k<40;k++){const t=k/40*12.5,rr2=t/12.5*r;g.lineTo(Math.cos(t)*rr2,Math.sin(t)*rr2*.8)}g.strokeStyle='rgba(235,225,210,.9)';g.lineWidth=1.8;g.stroke()}\n    g.restore()}\n})();\n// soft pools of colour in the water\nconst washL = off(S+40,S+40);\n(()=>{const g=washL.getContext('2d');\n  for(let i=0;i<20;i++){const x=rnd()*(S+40),y=rnd()*(S+40),r=40+rnd()*90;softBlob(g,x,y,r,r*(.6+rnd()*.4),rnd()*3,`rgba(0,40,70,${.04+rnd()*.06})`,30)}\n})();\n// anemones (drawn live) and the reef around them\nconst ANEM=[{x:150,y:302,r:34,base:'#f1a6c0',tip:'#ff4f97',n:46},{x:338,y:150,r:28,base:'#bfe98a',tip:'#3ff0c2',n:40},{x:350,y:340,r:21,base:'#ffc98a',tip:'#ff8a33',n:32}];\nconst reefL = off();\n(()=>{const g=reefL.getContext('2d');\n  const near=(x,y,pad)=>ANEM.some(a=>Math.hypot(a.x-x,a.y-y)<a.r+pad);\n  const shadowed=fn=>{g.save();g.shadowColor='rgba(20,30,40,.35)';g.shadowBlur=10;g.shadowOffsetX=5;g.shadowOffsetY=7;fn();g.restore();fn()};\n  // live rock\n  for(const [x,y,r] of [[82,250,46],[118,346,40],[300,96,40],[396,232,40],[262,398,34],[170,108,26]]){\n    const pts=[...Array(12)].map((_,i)=>[i/12*6.283,.8+rnd()*.3]);\n    const path=()=>{g.beginPath();pts.forEach(([a,k],i)=>{const px=x+Math.cos(a)*r*k,py=y+Math.sin(a)*r*k*.85;i?g.lineTo(px,py):g.moveTo(px,py)});g.closePath()};\n    shadowed(()=>{path();const gr=g.createRadialGradient(x-r*.35,y-r*.4,2,x,y,r*1.1);gr.addColorStop(0,'#c9beb2');gr.addColorStop(1,'#8b7f75');g.fillStyle=gr;g.fill()});\n    g.save();path();g.clip();\n    for(let k=0;k<5;k++){g.beginPath();g.arc(x+(rnd()-.5)*r*1.4,y+(rnd()-.5)*r,r*(.18+rnd()*.25),0,6.283);g.fillStyle=['#d77aa0','#b65a8a','#e893b5'][k%3];g.globalAlpha=.75;g.fill()}\n    g.globalAlpha=1;for(let k=0;k<26;k++){g.beginPath();g.arc(x+(rnd()-.5)*r*1.5,y+(rnd()-.5)*r*1.3,1+rnd()*1.8,0,6.283);g.fillStyle='rgba(60,50,45,.45)';g.fill()}\n    g.restore();\n  }\n  // brain coral\n  for(const [x,y,r] of [[96,252,24],[402,236,20]]){\n    shadowed(()=>{g.beginPath();g.arc(x,y,r,0,6.283);g.fillStyle='#d7c45a';g.fill()});\n    g.save();g.beginPath();g.arc(x,y,r,0,6.283);g.clip();g.strokeStyle='#9c8a2a';g.lineWidth=1.6;g.lineCap='round';\n    for(let k=0;k<14;k++){let px=x+(rnd()-.5)*r*2,py=y+(rnd()-.5)*r*2,a=rnd()*6.283;g.beginPath();g.moveTo(px,py);for(let j=0;j<10;j++){a+=(rnd()-.5)*1.4;px+=Math.cos(a)*4;py+=Math.sin(a)*4;g.lineTo(px,py)}g.stroke()}\n    g.restore()}\n  // branching coral\n  const branch=(x,y,a,len,w,depth,col,tip)=>{const x2=x+Math.cos(a)*len,y2=y+Math.sin(a)*len;g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke();\n    if(depth<=0){g.beginPath();g.arc(x2,y2,w*.6,0,6.283);g.fillStyle=tip;g.fill();return}\n    branch(x2,y2,a+(rnd()-.5)*1.1-.35,len*.78,w*.78,depth-1,col,tip);branch(x2,y2,a+(rnd()-.5)*1.1+.35,len*.78,w*.78,depth-1,col,tip)};\n  for(const [x,y,col,tip] of [[300,100,'#8a5ad8','#d6b8ff'],[262,400,'#3a8fe0','#b4e2ff'],[176,106,'#ff7a5a','#ffd0c0']]){\n    g.save();g.shadowColor='rgba(20,30,40,.3)';g.shadowBlur=6;g.shadowOffsetX=4;g.shadowOffsetY=6;\n    for(let k=0;k<5;k++)branch(x,y,k/5*6.283+rnd()*.5,13+rnd()*6,5,3,col,tip);g.restore()}\n  // sea plants in a ring by the glass: seagrass, feather algae and red macroalgae\n  const ring=(a,r0,r1)=>{const d=r0+rnd()*(r1-r0);return[C+Math.cos(a)*d,C+Math.sin(a)*d]};\n  for(let i=0;i<34;i++){\n    const a=i/34*6.283+rnd()*.15,[x,y]=ring(a,190,228),type=i%3;\n    if(near(x,y,14))continue;\n    g.save();g.lineCap='round';g.lineJoin='round';g.shadowColor='rgba(10,40,40,.3)';g.shadowBlur=5;g.shadowOffsetX=3;g.shadowOffsetY=4;\n    if(type===0){ // seagrass blades sweeping along the wall\n      for(let k=0;k<6;k++){let ang=a+Math.PI/2*(rnd()<.5?1:-1)+(rnd()-.5)*1.4,px=x,py=y;const len=30+rnd()*40;g.beginPath();g.moveTo(px,py);\n        for(let j=0;j<len/4;j++){ang+=(rnd()-.5)*.15;px+=Math.cos(ang)*4;py+=Math.sin(ang)*4;if(Math.hypot(px-C,py-C)<165){const o=Math.atan2(py-C,px-C);ang+=Math.atan2(Math.sin(o-ang),Math.cos(o-ang))*.4}g.lineTo(px,py)}\n        g.strokeStyle=['#3fa860','#56c070','#2f8f55'][k%3];g.lineWidth=3;g.stroke()}\n    }else if(type===1){ // feather caulerpa\n      for(let k=0;k<4;k++){let ang=a+Math.PI+(rnd()-.5)*2.4;if(Math.cos(ang-a)<-.3)ang=a+Math.PI/2*(rnd()<.5?1:-1);let px=x,py=y;const len=22+rnd()*26;\n        g.strokeStyle='#4cc46a';g.lineWidth=1.6;g.beginPath();\n        for(let j=0;j<len/3;j++){px+=Math.cos(ang)*3;py+=Math.sin(ang)*3;g.moveTo(px,py);g.lineTo(px+Math.cos(ang+1.2)*5,py+Math.sin(ang+1.2)*5);g.moveTo(px,py);g.lineTo(px+Math.cos(ang-1.2)*5,py+Math.sin(ang-1.2)*5)}\n        g.stroke()}\n    }else{ // red gracilaria tufts\n      const col=['#d8456a','#e8607a','#c23a5a'][i%3];\n      for(let k=0;k<12;k++){const ang=rnd()*6.283,len=6+rnd()*13;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(ang+.4)*len*.6,y+Math.sin(ang+.4)*len*.6,x+Math.cos(ang)*len,y+Math.sin(ang)*len);g.strokeStyle=col;g.lineWidth=2;g.stroke()}\n    }\n    g.restore();\n  }\n  // mushroom corals and zoanthids\n  for(let i=0;i<9;i++){let x,y,ok=false;for(let t=0;t<40&&!ok;t++){const a=rnd()*6.283,d=168+rnd()*50;x=C+Math.cos(a)*d;y=C+Math.sin(a)*d;ok=!near(x,y,18)}\n    if(!ok)continue;\n    if(i%2){const r=7+rnd()*5;shadowed(()=>{g.beginPath();g.arc(x,y,r,0,6.283);g.fillStyle='#2fb58e';g.fill()});\n      g.strokeStyle='rgba(10,80,60,.5)';g.lineWidth=.8;for(let k=0;k<16;k++){const a=k/16*6.283;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);g.stroke()}\n      g.beginPath();g.arc(x,y,r*.22,0,6.283);g.fillStyle='#bff5e0';g.fill()}\n    else{for(let k=0;k<9;k++){const px=x+(rnd()-.5)*18,py=y+(rnd()-.5)*18;g.beginPath();g.arc(px,py,3.2,0,6.283);g.fillStyle=['#ff8a33','#3ff08a','#ffd23a'][i%3];g.fill();g.beginPath();g.arc(px,py,1.2,0,6.283);g.fillStyle='#3a2a20';g.fill()}}\n  }\n})();\n// caustic light network, tiling\nconst CW=360;\nconst causL=off(CW,CW), causTint=off(CW,CW);\n(()=>{const g=causL.getContext('2d');g.lineJoin='round';\n  for(let i=0;i<70;i++){const x=rnd()*CW,y=rnd()*CW,r=10+rnd()*20,n=7,pts=[...Array(n)].map((_,k)=>[k/n*6.283,r*(.7+rnd()*.5)]);\n    for(const ox of [-CW,0,CW])for(const oy of [-CW,0,CW]){g.beginPath();pts.forEach(([a,q],k)=>{const px=x+ox+Math.cos(a)*q,py=y+oy+Math.sin(a)*q;k?g.lineTo(px,py):g.moveTo(px,py)});g.closePath();\n      g.strokeStyle=`rgba(255,255,255,${.35+rnd()*.3})`;g.lineWidth=.9+rnd()*1.2;g.shadowColor='#fff';g.shadowBlur=4;g.stroke()}}\n})();\n\n/* ---------- fish ---------- */\nconst DAY = 86400000;\nconst ROSTER = [\n  {id:'sunny', cn:'Sunny', py:'', kind:'koi', breed:'Ocellaris clownfish', colorName:'Orange, white bands', L:30, W:.2, born:240, seal:'S', home:0,\n   pal:{body:'#ff7a1f',light:'#ffb066',edge:'#3a1a08',fin:'#ff8a30'},\n   spots:[{s:.17,l:0,band:1,r:.05,c:'#ffffff'},{s:.5,l:0,band:1,r:.06,c:'#ffffff'},{s:.86,l:0,band:1,r:.035,c:'#ffffff'}]},\n  {id:'pip', cn:'Pip', py:'', kind:'koi', breed:'Ocellaris clownfish', colorName:'Orange, white bands', L:25, W:.2, born:150, seal:'P', home:0,\n   pal:{body:'#ff8424',light:'#ffb871',edge:'#3a1a08',fin:'#ff9238'},\n   spots:[{s:.17,l:0,band:1,r:.05,c:'#ffffff'},{s:.5,l:0,band:1,r:.06,c:'#ffffff'},{s:.86,l:0,band:1,r:.035,c:'#ffffff'}]},\n  {id:'indigo', cn:'Indigo', py:'', kind:'koi', breed:'Blue tang', colorName:'Royal blue, yellow tail', L:46, W:.22, born:520, seal:'I',\n   pal:{body:'#2f6fe0',light:'#6aa8ff',edge:'#0a1f5a',fin:'#2a5ad0',tail:'#ffd23a'},\n   spots:[{s:.38,l:.42,r:.075,c:'#0d1a40'},{s:.6,l:.35,r:.07,c:'#0d1a40'},{s:.48,l:-.45,r:.05,c:'#0d1a40'}]},\n  {id:'lemon', cn:'Lemon', py:'', kind:'koi', breed:'Yellow tang', colorName:'Lemon yellow', L:40, W:.24, born:380, seal:'L',\n   pal:{body:'#ffd51f',light:'#fff27a',edge:'#9a7a00',fin:'#ffdf40'}},\n  {id:'violet', cn:'Violet', py:'', kind:'koi', breed:'Royal gramma', colorName:'Purple and gold', L:26, W:.17, born:200, seal:'V',\n   pal:{body:'#8a3ed8',light:'#c08aff',edge:'#3a1260',fin:'#9a50e0',tail:'#ffc62a'}, spots:[{s:.76,l:0,r:.14,c:'#ffc62a'},{s:.92,l:0,r:.1,c:'#ffc62a'}]},\n  {id:'bubbles', cn:'Bubbles', py:'', kind:'puffer', breed:'Spotted puffer', colorName:'Sand with dark spots', L:40, W:.3, born:700, seal:'B',\n   pal:{body:'#d9c49a',light:'#f6ead0',edge:'#5a4a2a',fin:'#e8d8b0'}},\n  {id:'mint', cn:'Mint', py:'', kind:'small', breed:'Green chromis', colorName:'Sea green', L:18, born:90, seal:'M'},\n  {id:'sage', cn:'Sage', py:'', kind:'small', breed:'Green chromis', colorName:'Sea green', L:17, born:70, seal:'S'},\n  {id:'fern', cn:'Fern', py:'', kind:'small', breed:'Green chromis', colorName:'Sea green', L:16, born:55, seal:'F'},\n];\nconst SMALL_PAL={body:'#7fe3c4',light:'#c8fff0',edge:'#2a8a72',fin:'#a8f0dc'};\nconst TANG_PAL=SMALL_PAL;\nconst START_HUNGER={sunny:55,pip:62,indigo:68,lemon:48,violet:58,bubbles:72,mint:50,sage:60,fern:66};\n\nconst HUNGER_PER_SEC = 100/(8*3600);   // empty to starving in ~8 h\nlet lifeSpeed = 1;\nconst STORE='reef-tank-v1';\n\nconst fish = ROSTER.map((d,i)=>{\n  const a=i*2.1, r=50+i*12;\n  return Object.assign({},d,{\n    pal:d.pal||(d.tangerine?TANG_PAL:SMALL_PAL), W:d.W||.13, spots:d.spots||[],\n    bornAt: Date.now()-d.born*DAY,\n    hunger: START_HUNGER[d.id], mood: 60,\n    x:C+Math.cos(a)*r, y:C+Math.sin(a)*r, ang:rr(0,6.28), speed:20, tx:C, ty:C, retarget:0,\n    phase:rr(0,6.28), chomp:0, z:rr(0,3), bend:0, wakeT:rr(0,1),\n    spd: d.kind==='puffer'?1:d.kind==='small'?rr(.95,1.15):rr(.88,1.05), puff:0,\n  });\n});\n\nfunction save(){try{localStorage.setItem(STORE,JSON.stringify({t:Date.now(),fish:fish.map(f=>({id:f.id,h:f.hunger,m:f.mood,b:f.bornAt}))}))}catch(e){}}\nfunction load(){\n  try{const raw=localStorage.getItem(STORE);if(!raw)return;const d=JSON.parse(raw);const gone=Math.max(0,(Date.now()-d.t)/1000);\n    d.fish.forEach(s=>{const f=fish.find(x=>x.id===s.id);if(!f)return;f.hunger=clamp(s.h+gone*HUNGER_PER_SEC,0,100);f.mood=s.m;f.bornAt=s.b})\n  }catch(e){}\n}\n// body chain: each joint trails the one ahead, so the body follows the head's path through turns\nconst N=14;\nfish.forEach(f=>{f.chain=[];for(let i=0;i<=N;i++){const d=f.L*(.5-i/N*.82);f.chain.push({x:f.x+Math.cos(f.ang)*d,y:f.y+Math.sin(f.ang)*d})}});\nfunction followChain(f){\n  const c=f.chain,seg=f.L*.82/N,stiff=f.kind==='small'?.25:.1;\n  c[0].x=f.x+Math.cos(f.ang)*f.L*.5;c[0].y=f.y+Math.sin(f.ang)*f.L*.5;\n  let px=-Math.cos(f.ang),py=-Math.sin(f.ang);          // direction pointing backward\n  for(let i=1;i<=N;i++){\n    const st=i/N,stf=stiff+(1-stiff)*.85*Math.pow(1-st,2);   // the front of the body is stiff, the tail is free\n    let dx=c[i].x-c[i-1].x,dy=c[i].y-c[i-1].y,l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;\n    dx=dx*(1-stf)+px*stf;dy=dy*(1-stf)+py*stf;l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;\n    // limit how sharply any one joint can fold\n    const cross=px*dy-py*dx,dot=px*dx+py*dy,maxA=.04+.38*Math.pow(st,1.6);\n    if(Math.atan2(cross,dot)>maxA||Math.atan2(cross,dot)<-maxA){const a=Math.atan2(py,px)+Math.sign(cross)*maxA;dx=Math.cos(a);dy=Math.sin(a)}\n    c[i].x=c[i-1].x+dx*seg;c[i].y=c[i-1].y+dy*seg;px=dx;py=dy;\n  }\n}\nload();\n\nfunction ageText(f){\n  const d=Math.floor((Date.now()-f.bornAt)/DAY);\n  if(d<31)return d+(d===1?' day':' days');\n  const y=Math.floor(d/365),m=Math.floor((d%365)/30.4);\n  if(y)return y+(y>1?' yrs':' yr')+(m?' '+m+' mo':'');\n  return m+' mo '+Math.floor(d-m*30.4)+' d';\n}\nfunction moodOf(f){\n  if(f.hunger>78)return['\u997f\u574f\u4e86','Starving'];\n  if(f.sleepy)return['\u56f0\u4e86','Sleepy'];\n  if(f.mood>80)return['\u5f00\u5fc3','Joyful'];\n  if(f.mood>62)return['\u6ee1\u8db3','Content'];\n  if(f.mood>42)return['\u5e73\u9759','Calm'];\n  if(f.mood>24)return['\u65e0\u804a','Bored'];\n  return['\u95f7\u95f7','Glum'];\n}\nfunction hungerText(h){return h<15?'Full':h<40?'Peckish':h<70?'Hungry':'Very hungry'}\nfunction hungerColor(h){return h<40?'#4f7f4c':h<70?'#d08a2e':'#b83a2a'}\n\n/* ---------- food, ripples, wakes, hearts, floating leaves ---------- */\nconst taps=[], food=[], ripples=[], pops=[], wakes=[], stings=[];\nconst bubbles=[], BUBBLER={x:430-30,y:300}; let bubT=0;\nfunction dropFood(x,y){\n  const n=5+(Math.random()*3|0);\n  for(let i=0;i<n;i++)food.push({x:x+rr(-14,14),y:y+rr(-14,14),vx:rr(-3,3),vy:rr(-3,3),life:50,ph:rr(0,6)});\n  ripples.push({x,y,t:0});\n}\nfunction pop(x,y){pops.push({x,y,t:0})}\n\n/* ---------- time state ---------- */\nlet live=true, playing=false, hour=nowHour();\nfunction nowHour(){const d=new Date();return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600}\n\n/* ---------- simulation ---------- */\nlet school={x:C,y:C,t:0};\nfunction randomPoint(maxR){const a=Math.random()*6.283,d=Math.sqrt(Math.random())*maxR;return[C+Math.cos(a)*d,C+Math.sin(a)*d]}\n// pick somewhere to swim that's away from the others, using the whole bowl rather than the middle\nfunction openSpot(f,maxR){let best=null,bs=-1;\n  for(let k=0;k<8;k++){const a=Math.random()*6.283,d=(.3+.7*Math.sqrt(Math.random()))*maxR,x=C+Math.cos(a)*d,y=C+Math.sin(a)*d;let m=1e9;\n    for(const o of fish){if(o===f||(o.kind==='small'&&(!f||f.kind==='small')))continue;m=Math.min(m,Math.hypot(o.x-x,o.y-y),Math.hypot(o.tx-x,o.ty-y)*1.2)}\n    if(m>bs){bs=m;best=[x,y]}}\n  return best}\nfunction update(dt,t){\n  const night=nightness(hour);\n  school.t-=dt;if(school.t<=0){[school.x,school.y]=openSpot(null,150);school.t=rr(7,13)}\n  for(const f of fish){\n    const small=f.kind==='small', turtle=false, puffer=f.kind==='puffer';\n    f.hunger=clamp(f.hunger+dt*HUNGER_PER_SEC*lifeSpeed,0,100);\n    const base=78-Math.max(0,f.hunger-25)*.9-night*8;\n    f.mood=clamp(f.mood+(base-f.mood)*dt*.004*lifeSpeed,0,100);\n    f.sleepy = night>.7 && f.hunger<80;   // only a starving fish stays up\n\n    let chasing=null;\n    if(f.hunger>12&&food.length){\n      let best=1e9;for(const p of food){const d=(p.x-f.x)**2+(p.y-f.y)**2;if(d<best){best=d;chasing=p}}\n    }\n    let maxSpeed;\n    if(chasing){f.tx=chasing.x;f.ty=chasing.y;maxSpeed=(puffer?22:small?44:34)*(.8+f.hunger/200)}\n    else{\n      f.retarget-=dt;\n      const near=Math.hypot(f.tx-f.x,f.ty-f.y)<14;\n      if(small){if(f.retarget<=0||near){f.tx=school.x+rr(-30,30);f.ty=school.y+rr(-30,30);f.retarget=rr(1.6,3.2)}}\n      else if(f.retarget<=0||near){if(f.home!=null){const a=ANEM[f.home];f.tx=a.x+rr(-a.r,a.r);f.ty=a.y+rr(-a.r,a.r);f.retarget=rr(1,3)}else{[f.tx,f.ty]=openSpot(f,165);f.retarget=rr(6,13)}}   // clownfish stay close to their anemone\n      maxSpeed=f.sleepy?0:(puffer?8:small?20:f.home!=null?10:14)*(f.hunger>78?.7:1);\n      f.nest=false;\n      if(f.sleepy&&f.home!=null){const a=ANEM[f.home],o=f.id==='pip'?[7,5]:[-6,-4];f.tx=a.x+o[0];f.ty=a.y+o[1];const d=Math.hypot(f.tx-f.x,f.ty-f.y);f.homing=d>5;f.nest=d<a.r*.7;maxSpeed=f.homing?Math.min(9,d*.6+2):0}   // clownfish bed down in their anemone\n      if(turtle){f.restT=(f.restT||0)-dt;if(f.restT<-rr(6,14))f.restT=rr(4,10);if(f.restT>0)maxSpeed=0}   // turtles stop for a sit on the pebbles\n    }\n    maxSpeed*=f.spd;\n    if(f.scare>0){f.scare-=dt;const a=Math.atan2(f.y-f.scy,f.x-f.scx);let ax=f.x+Math.cos(a)*90-C,ay=f.y+Math.sin(a)*90-C;const ad=Math.hypot(ax,ay);if(ad>150){ax*=150/ad;ay*=150/ad}f.tx=C+ax;f.ty=C+ay;maxSpeed=Math.max(maxSpeed,f.dash*Math.min(1,f.scare+.3));f.sleepy=false;if(f.restT>0)f.restT=0;if(f.retarget!=null)f.retarget=Math.max(f.retarget,.5);if(f.goShell)f.scare=0}\n    let want=Math.atan2(f.ty-f.y,f.tx-f.x);\n    if(!chasing&&!(f.scare>0)){   // personal space: ease away from neighbours instead of piling up (only between big fish and the turtle; small fish may pass over or under)\n      let ax=0,ay=0;for(const o of fish){if(o===f||f.kind==='small'||o.kind==='small'||(f.sleepy&&f.home!=null&&o.home===f.home))continue;const dx=f.x-o.x,dy=f.y-o.y,d=Math.hypot(dx,dy),rad=(f.L+o.L)*.8+12;\n        if(d>0&&d<rad){const w=(rad-d)/rad;ax+=dx/d*w;ay+=dy/d*w}}\n      if(ax||ay)want=Math.atan2(Math.sin(want)+ay*1.8,Math.cos(want)+ax*1.8);\n    }\n    f.stungT=Math.max(0,(f.stungT||0)-dt);\n    if(f.home==null){\n      for(const a of ANEM){\n        const ax=f.x-a.x,ay=f.y-a.y,ad=Math.hypot(ax,ay),keep=a.r+f.L*.45+14;\n        if(ad<keep){   // steer away, harder the closer it gets\n          const away=Math.atan2(ay,ax),w=clamp((keep-ad)/14,0,1)*.9;\n          let d2=away-want;d2=Math.atan2(Math.sin(d2),Math.cos(d2));\n          if(Math.cos(d2)<.2)want+=d2*w;\n        }\n        if(ad<a.r*.85+f.L*.2&&f.stungT<=0){   // a sting: dart off, a little upset\n          f.stungT=2.5;f.mood=clamp(f.mood-6,0,100);f.ang=Math.atan2(ay,ax);f.speed=Math.max(f.speed,small?70:55);\n          f.tx=f.x+ax/ad*90;f.ty=f.y+ay/ad*90;f.retarget=1.5;stings.push({x:f.x,y:f.y,t:0});\n        }\n      }\n    }\n    let diff=want-f.ang;diff=Math.atan2(Math.sin(diff),Math.cos(diff));\n    const resting=f.sleepy&&!chasing&&!f.homing;\n    const turn=resting?0:(puffer?1.1:small?2.4:1.6)*(chasing?1.4:1);\n    const dAng=clamp(diff,-turn*dt,turn*dt);\n    f.ang+=dAng;\n    f.bend+=((dt>0&&turn?dAng/dt/turn:0)-f.bend)*Math.min(1,dt*3);   // body curls into turns\n    const tgtSpeed=maxSpeed*(Math.abs(diff)>1.6?.45:1);\n    f.speed+=(tgtSpeed-f.speed)*Math.min(1,dt*(resting?1:1.8));\n    f.x+=Math.cos(f.ang)*f.speed*dt;f.y+=Math.sin(f.ang)*f.speed*dt;\n    const dx=f.x-C,dy=f.y-C,d=Math.hypot(dx,dy),lim=R-14-f.L*.35;\n    if(d>lim){f.x=C+dx/d*lim;f.y=C+dy/d*lim;[f.tx,f.ty]=openSpot(f,150)}\n    for(const o of fish){if(o===f)continue;const ox=f.x-o.x,oy=f.y-o.y,od=Math.hypot(ox,oy),min=(f.L+o.L)*.3;\n      if(od>0&&od<min){const p=(min-od)/min*30*dt;f.x+=ox/od*p;f.y+=oy/od*p}}\n    f.phase+=dt*(resting?.9:2+f.speed*(small?.22:.09));   // resting fish just fan their fins\n    f.chomp=Math.max(0,f.chomp-dt);\n    // depth: 0 at the surface, 1 near the bottom. Fish rise to take food from the surface, then drift back down\n    if(f.depth==null){f.depth=f.kind==='small'?rr(.15,.5):rr(.45,.9);f.dT=f.depth}\n    if(!chasing&&Math.random()<dt*.06)f.dT=f.kind==='small'?rr(.15,.5):f.kind==='turtle'?rr(.6,.95):rr(.35,.92);\n    const dGoal=chasing&&Math.hypot(f.tx-f.x,f.ty-f.y)<140?0:f.sleepy?(f.home!=null?.4:.85):f.dT;\n    f.depth+=(dGoal-f.depth)*Math.min(1,dt*(dGoal<f.depth?1.1:.18));\n    followChain(f);\n    if(puffer)f.puff=Math.max(0,f.puff-dt*.3);\n    // white ripple strokes behind moving koi\n    if(false){f.wakeT-=dt;if(f.wakeT<=0&&f.speed>12){wakes.push({x:f.x-Math.cos(f.ang)*f.L*.3,y:f.y-Math.sin(f.ang)*f.L*.3,a:f.ang,t:0,s:f.L});f.wakeT=rr(.7,1.3)*(30/Math.max(14,f.speed))}}\n    if(chasing){\n      const mx=f.x+Math.cos(f.ang)*f.L*.46,my=f.y+Math.sin(f.ang)*f.L*.46;\n      if(Math.hypot(mx-chasing.x,my-chasing.y)<(small?6:9)){\n        food.splice(food.indexOf(chasing),1);\n        f.hunger=clamp(f.hunger-(small?24:16),0,100);\n        f.mood=clamp(f.mood+12,0,100);f.chomp=.3;\n        pop(mx,my);ripples.push({x:mx,y:my,t:.6});\n      }\n    }\n  }\n  for(const a of ANEM){a.eat=Math.max(0,(a.eat||0)-dt*.4)}\n  for(let i=food.length-1;i>=0;i--){const p=food[i];const an=ANEM.find(a=>Math.hypot(p.x-a.x,p.y-a.y)<a.r*.9);if(an){an.eat=1;food.splice(i,1);continue}}\n  for(let i=stings.length-1;i>=0;i--){stings[i].t+=dt;if(stings[i].t>.6)stings.splice(i,1)}\n  for(let i=food.length-1;i>=0;i--){const p=food[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.995;p.vy*=.995;if(p.life<=0)food.splice(i,1)}\n  for(let i=ripples.length-1;i>=0;i--){ripples[i].t+=dt;if(ripples[i].t>1.6)ripples.splice(i,1)}\n  for(let i=taps.length-1;i>=0;i--){taps[i].t+=dt;if(taps[i].t>2.4)taps.splice(i,1)}\n  for(let i=wakes.length-1;i>=0;i--){wakes[i].t+=dt;if(wakes[i].t>2.2)wakes.splice(i,1)}\n  for(let i=pops.length-1;i>=0;i--){pops[i].t+=dt;if(pops[i].t>1.4)pops.splice(i,1)}\n  bubT-=dt;if(bubT<=0){bubT=rr(.08,.25);bubbles.push({x:BUBBLER.x+rr(-4,4),y:BUBBLER.y+rr(-4,4),vx:rr(-14,14),vy:rr(-14,14),t:0,life:rr(1,1.8),r:rr(1.2,2.6)})}\n  for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];b.t+=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.t>b.life)bubbles.splice(i,1)}\n}\n\n/* ---------- drawing ---------- */\nfunction widthAt(s){return s<.3?.3+.7*Math.sin(s/.3*Math.PI/2):1-Math.pow((s-.3)/.7,1.35)*.86}\nfunction washFill(color,alpha,blur){ctx.save();ctx.globalAlpha=Math.min(1,alpha+.35);ctx.fillStyle=color;ctx.fill();ctx.restore()}   // flat fills: no watercolor bleed\nconst SP=[...Array(N+1)].map(()=>({x:0,y:0,nx:0,ny:0,w:0}));\nfunction drawPuffer(f){\n  const L=f.L*(1+f.chomp*.06), p=f.pal, k=f.puff*f.puff*(3-2*f.puff);\n  const rx=.3*L*(1+k*.3), ry=.2*L*(1+k*.95), wig=Math.sin(f.phase*1.6);\n  // tail and fins flutter fast while the body barely moves\n  ctx.save();ctx.translate(-rx*.92,0);ctx.rotate(wig*.35);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-.2*L,-.1*L);ctx.quadraticCurveTo(-.16*L,0,-.2*L,.1*L);ctx.closePath();ctx.fillStyle=p.fin;ctx.fill();ctx.restore();\n  for(const s of [-1,1]){ctx.save();ctx.translate(rx*.25,s*ry*.92);ctx.rotate(s*(1.9+Math.sin(f.phase*3+s)*.4));ctx.beginPath();ctx.ellipse(.05*L,0,.07*L,.035*L,0,0,6.283);ctx.fillStyle=p.fin;ctx.fill();ctx.restore()}\n  // spines when puffed\n  if(k>.05){ctx.save();ctx.strokeStyle=p.edge;ctx.globalAlpha=.7*k;ctx.lineWidth=1.1;ctx.lineCap='round';ctx.beginPath();\n    for(let i=0;i<28;i++){const a=i/28*6.283,x=Math.cos(a)*rx,y=Math.sin(a)*ry;ctx.moveTo(x,y);ctx.lineTo(x*(1+.16*k),y*(1+.16*k))}ctx.stroke();ctx.restore()}\n  ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,6.283);\n  const gr=ctx.createRadialGradient(-rx*.1,-ry*.2,1,0,0,Math.max(rx,ry));gr.addColorStop(0,p.light);gr.addColorStop(1,p.body);ctx.fillStyle=gr;ctx.fill();\n  // spots stretch with the skin\n  ctx.save();ctx.clip();ctx.fillStyle='#3a2f1c';\n  for(let i=0;i<24;i++){const a=i*2.39996,d=Math.sqrt((i+.5)/24)*.85;ctx.beginPath();ctx.arc(Math.cos(a)*d*rx-rx*.12,Math.sin(a)*d*ry,.022*L*(1+k*.4),0,6.283);ctx.fill()}\n  ctx.restore();\n  ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,6.283);ctx.strokeStyle='rgba(60,45,20,.35)';ctx.lineWidth=1;ctx.stroke();\n  // big eyes and a little beak\n  for(const s of [-1,1]){const ex=rx*.5,ey=s*ry*.55,er=.07*L;ctx.beginPath();ctx.arc(ex,ey,er,0,6.283);ctx.fillStyle='#fff';ctx.fill();\n    ctx.beginPath();ctx.arc(ex+er*.2,ey,er*.62,0,6.283);ctx.fillStyle='#10202a';ctx.fill();ctx.beginPath();ctx.arc(ex+er*.35,ey-s*er*.25,er*.22,0,6.283);ctx.fillStyle='#fff';ctx.fill()}\n  ctx.beginPath();ctx.ellipse(rx*.98,0,.035*L,.03*L*(f.chomp>0?1.4:1),0,0,6.283);ctx.fillStyle='#b89a6a';ctx.fill();\n}\nfunction drawFish(f){\n  if(f.kind==='puffer')return drawPuffer(f);\n  const small=f.kind==='small', L=f.L*(1+f.chomp*.1), W=f.W*L, p=f.pal;\n  cons s:none;transition:background-color 1s}\nbody.full .bowl{z-index:1;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:none;box-shadow:0 30px 50px -20px rgba(20,25,10,.65), 0 6px 14px rgba(20,25,10,.35)}\nbody.full .fs-open{display:none}\nbody.full .fs-exit{\n  display:grid;place-items:center;position:fixed;z-index:51;\n  top:calc(12px + env(safe-area-inset-top, 0px));right:calc(12px + env(safe-area-inset-right, 0px));\n  width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);\n  background:rgba(35,32,26,.72);color:#f2ead9;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:26px;line-height:1;cursor:pointer;\n}\nbody.full .fs-exit:hover{background:rgba(35,32,26,.9)}\n/* modern minimal overrides */\nheader h1{font-weight:700;font-size:40px;letter-spacing:-.03em}\nheader .sub{padding-bottom:4px}\n.sheet h2{font-weight:700;font-size:20px;letter-spacing:-.01em}\n.timebig .period{font-size:20px;font-weight:500}\n.card{border-radius:1em;box-shadow:0 .5em 1.6em rgba(10,30,40,.18)}\n.card .cseal{border-radius:50%;transform:none;font-weight:700;font-size:1.25em}\n.card .cname{font-size:1.4em;font-weight:700;letter-spacing:-.01em}\n.roster .nm{font-size:15px;font-weight:600}\nbutton.btn{border-color:rgba(15,28,34,.16);background:#fff}\nbutton.btn:hover{background:#eef4f6}\nbody.full .stage{background:linear-gradient(165deg,#eef3f5,#cbd8dd)}\nbody.full .bowl{box-shadow:0 40px 60px -30px rgba(10,40,55,.45), 0 8px 18px rgba(10,40,55,.12)}\n.shells{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}\n.shells li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:#fff;border:1px solid rgba(15,28,34,.08)}\n.shells li.locked{background:transparent;border-style:dashed}\n.shells li.locked canvas{filter:grayscale(1) opacity(.35)}\n.shells li.now{border-color:var(--cobalt);box-shadow:inset 0 0 0 1px var(--cobalt)}\n.shells b{display:block;font-weight:600;font-size:14px}\n.shells span{font-size:12px;color:var(--ink-soft)}\n.shells button{font:inherit;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--cobalt);background:var(--cobalt);color:#fff;cursor:pointer}\n.toast{position:absolute;left:50%;top:17%;transform:translateX(-50%);background:rgba(15,28,34,.82);color:#fff;font-size:1.05em;padding:.4em .9em;border-radius:999px;white-space:nowrap;pointer-events:none}\n\n/* sculpted stone rim, painted on a canvas that overlaps the water's edge a little */\n.bowl{background:none!important;box-shadow:none!important}\n.bowl::before{display:none}\n.bowl .rim{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}\n.bowl .screen{position:relative;z-index:1}\nbody.full .bowl{box-shadow:none!important}\nbody.full .stage{background:#2c3520!important}\n/* the rim takes the light of the hour, like the water does */\n.bowl .rim-light{position:absolute;inset:-2px;border-radius:50%;pointer-events:none;z-index:3;mix-blend-mode:multiply;transition:background-color 1s;\n  -webkit-mask:radial-gradient(closest-side,transparent 85.5%,#000 86.5%);mask:radial-gradient(closest-side,transparent 85.5%,#000 86.5%)}\n/* soft focus: the moss reads as a calm, out-of-focus wash so the bowl stays the subject */\nbody.full .garden{opacity:.92}\nbody.full .stage::after{content:\"\";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(20,26,12,0) 45%,rgba(20,26,12,.45) 100%)}\n<\/style>\n\n<div class=\"page\">\n  <header>\n    <h1>Wadepool<\/h1>\n    <div class=\"sub\">Pebble the hermit crab\u2019s tide pool, for the 2.1&Prime; round screen (480 \u00d7 480)<\/div>\n  <\/header>\n\n  <div class=\"main\">\n    <div class=\"stage\" id=\"stage\">\n      <canvas class=\"garden\" id=\"garden\" aria-hidden=\"true\"><\/canvas>\n      <div class=\"garden-light\" id=\"garden-light\"><\/div>\n    <div class=\"bowl\">\n      <canvas class=\"rim\" id=\"rim\" aria-hidden=\"true\"><\/canvas>\n      <div class=\"rim-light\" id=\"rim-light\" aria-hidden=\"true\"><\/div>\n      <div class=\"screen\" id=\"screen\">\n        <canvas id=\"tank\" width=\"480\" height=\"480\" aria-label=\"Fish tank. Double-tap to feed, tap a fish to see its card.\"><\/canvas>\n        <div class=\"toast\" id=\"toast\" hidden><\/div>\n        <div class=\"card\" id=\"card\" hidden>\n          <button class=\"x\" id=\"card-x\" aria-label=\"Close card\">\u00d7<\/button>\n          <div class=\"cseal\" id=\"c-seal\">P<\/div>\n          <div class=\"cname\" id=\"c-name\">Pebble<\/div>\n          <div class=\"cmeta\" id=\"c-meta\"><\/div>\n          <div class=\"stats\">\n            <span>Mood<\/span><div class=\"bar\"><i id=\"c-moodbar\"><\/i><\/div><b id=\"c-mood\"><\/b>\n            <span>Hunger<\/span><div class=\"bar\"><i id=\"c-hungerbar\"><\/i><\/div><b id=\"c-hunger\"><\/b>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n      <button class=\"btn fs-open\" id=\"btn-full\" aria-pressed=\"false\">\u26f6 Full screen<\/button>\n      <button class=\"fs-exit\" id=\"btn-exit\" aria-label=\"Exit full screen\">\u00d7<\/button>\n    <\/div>\n\n    <div class=\"sheet\">\n      <section>\n        <h2>Light <small>Time of day<\/small><\/h2>\n        <div class=\"timebig\">\n          <span class=\"clock\" id=\"clock\">--:--<\/span>\n          <span class=\"period\" id=\"period\"><\/span>\n          <span class=\"tag\" id=\"livetag\">Live clock<\/span>\n        <\/div>\n        <div class=\"skybar\" id=\"skybar\" aria-hidden=\"true\"><\/div>\n        <label for=\"time-slider\" class=\"note\" style=\"display:block;margin-bottom:2px\">Drag to preview any hour<\/label>\n        <input type=\"range\" id=\"time-slider\" min=\"0\" max=\"24\" step=\"0.05\" value=\"12\">\n        <div class=\"ticks\"><span>0<\/span><span>3<\/span><span>6<\/span><span>9<\/span><span>12<\/span><span>15<\/span><span>18<\/span><span>21<\/span><span>24<\/span><\/div>\n        <div class=\"row\">\n          <button class=\"btn\" id=\"btn-live\" aria-pressed=\"true\">Follow my clock<\/button>\n          <button class=\"btn\" id=\"btn-play\" aria-pressed=\"false\">Play a whole day<\/button>\n        <\/div>\n        <div class=\"row\" id=\"jumps\">\n          <button class=\"btn\" data-h=\"6\">6:00 dawn<\/button>\n          <button class=\"btn\" data-h=\"12\">12:00 day<\/button>\n          <button class=\"btn\" data-h=\"17\">17:00 golden<\/button>\n          <button class=\"btn\" data-h=\"18\">18:00 sunset<\/button>\n          <button class=\"btn\" data-h=\"22\">22:00 moonlight<\/button>\n        <\/div>\n      <\/section>\n\n      <section class=\"block\">\n        <h2>Pebble <small>Your hermit crab<\/small><\/h2>\n        <ul class=\"roster\" id=\"roster\">\n          <li class=\"hdr\"><span><\/span><span>Name<\/span><span>Mood<\/span><span>Hunger<\/span><\/li>\n        <\/ul>\n        <div class=\"row\">\n          <button class=\"btn\" id=\"btn-speed\" aria-pressed=\"false\">Fast time (1 day a second)<\/button>\n          <button class=\"btn\" id=\"btn-reset\">Reset Pebble<\/button>\n        <\/div>\n        <p class=\"note\" id=\"reset-msg\" hidden>Pebble is young again, back in its first shell.<\/p>\n      <\/section>\n\n      <section class=\"block\">\n        <h2>Shells <small>Homes to grow into<\/small><\/h2>\n        <ul class=\"shells\" id=\"shells\"><\/ul>\n        <p class=\"note\">As Pebble grows, its shell gets snug and then too tight. New shells wash up on the sand when Pebble is nearly big enough for them. Tap one in the pool, or press Try it on here, and Pebble walks over and moves in.<\/p>\n      <\/section>\n\n      <section class=\"block\">\n        <h2>How to play<\/h2>\n        <ul class=\"howto\">\n          <li><b>Double-tap<\/b><span>Drop a pinch of food. Pebble scuttles over when hungry.<\/span><\/li>\n          <li><b>Tap Pebble<\/b><span>Opens its card with age, size, shell, mood and hunger. A tap is also a little pat.<\/span><\/li>\n          <li><b>Tap a shell<\/b><span>Offers it to Pebble. It only moves in if the shell fits.<\/span><\/li>\n          <li><b>Scroll on tank<\/b><span>Stands in for turning the knob: moves the hour to preview the light.<\/span><\/li>\n        <\/ul>\n        <p class=\"note\">Fish get hungrier over about 8 hours, and stats are kept in this browser. Mood drifts toward a level set by hunger, rises with food and pats, and fish get sleepy after dark.<\/p>\n      <\/section>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n(() => {\n'use strict';\nconst S = 480, C = S / 2, R = 238;\nconst cv = document.getElementById('tank');\nconst ctx = cv.getContext('2d');\nlet K = 1;   // drawing scale: the tank is laid out in 480 units and drawn sharper on bigger screens\n\n/* ---------- helpers ---------- */\nfunction mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\nconst rnd = mulberry(20261115);\nconst rr = (a,b)=>a+(b-a)*Math.random();\nconst clamp=(v,a,b)=>v<a?a:v>b?b:v;\nfunction off(w=S,h=S){const c=document.createElement('canvas');c.width=w;c.height=h;return c}\nfunction hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}\nfunction mix(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}\nconst css=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;\n// soft blur that works in every browser: draw far off-canvas and let the shadow land in place\nfunction softBlob(g,x,y,rx,ry,rot,color,blur){g.save();g.shadowColor=color;g.shadowBlur=blur;g.shadowOffsetX=10000;g.beginPath();g.ellipse(x-10000,y,rx,ry,rot,0,6.283);g.fillStyle='#000';g.fill();g.restore()}\n\n/* ---------- time of day palette: reef lights that follow the sky reference ---------- */\n// [hour, deep water, sky tint, caustic tint, ambient light]\nconst SKY = [\n  [0,   '#061a3a','#12306e','#3a5adf','#4f5cbc'],\n  [4.5, '#071c3e','#143472','#3e5ee0','#525fbe'],\n  [5.5, '#0a2a4a','#2a5a8a','#6a8ac0','#8090c0'],\n  [6,   '#0d4a5a','#3ab0b0','#a8f0e0','#cfe8e6'],\n  [7,   '#0f5a78','#7ac8e0','#fff0d0','#f6efe2'],\n  [8,   '#0c6a9a','#4ab8ec','#ffffff','#ffffff'],\n  [12,  '#0a73a8','#38bff0','#ffffff','#ffffff'],\n  [16,  '#0f6896','#6ab8e6','#fff6e8','#fdf6ee'],\n  [17,  '#2a5a80','#e8b0a8','#ffd8c8','#fde2d2'],\n  [18,  '#3a3a68','#e87850','#ffa880','#f2b496'],\n  [18.6,'#1a2458','#6a5aa8','#9a8ae0','#9c90c8'],\n  [19,  '#081e4a','#1e3a8a','#5070e0','#5a68c4'],\n  [21,  '#061a3a','#12306e','#3a5adf','#4f5cbc'],\n  [24,  '#061a3a','#12306e','#3a5adf','#4f5cbc'],\n].map(k=>[k[0],hex(k[1]),hex(k[2]),hex(k[3]),hex(k[4])]);\nfunction skyAt(h){\n  h=((h%24)+24)%24;\n  for(let i=0;i<SKY.length-1;i++){\n    const a=SKY[i],b=SKY[i+1];\n    if(h>=a[0]&&h<=b[0]){const t=(h-a[0])/(b[0]-a[0]);const s=t*t*(3-2*t);\n      return{deep:mix(a[1],b[1],s),sky:mix(a[2],b[2],s),caus:mix(a[3],b[3],s),amb:mix(a[4],b[4],s)}}\n  }\n  const a=SKY[0];return{deep:a[1],sky:a[2],caus:a[3],amb:a[4]};\n}\nfunction daylight(h){h=((h%24)+24)%24;if(h<5||h>=19.2)return 0;if(h<7)return (h-5)/2;if(h>17.8)return Math.max(0,(19.2-h)/1.4);return 1}\nfunction nightness(h){return 1-daylight(h)}\nfunction sunsetGlow(h){return Math.max(0,1-Math.abs(h-17.9)/1.0)}\nfunction periodOf(h){\n  h=((h%24)+24)%24;const p=h<5?'Late night':h<7?'Dawn':h<11?'Morning':h<13?'Noon':h<16.5?'Afternoon':h<18.6?'Sunset':h<21?'Evening':'Night';\n  return[p,p];\n}\n\n/* ---------- pre-painted layers (bake once, blit every frame) ---------- */\n// sand bed with ripples and a few shells\nconst sandL = off();\n(()=>{const g=sandL.getContext('2d');\n  const gr=g.createRadialGradient(C,C,20,C,C,R);gr.addColorStop(0,'#f1e7cf');gr.addColorStop(1,'#d9caa6');g.fillStyle=gr;g.fillRect(0,0,S,S);\n  for(let i=0;i<5200;i++){const v=rnd();g.fillStyle=v<.5?'rgba(255,255,255,.5)':v<.85?'rgba(160,135,90,.35)':'rgba(90,80,70,.35)';g.fillRect(rnd()*S,rnd()*S,1.2,1.2)}\n  g.save();g.translate(C,C);g.rotate(-.5);g.lineCap='round';\n  for(let y=-S;y<S;y+=11){g.beginPath();for(let x=-S;x<=S;x+=8){const yy=y+Math.sin(x*.035+y*.2)*3.5;x===-S?g.moveTo(x,yy):g.lineTo(x,yy)}\n    g.strokeStyle='rgba(150,125,80,.18)';g.lineWidth=2.2;g.stroke();g.translate(0,-1.4);g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1.2;g.stroke();g.translate(0,1.4)}\n  g.restore();\n  for(let i=0;i<7;i++){const a=rnd()*6.283,d=40+rnd()*170,x=C+Math.cos(a)*d,y=C+Math.sin(a)*d,r=4+rnd()*4,rot=rnd()*6.283;\n    g.save();g.translate(x,y);g.rotate(rot);\n    if(i%2){for(let k=0;k<7;k++){const t=-.9+k*.3;g.beginPath();g.moveTo(0,r*.6);g.lineTo(Math.sin(t)*r*1.4,-Math.cos(t)*r*1.2);g.strokeStyle='rgba(200,150,140,.7)';g.lineWidth=2.2;g.stroke()}}\n    else{g.beginPath();for(let k=0;k<40;k++){const t=k/40*12.5,rr2=t/12.5*r;g.lineTo(Math.cos(t)*rr2,Math.sin(t)*rr2*.8)}g.strokeStyle='rgba(235,225,210,.9)';g.lineWidth=1.8;g.stroke()}\n    g.restore()}\n})();\n// soft pools of colour in the water\nconst washL = off(S+40,S+40);\n(()=>{const g=washL.getContext('2d');\n  for(let i=0;i<20;i++){const x=rnd()*(S+40),y=rnd()*(S+40),r=40+rnd()*90;softBlob(g,x,y,r,r*(.6+rnd()*.4),rnd()*3,`rgba(0,40,70,${.04+rnd()*.06})`,30)}\n})();\n// anemones (drawn live) and the reef around them\nconst ANEM=[];   // no anemones in the tide pool\nconst reefL = off();\n(()=>{const g=reefL.getContext('2d');\n  const near=(x,y,pad)=>ANEM.some(a=>Math.hypot(a.x-x,a.y-y)<a.r+pad);\n  const shadowed=fn=>{g.save();g.shadowColor='rgba(20,30,40,.35)';g.shadowBlur=10;g.shadowOffsetX=5;g.shadowOffsetY=7;fn();g.restore();fn()};\n  // live rock\n  for(const [x,y,r] of [[82,250,46],[118,346,40],[300,96,40],[396,232,40],[262,398,34],[170,108,26]]){\n    const pts=[...Array(12)].map((_,i)=>[i/12*6.283,.8+rnd()*.3]);\n    const path=()=>{g.beginPath();pts.forEach(([a,k],i)=>{const px=x+Math.cos(a)*r*k,py=y+Math.sin(a)*r*k*.85;i?g.lineTo(px,py):g.moveTo(px,py)});g.closePath()};\n    shadowed(()=>{path();const gr=g.createRadialGradient(x-r*.35,y-r*.4,2,x,y,r*1.1);gr.addColorStop(0,'#c9beb2');gr.addColorStop(1,'#8b7f75');g.fillStyle=gr;g.fill()});\n    g.save();path();g.clip();\n    for(let k=0;k<5;k++){g.beginPath();g.arc(x+(rnd()-.5)*r*1.4,y+(rnd()-.5)*r,r*(.18+rnd()*.25),0,6.283);g.fillStyle=['#d77aa0','#b65a8a','#e893b5'][k%3];g.globalAlpha=.75;g.fill()}\n    g.globalAlpha=1;for(let k=0;k<26;k++){g.beginPath();g.arc(x+(rnd()-.5)*r*1.5,y+(rnd()-.5)*r*1.3,1+rnd()*1.8,0,6.283);g.fillStyle='rgba(60,50,45,.45)';g.fill()}\n    g.restore();\n  }\n  // brain coral\n  for(const [x,y,r] of [[96,252,24],[402,236,20]]){\n    shadowed(()=>{g.beginPath();g.arc(x,y,r,0,6.283);g.fillStyle='#d7c45a';g.fill()});\n    g.save();g.beginPath();g.arc(x,y,r,0,6.283);g.clip();g.strokeStyle='#9c8a2a';g.lineWidth=1.6;g.lineCap='round';\n    for(let k=0;k<14;k++){let px=x+(rnd()-.5)*r*2,py=y+(rnd()-.5)*r*2,a=rnd()*6.283;g.beginPath();g.moveTo(px,py);for(let j=0;j<10;j++){a+=(rnd()-.5)*1.4;px+=Math.cos(a)*4;py+=Math.sin(a)*4;g.lineTo(px,py)}g.stroke()}\n    g.restore()}\n  // branching coral\n  const branch=(x,y,a,len,w,depth,col,tip)=>{const x2=x+Math.cos(a)*len,y2=y+Math.sin(a)*len;g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke();\n    if(depth<=0){g.beginPath();g.arc(x2,y2,w*.6,0,6.283);g.fillStyle=tip;g.fill();return}\n    branch(x2,y2,a+(rnd()-.5)*1.1-.35,len*.78,w*.78,depth-1,col,tip);branch(x2,y2,a+(rnd()-.5)*1.1+.35,len*.78,w*.78,depth-1,col,tip)};\n  for(const [x,y,col,tip] of [[300,100,'#8a5ad8','#d6b8ff'],[262,400,'#3a8fe0','#b4e2ff'],[176,106,'#ff7a5a','#ffd0c0']]){\n    g.save();g.shadowColor='rgba(20,30,40,.3)';g.shadowBlur=6;g.shadowOffsetX=4;g.shadowOffsetY=6;\n    for(let k=0;k<5;k++)branch(x,y,k/5*6.283+rnd()*.5,13+rnd()*6,5,3,col,tip);g.restore()}\n  // sea plants in a ring by the glass: seagrass, feather algae and red macroalgae\n  const ring=(a,r0,r1)=>{const d=r0+rnd()*(r1-r0);return[C+Math.cos(a)*d,C+Math.sin(a)*d]};\n  for(let i=0;i<34;i++){\n    const a=i/34*6.283+rnd()*.15,[x,y]=ring(a,190,228),type=i%3;\n    if(near(x,y,14))continue;\n    g.save();g.lineCap='round';g.lineJoin='round';g.shadowColor='rgba(10,40,40,.3)';g.shadowBlur=5;g.shadowOffsetX=3;g.shadowOffsetY=4;\n    if(type===0){ // seagrass blades sweeping along the wall\n      for(let k=0;k<6;k++){let ang=a+Math.PI/2*(rnd()<.5?1:-1)+(rnd()-.5)*1.4,px=x,py=y;const len=30+rnd()*40;g.beginPath();g.moveTo(px,py);\n        for(let j=0;j<len/4;j++){ang+=(rnd()-.5)*.15;px+=Math.cos(ang)*4;py+=Math.sin(ang)*4;if(Math.hypot(px-C,py-C)<165){const o=Math.atan2(py-C,px-C);ang+=Math.atan2(Math.sin(o-ang),Math.cos(o-ang))*.4}g.lineTo(px,py)}\n        g.strokeStyle=['#3fa860','#56c070','#2f8f55'][k%3];g.lineWidth=3;g.stroke()}\n    }else if(type===1){ // feather caulerpa\n      for(let k=0;k<4;k++){let ang=a+Math.PI+(rnd()-.5)*2.4;if(Math.cos(ang-a)<-.3)ang=a+Math.PI/2*(rnd()<.5?1:-1);let px=x,py=y;const len=22+rnd()*26;\n        g.strokeStyle='#4cc46a';g.lineWidth=1.6;g.beginPath();\n        for(let j=0;j<len/3;j++){px+=Math.cos(ang)*3;py+=Math.sin(ang)*3;g.moveTo(px,py);g.lineTo(px+Math.cos(ang+1.2)*5,py+Math.sin(ang+1.2)*5);g.moveTo(px,py);g.lineTo(px+Math.cos(ang-1.2)*5,py+Math.sin(ang-1.2)*5)}\n        g.stroke()}\n    }else{ // red gracilaria tufts\n      const col=['#d8456a','#e8607a','#c23a5a'][i%3];\n      for(let k=0;k<12;k++){const ang=rnd()*6.283,len=6+rnd()*13;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(ang+.4)*len*.6,y+Math.sin(ang+.4)*len*.6,x+Math.cos(ang)*len,y+Math.sin(ang)*len);g.strokeStyle=col;g.lineWidth=2;g.stroke()}\n    }\n    g.restore();\n  }\n  // mushroom corals and zoanthids\n  for(let i=0;i<9;i++){let x,y,ok=false;for(let t=0;t<40&&!ok;t++){const a=rnd()*6.283,d=168+rnd()*50;x=C+Math.cos(a)*d;y=C+Math.sin(a)*d;ok=!near(x,y,18)}\n    if(!ok)continue;\n    if(i%2){const r=7+rnd()*5;shadowed(()=>{g.beginPath();g.arc(x,y,r,0,6.283);g.fillStyle='#2fb
