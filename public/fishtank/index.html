}\n/* Full screen tank */\n.stage{display:grid;justify-items:center;gap:14px;min-width:0;max-width:100%}\n.fs-exit{display:none}\nbody.full{overflow:hidden}\nbody.full .stage{\n  position:fixed;inset:0;z-index:50;place-content:center;justify-content:center;gap:0;overflow:hidden;\n  background:#55673a;\n  --scr:min(70vw, 76vh);\n}\n@supports (height:1dvh){body.full .stage{--scr:min(70vw, 76dvh)}}\n/* tall screens (phones): the bowl spills past the sides so the water is as big as it can be */\n@media (max-aspect-ratio:1/1){\n  body.full .stage{--scr:min(112vw, 78vh)}\n  @supports (height:1dvh){body.full .stage{--scr:min(112vw, 78dvh)}}\n}\n.garden,.garden-light{display:none}\nbody.full .garden{display:block;position:absolute;inset:0;width:100%;height:100%}\nbody.full .garden-light{display:block;position:absolute;inset:0;mix-blend-mode:multiply;pointer-events:none;transition:background-color 1s}\nbody.full .bowl{z-index:1;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:none;box-shadow:0 30px 50px -20px rgba(20,25,10,.65), 0 6px 14px rgba(20,25,10,.35)}\nbody.full .fs-open{display:none}\nbody.full .fs-exit{\n  display:grid;place-items:center;position:fixed;z-index:51;\n  top:calc(12px + env(safe-area-inset-top, 0px));right:calc(12px + env(safe-area-inset-right, 0px));\n  width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);\n  background:rgba(35,32,26,.72);color:#f2ead9;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:26px;line-height:1;cursor:pointer;\n}\nbody.full .fs-exit:hover{background:rgba(35,32,26,.9)}\n\n/* qinghua rim: painted on a canvas that sits in the bowl's rim */\n.bowl::before{display:none}\n.bowl .rim{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;pointer-events:none}\n.bowl .screen{position:relative;z-index:1}\nbody.full .stage{background:#2c3520!important}\n/* the rim takes the light of the hour, like the water does */\n.bowl .rim-light{position:absolute;inset:-2px;border-radius <button class=\"btn fs-open\" id=\"btn-full\" aria-pressed=\"false\">\u26f6 Full screen<\/button>\n      <button class=\"fs-exit\" id=\"btn-exit\" aria-label=\"Exit full screen\">\u00d7<\/button>\n    <\/div>\n\n    <div class=\"sheet\">\n      <section>\n        <h2>\u6c34\u8272 <small>Tank light<\/small><\/h2>\n        <div class=\"timebig\">\n          <span class=\"clock\" id=\"clock\">--:--<\/span>\n          <span class=\"period\" id=\"period\"><\/span>\n          <span class=\"tag\" id=\"livetag\">Live clock<\/span>\n        <\/div>\n        <div class=\"skybar\" id=\"skybar\" aria-hidden=\"true\"><\/div>\n        <label for=\"time-slider\" class=\"note\" style=\"display:block;margin-bottom:2px\">Drag to preview any hour<\/label>\n        <input type=\"range\" id=\"time-slider\" min=\"0\" max=\"24\" step=\"0.05\" value=\"12\">\n        <div class=\"ticks\"><span>0<\/span><span>3<\/span><span>6<\/span><span>9<\/span><span>12<\/span><span>15<\/span><span>18<\/span><span>21<\/span><span>24<\/span><\/div>\n        <div class=\"row\">\n          <button class=\"btn\" id=\"btn-live\" aria-pressed=\"true\">Follow my clock<\/button>\n          <button class=\"btn\" id=\"btn-play\" aria-pressed=\"false\">Play a whole day<\/button>\n        <\/div>\n        <div class=\"row\" id=\"jumps\">\n          <button class=\"btn\" data-h=\"6\">6:00 dawn<\/button>\n          <button class=\"btn\" data-h=\"12\">12:00 day<\/button>\n          <button class=\"btn\" data-h=\"17\">17:00 peach<\/button>\n          <button class=\"btn\" data-h=\"18\">18:00 sunset<\/button>\n          <button class=\"btn\" data-h=\"22\">22:00 night<\/button>\n        <\/div>\n      <\/section>\n\n      <section class=\"block\">\n        <h2>\u9c7c\u513f <small>The fish<\/small><\/h2>\n        <ul class=\"roster\" id=\"roster\">\n          <li class=\"hdr\"><span><\/span><span>Name<\/span><span>Mood<\/span><span>Hunger<\/span><\/li>\n        <\/ul>\n        <div class=\"row\">\n          <button class=\"btn\" id=\"btn-speed\" aria-pressed=\"false\">Fast hunger (60\u00d7)<\/button>\n          <button class=\"btn\" id=\"btn-reset\">Reset the fish<\/button>\n        <\/div>\n        <p class=\"note\" id=\"reset-msg\" hidden>Fish reset to their starting stats.<\/p>\n      <\/section>\n\n      <section class=\"block\">\n        <h2>\u73a9\u6cd5 <small>How to play<\/small><\/h2>\n        <ul class=\"howto\">\n          <li><b>Double-tap<\/b><span>Drop a pinch of food. Hungry koi race to it; full ones ignore it.<\/span><\/li>\n          <li><b>Tap a fish<\/b><span>Opens its card with name, colour, age, mood and hunger. A tap is also a little pat, which cheers it up.<\/span><\/li>\n          <li><b>Scroll on tank<\/b><span>Stands in for turning the knob: moves the hour to preview the light.<\/span><\/li>\n        <\/ul>\n        <p class=\"note\">Fish get hungrier over about 8 hours, and stats are kept in this browser. Mood drifts toward a level set by hunger, rises with food and pats, and fish get sleepy after dark.<\/p>\n      <\/section>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n(() => {\n'use strict';\nconst S = 480, C = S / 2, R = 238;\nconst cv = document.getElementById('tank');\nlet ctx = cv.getContext('2d');   // swapped briefly when a fish is drawn into its depth buffer\nlet K = 1;   // drawing scale: the tank is laid out in 480 units and drawn sharper on bigger screens\n\n/* ---------- helpers ---------- */\nfunction mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\nconst rnd = mulberry(20261115);\nconst rr = (a,b)=>a+(b-a)*Math.random();\nconst clamp=(v,a,b)=>v<a?a:v>b?b:v;\nfunction off(w=S,h=S){const c=document.createElement('canvas');c.width=w;c.height=h;return c}\nfunction hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}\nfunction mix(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}\nconst css=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;\n// soft blur that works in every browser: draw far off-canvas and let the shadow land in place\nfunction softBlob(g,x,y,rx,ry,rot,color,blur){g.save();g.shadowColor=color;g.shadowBlur=blur;g.shadowOffsetX=10000;g.beginPath();g.ellipse(x-10000,y,rx,ry,rot,0,6.283);g.fillStyle='#000';g.fill();g.restore()}\n\n/* ---------- time of day palette, read from the sky reference ---------- */\n// [hour, deep water, sky reflection, cloud tint, ambient light]\nconst SKY = [\n  [0,   '#0c1730','#1c2a5a','#56669a','#7c86b4'],\n  [4.5, '#0d1832','#1f2e5e','#5a6a9c','#7e88b6'],\n  [5.5, '#16304a','#3d6a80','#8aa6b8','#a6b6c4'],\n  [6,   '#155048','#5fbfa4','#c4ecd6','#dcefe6'],\n  [7,   '#1a4f5a','#a6c6d8','#fbe2c6','#f8efe0'],\n  [8,   '#164f62','#8cb8ee','#ffffff','#ffffff'],\n  [12,  '#11506a','#68a2f2','#ffffff','#ffffff'],\n  [15,  '#145268','#7eaef0','#ffffff','#fffdf8'],\n  [16,  '#1d4f63','#a2bce8','#fff4ec','#fdf5ee'],\n  [17,  '#3a4d63','#efbdb1','#ffd0c2','#fde6d8'],\n  [18,  '#4a3045','#ea7048','#ff9e78','#f6c0a4'],\n  [18.6,'#2a2440','#7f5878','#b88aa8','#b8a0b8'],\n  [19,  '#121c40','#2d3b78','#6a74a8','#8088b8'],\n  [21,  '#0d1834','#232f66','#5a6a9c','#7c86b4'],\n  [24,  '#0c1730','#1c2a5a','#56669a','#7c86b4'],\n].map(k=>[k[0],hex(k[1]),hex(k[2]),hex(k[3]),hex(k[4])]);\nfunction skyAt(h){\n  h=((h%24)+24)%24;\n  for(let i=0;i<SKY.length-1;i++){\n    const a=SKY[i],b=SKY[i+1];\n    if(h>=a[0]&&h<=b[0]){const t=(h-a[0])/(b[0]-a[0]);const s=t*t*(3-2*t);\n      return{deep:mix(a[1],b[1],s),sky:mix(a[2],b[2],s),cloud:mix(a[3],b[3],s),amb:mix(a[4],b[4],s)}}\n  }\n  const a=SKY[0];return{deep:a[1],sky:a[2],cloud:a[3],amb:a[4]};\n}\nfunction daylight(h){h=((h%24)+24)%24;if(h<5||h>=19.2)return 0;if(h<7)return (h-5)/2;if(h>17.8)return Math.max(0,(19.2-h)/1.4);return 1}\nfunction nightness(h){return 1-daylight(h)}\nfunction sunsetGlow(h){return Math.max(0,1-Math.abs(h-17.9)/1.0)}\nfunction periodOf(h){\n  h=((h%24)+24)%24;\n  if(h<5)return['\u6df1\u591c','Late night'];if(h<7)return['\u9ece\u660e','Dawn'];if(h<11)return['\u4e0a\u5348','Morning'];\n  if(h<13)return['\u6b63\u5348','Noon'];if(h<16.5)return['\u4e0b\u5348','Afternoon'];if(h<18.6)return['\u9ec4\u660f','Sunset'];\n  if(h<21)return['\u508d\u665a','Evening'];return['\u591c','Night'];\n}\n\n/* ---------- pre-painted layers (the ESP32 plan too: bake once, blit every frame) ---------- */\n// rice paper grain\nconst paperL = off();\n(()=>{const g=paperL.getContext('2d');const im=g.createImageData(S,S);\n  for(let i=0;i<im.data.length;i+=4){const v=232+rnd()*23;im.data[i]=v;im.data[i+1]=v-2;im.data[i+2]=v-6;im.data[i+3]=255}\n  g.putImageData(im,0,0);\n  g.globalAlpha=.07;g.strokeStyle='#8a7a60';g.lineWidth=.6;\n  for(let i=0;i<260;i++){const x=rnd()*S,y=rnd()*S,a=rnd()*6.28,l=6+rnd()*22;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a+.6)*l*.5,y+Math.sin(a+.6)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}\n})();\n// pigment pools: soft blooms with a faint dried edge\nconst washL = off(S+40,S+40);\n(()=>{const g=washL.getContext('2d');\n  for(let i=0;i<34;i++){\n    const x=rnd()*(S+40),y=rnd()*(S+40),r=26+rnd()*80,a=.07+rnd()*.1,rot=rnd()*3;\n    softBlob(g,x,y,r,r*(.6+rnd()*.4),rot,`rgba(10,30,45,${a})`,24);\n    g.save();g.strokeStyle=`rgba(10,30,45,${a*.6})`;g.lineWidth=2;g.shadowColor=`rgba(10,30,45,${a})`;g.shadowBlur=5;\n    g.beginPath();g.ellipse(x,y,r*.9,r*.9*(.6+rnd()*.4),rot,rnd()*3,rnd()*3+3.5);g.stroke();g.restore();\n  }\n})();\n// pebble bed on the bottom of the bowl\nconst pebbleL = off();\n(()=>{const g=pebbleL.getContext('2d');\n  const tones=[[148,140,128],[118,114,108],[176,158,134],[92,98,104],[156,120,96],[200,190,170],[128,136,128]];\n  const placed=[];\n  for(let tries=0;tries<6000&&placed.length<520;tries++){\n    const a=rnd()*6.283,d=Math.sqrt(rnd())*(R-6),x=C+Math.cos(a)*d,y=C+Math.sin(a)*d;\n    const r=(d>R-60?6:4.5)+rnd()*(d>R-60?9:7);\n    if(placed.some(p=>Math.hypot(p[0]-x,p[1]-y)<(p[2]+r)*.72))continue;\n    placed.push([x,y,r]);\n  }\n  placed.sort((p,q)=>p[2]-q[2]);\n  for(const [x,y,r] of placed){\n    const t=tones[(rnd()*tones.length)|0].map(v=>v+(rnd()-.5)*20),rot=rnd()*3.14,ry=r*(.62+rnd()*.3);\n    g.save();g.translate(x,y);g.rotate(rot);\n    g.beginPath();g.ellipse(1.5,2.2,r,ry,0,0,6.283);g.fillStyle='rgba(20,18,14,.35)';g.shadowColor='rgba(20,18,14,.4)';g.shadowBlur=3;g.fill();g.shadowBlur=0;\n    g.beginPath();g.ellipse(0,0,r,ry,0,0,6.283);\n    const gr=g.createRadialGradient(-r*.35,-ry*.4,1,0,0,r*1.05);\n    gr.addColorStop(0,css(t.map(v=>Math.min(255,v+22))));gr.addColorStop(.6,css(t));gr.addColorStop(1,css(t.map(v=>v*.7)));\n    g.fillStyle=gr;g.fill();\n    g.strokeStyle=css(t.map(v=>v*.55),.5);g.lineWidth=.8;g.stroke();\n    if(rnd()<.3){g.beginPath();g.ellipse(-r*.2,ry*.1,r*.5,ry*.15,.3,0,6.283);g.fillStyle=css(t.map(v=>v*.85),.5);g.fill()}\n    g.restore();\n  }\n  for(let i=0;i<700;i++){const a=rnd()*6.283,d=Math.sqrt(rnd())*R;g.fillStyle=`rgba(${150+rnd()*60|0},${135+rnd()*50|0},110,${.25+rnd()*.3})`;g.fillRect(C+Math.cos(a)*d,C+Math.sin(a)*d,1.3,1.3)}\n})();\n// water weeds deep below: feathery hornwort and ribbon eelgrass, leaning every which way\nconst deepL = off();\n(()=>{const g=deepL.getContext('2d');\n  const cols=['#0b2628','#0f302f','#123a36','#163f37'];\n  const clumps=[];\n  for(let i=0;i<17;i++){const a=i/17*6.283+rnd()*.3,rad=185+rnd()*40;clumps.push([C+Math.cos(a)*rad,C+Math.sin(a)*rad,rad,i%3===1?'grass':'wort',a])}   // a ring of plants by the wall\n  for(const [cx,cy,rad,type,pos] of clumps){\n    const lean=pos+Math.PI/2*(rnd()<.5?1:-1)+(rnd()-.5)*1.2;   // each clump leans its own way along the wall\n    const n=type==='grass'?7+(rnd()*5|0):5+(rnd()*5|0);\n    for(let s=0;s<n;s++){\n      const col=cols[(rnd()*cols.length)|0];\n      let ang=lean+(rnd()-.5)*2.2, x=cx+(rnd()-.5)*20, y=cy+(rnd()-.5)*20;\n      const curl=(rnd()-.5)*.09, len=40+rnd()*(type==='grass'?100:80), steps=Math.max(6,len/5|0);\n      g.save();g.strokeStyle=col;g.fillStyle=col;g.lineCap='round';g.shadowColor=col;g.shadowBlur=5;g.globalAlpha=.8;\n      if(type==='grass'){\n        const L=[],R2=[];\n        for(let k=0;k<=steps;k++){const w=2.6*(1-k/steps)+.4;const nx=-Math.sin(ang),ny=Math.cos(ang);L.push([x+nx*w,y+ny*w]);R2.push([x-nx*w,y-ny*w]);\n          ang+=curl+(rnd()-.5)*.05;x+=Math.cos(ang)*5;y+=Math.sin(ang)*5;\n          if(Math.hypot(x-C,y-C)>R-8)ang+=.25;if(Math.hypot(x-C,y-C)<150){const o=Math.atan2(y-C,x-C);ang+=Math.atan2(Math.sin(o-ang),Math.cos(o-ang))*.35}}\n        g.beginPath();L.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));R2.reverse().forEach(p=>g.lineTo(p[0],p[1]));g.closePath();g.fill();\n      }else{\n        g.lineWidth=1.6;g.beginPath();\n        for(let k=0;k<steps;k++){ang+=curl+(rnd()-.5)*.2;x+=Math.cos(ang)*5;y+=Math.sin(ang)*5;\n          if(Math.hypot(x-C,y-C)>R-10)ang+=.3;\n          if(Math.hypot(x-C,y-C)<150){const o=Math.atan2(y-C,x-C);ang+=Math.atan2(Math.sin(o-ang),Math.cos(o-ang))*.35}\n          const nl=(11-k/steps*5)*(.8+rnd()*.4);\n          for(let j=0;j<6;j++){const na=ang+j/6*6.283+rnd()*.4;g.moveTo(x,y);g.lineTo(x+Math.cos(na)*nl,y+Math.sin(na)*nl)}}\n        g.stroke();\n      }\n      g.restore();\n    }\n  }\n})();\n// cloud reflections: a white mask that tiles horizontally, tinted by the hour each frame\nconst CW=720;\nconst cloudMask=off(CW,CW), cloudTint=off(CW,CW);\n(()=>{const g=cloudMask.getContext('2d');\n  for(let b=0;b<6;b++){\n    const bx=rnd()*CW,by=rnd()*CW,bw=110+rnd()*120,bh=50+rnd()*60,rot=-.4+rnd()*.3;\n    for(let k=0;k<16;k++){\n      const x=bx+(rnd()-.5)*bw*1.6,y=by+(rnd()-.5)*bh,rx=30+rnd()*60,ry=16+rnd()*30,a=.10+rnd()*.16;\n      for(const ox of [-CW,0,CW])for(const oy of [-CW,0,CW])softBlob(g,x+ox,y+oy,rx,ry,rot,`rgba(255,255,255,${a})`,26+rnd()*20);\n    }\n  }\n})();\n// lily pads and a lotus, with their shadows on the water\nconst padL = off();\nconst PADS=[[118,150,30,.3],[78,196,24,2.1],[150,206,27,4.2],[96,248,21,1.2],[58,148,18,5.4],[176,132,17,3.3],   // the big clump, top left\n            [372,350,22,3.9],[404,312,16,5.6],[340,392,15,1.4]];   // a small clump, bottom right\nconst LOTUS=[150,170];\n(()=>{const g=padL.getContext('2d');\n  const shadowed=(fn)=>{g.save();g.shadowColor='rgba(0,18,28,.45)';g.shadowBlur=8;g.shadowOffsetX=5;g.shadowOffsetY=7;fn();g.restore();fn()};\n  for(const [x,y,r,notch] of PADS){\n    const path=()=>{g.beginPath();g.moveTo(x,y);g.arc(x,y,r,notch+.22,notch-.22+6.283);g.closePath()};\n    shadowed(()=>{path();const gr=g.createRadialGradient(x-r*.3,y-r*.3,2,x,y,r);gr.addColorStop(0,'#a3c4b4');gr.addColorStop(.7,'#7ea596');gr.addColorStop(1,'#5d8778');g.fillStyle=gr;g.fill()});\n    g.save();path();g.clip();\n    g.strokeStyle='rgba(60,95,85,.28)';g.lineWidth=.8;\n    for(let k=0;k<11;k++){const a=notch+.4+k/11*5.5;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);g.stroke()}\n    for(let k=0;k<5;k++){g.beginPath();g.arc(x+(rnd()-.5)*r,y+(rnd()-.5)*r,1+rnd()*1.5,0,6.283);g.fillStyle='rgba(235,240,225,.35)';g.fill()}\n    g.restore();\n    path();g.strokeStyle='rgba(40,70,62,.55)';g.lineWidth=1.3;g.stroke();\n  }\n  const [lx,ly]=LOTUS;\n  shadowed(()=>{g.beginPath();g.arc(lx,ly,15,0,6.283);g.fillStyle='rgba(250,246,238,.01)';g.fill()});\n  const petalRing=(n,len,wid,rot,c1,c2)=>{for(let k=0;k<n;k++){const a=rot+k/n*6.283;g.save();g.translate(lx,ly);g.rotate(a);\n    g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(wid,len*.45,0,len);g.quadraticCurveTo(-wid,len*.45,0,0);\n    const gr=g.createLinearGradient(0,0,0,len);gr.addColorStop(0,c2);gr.addColorStop(1,c1);g.fillStyle=gr;\n    g.shadowColor='rgba(0,18,28,.35)';g.shadowBlur=4;g.fill();g.strokeStyle='rgba(190,160,140,.5)';g.lineWidth=.6;g.stroke();g.restore()}};\n  petalRing(9,19,7.5,0,'#f3d9c4','#fffaf2');\n  petalRing(8,14,6,.35,'#fdf3ea','#ffffff');\n  petalRing(6,9,4.5,.1,'#fff8f0','#ffffff');\n  g.beginPath();g.arc(lx,ly,4.5,0,6.283);g.fillStyle='#f0a23a';g.fill();\n  for(let k=0;k<14;k++){const a=k/14*6.283;g.beginPath();g.arc(lx+Math.cos(a)*5.5,ly+Math.sin(a)*5.5,1,0,6.283);g.fillStyle='#e8762a';g.fill()}\n})();\n\n/* ---------- fish ---------- */\nconst DAY = 86400000;\nconst ROSTER = [\n  {id:'jin', cn:'\u5c0f\u91d1', py:'Xi\u01ceo J\u012bn', kind:'koi', breed:'Orange ogon koi', colorName:'\u6a59 orange', L:62, W:.15, born:410, seal:'\u91d1',\n   pal:{body:'#e4582a',light:'#f6a062',edge:'#a8341c',fin:'#f08c55'}, spots:[]},\n  {id:'tuan', cn:'\u56e2\u56e2', py:'Tu\u00e1ntuan', kind:'koi', breed:'Kohaku koi', colorName:'\u7ea2\u767d red & white', L:58, W:.15, born:190, seal:'\u56e2',\n   pal:{body:'#f5f2ec',light:'#ffffff',edge:'#9d9488',fin:'#f7f4ef'},\n   spots:[{s:.14,l:.1,r:.08,c:'#e5532a'},{s:.38,l:-.35,r:.09,c:'#e5532a'},{s:.42,l:.45,r:.06,c:'#e5532a'},{s:.66,l:.05,r:.07,c:'#ef6a35'}]},\n  {id:'tao', cn:'\u6843\u6843', py:'T\u00e1otao', kind:'koi', breed:'Tancho koi', colorName:'\u4e39\u9876 red crown', L:54, W:.145, born:95, seal:'\u6843',\n   pal:{body:'#f6f3ee',light:'#ffffff',edge:'#9d9488',fin:'#f8f6f2'}, spots:[{s:.2,l:0,r:.06,c:'#d8332a'}]},\n  {id:'mo', cn:'\u58a8\u58a8', py:'M\u00f2mo', kind:'koi', breed:'Karasu koi', colorName:'\u58a8\u9ed1 ink black', L:56, W:.155, born:620, seal:'\u58a8',\n   pal:{body:'#2a2826',light:'#5d5650',edge:'#0e0c0b',fin:'#3c3734'}, spots:[]},\n  {id:'xing', cn:'\u661f\u661f', py:'X\u012bngxing', kind:'small', breed:'Medaka ricefish', colorName:'\u6de1\u91d1 pale gold', L:18, born:140, seal:'\u661f'},\n  {id:'dian', cn:'\u70b9\u70b9', py:'Di\u01cendian', kind:'small', breed:'Medaka ricefish', colorName:'\u6de1\u91d1 pale gold', L:17, born:88, seal:'\u70b9'},\n  {id:'dou',  cn:'\u8c46\u8c46', py:'D\u00f2udou',   kind:'small', breed:'Medaka ricefish', colorName:'\u6a58 tangerine', L:16, born:61, seal:'\u8c46', tangerine:1},\n  {id:'mi',   cn:'\u7c73\u7c73', py:'M\u01d0mi',     kind:'small', breed:'Medaka ricefish', colorName:'\u6de1\u91d1 pale gol =N;i++){const d=f.L*(.5-i/N*.82);f.chain.push({x:f.x+Math.cos(f.ang)*d,y:f.y+Math.sin(f.ang)*d})}});\nfunction followChain(f){\n  const c=f.chain,seg=f.L*.82/N,stiff=f.kind==='small'?.25:.1;\n  c[0].x=f.x+Math.cos(f.ang)*f.L*.5;c[0].y=f.y+Math.sin(f.ang)*f.L*.5;\n  let px=-Math.cos(f.ang),py=-Math.sin(f.ang);          // direction pointing backward\n  for(let i=1;i<=N;i++){\n    const st=i/N,stf=stiff+(1-stiff)*.85*Math.pow(1-st,2);   // the front of the body is stiff, the tail is free\n    let dx=c[i].x-c[i-1].x,dy=c[i].y-c[i-1].y,l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;\n    dx=dx*(1-stf)+px*stf;dy=dy*(1-stf)+py*stf;l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;\n    // limit how sharply any one joint can fold\n    const cross=px*dy-py*dx,dot=px*dx+py*dy,maxA=.04+.38*Math.pow(st,1.6);\n    if(Math.atan2(cross,dot)>maxA||Math.atan2(cross,dot)<-maxA){const a=Math.atan2(py,px)+Math.sign(cross)*maxA;dx=Math.cos(a);dy=Math.sin(a)}\n    c[i].x=c[i-1].x+dx*seg;c[i].y=c[i-1].y+dy*seg;px=dx;py=dy;\n  }\n}\nload();\n\nfunction ageText(f){\n  const d=Math.floor((Date.now()-f.bornAt)/DAY);\n  if(d<31)return d+(d===1?' day':' days');\n  const y=Math.floor(d/365),m=Math.floor((d%365)/30.4);\n  if(y)return y+(y>1?' yrs':' yr')+(m?' '+m+' mo':'');\n  return m+' mo '+Math.floor(d-m*30.4)+' d';\n}\nfunction moodOf(f){\n  if(f.hunger>78)return['\u997f\u574f\u4e86','Starving'];\n  if(f.sleepy)return['\u56f0\u4e86','Sleepy'];\n  if(f.mood>80)return['\u5f00\u5fc3','Joyful'];\n  if(f.mood>62)return['\u6ee1\u8db3','Content'];\n  if(f.mood>42)return['\u5e73\u9759','Calm'];\n  if(f.mood>24)return['\u65e0\u804a','Bored'];\n  return['\u95f7\u95f7','Glum'];\n}\nfunction hungerText(h){return h<15?'Full':h<40?'Peckish':h<70?'Hungry':'Very hungry'}\nfunction hungerColor(h){return h<40?'#4f7f4c':h<70?'#d08a2e':'#b83a2a'}\n\n/* ---------- food, ripples, wakes, hearts, floating leaves ---------- */\nconst taps=[], food=[], ripples=[], pops=[], wakes=[];\nconst floaters=[];\nfor(let i=0;i<14;i+=3){const a=rr(0,6.28),d=rr(40,200);floaters.push({x:C+Math.cos(a)*d,y:C+Math.sin(a)*d,a:rr(0,6.28),va:rr(-.15,.15),vx:rr(-3,3),vy:rr(-3,3),\n  kind:i%3===0?'petal':'leaf',len:i%3===0?rr(4,6):rr(7,12),col:i%3===0?['#ef7a3a','#f29a4a','#e8602e'][i%3===0?(i/3|0)%3:0]:['#8cc06a','#79b05a','#a6cf78','#6a9e4e'][i%4]})}\nfunction dropFood(x,y){\n  const n=5+(Math.random()*3|0);\n  for(let i=0;i<n;i++)food.push({x:x+rr(-14,14),y:y+rr(-14,14),vx:rr(-3,3),vy:rr(-3,3),life:50,ph:rr(0,6)});\n  ripples.push({x,y,t:0});\n}\nfunction pop(x,y){pops.push({x,y,t:0})}\n\n/* ---------- time state ---------- */\nlet live=true, playing=false, hour=nowHour();\nfunction nowHour(){const d=new Date();return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600}\n\n/* ---------- simulation ---------- */\nlet school={x:C,y:C,t:0};\nfunction randomPoint(maxR){const a=Math.random()*6.283,d=Math.sqrt(Math.random())*maxR;return[C+Math.cos(a)*d,C+Math.sin(a)*d]}\n// pick somewhere to swim that's away from the others, using the whole bowl rather than the middle\nfunction openSpot(f,maxR){let best=null,bs=-1;\n  for(let k=0;k<8;k++){const a=Math.random()*6.283,d=(.3+.7*Math.sqrt(Math.random()))*maxR,x=C+Math.cos(a)*d,y=C+Math.sin(a)*d;let m=1e9;\n    for(const o of fish){if(o===f||(o.kind==='small'&&(!f||f.kind==='small')))continue;m=Math.min(m,Math.hypot(o.x-x,o.y-y),Math.hypot(o.tx-x,o.ty-y)*1.2)}\n    if(m>bs){bs=m;best=[x,y]}}\n  return best}\nfunction update(dt,t){\n  const night=nightness(hour);\n  school.t-=dt;if(school.t<=0){[school.x,school.y]=openSpot(null,150);school.t=rr(7,13)}\n  for(const f of fish){\n    const small=f.kind==='small', turtle=f.kind==='turtle';\n    f.hunger=clamp(f.hunger+dt*HUNGER_PER_SEC*lifeSpeed,0,100);\n    const base=78-Math.max(0,f.hunger-25)*.9-night*8;\n    f.mood=clamp(f.mood+(base-f.mood)*dt*.004*lifeSpeed,0,100);\n    f.sleepy = night>.7 && f.hunger<80;   // only a starving fish stays up\n\n    let chasing=null;\n    if(f.hunger>12&&food.length){\n      let best=1e9;for(const p of food){const d=(p.x-f.x)**2+(p.y-f.y)**2;if(d<best){best=d;chasing=p}}\n    }\n    let maxSpeed;\n    if(chasing){f.tx=chasing.x;f.ty=chasing.y;maxSpeed=(turtle?20:small?44:36)*(.8+f.hunger/200)}\n    else{\n      f.retarget-=dt;\n      const near=Math.hypot(f.tx-f.x,f.ty-f.y)<14;\n      if(small){if(f.retarget<=0||near){f.tx=school.x+rr(-30,30);f.ty=school.y+rr(-30,30);f.retarget=rr(1.6,3.2)}}\n      else if(f.retarget<=0||near){[f.tx,f.ty]=openSpot(f,165);f.retarget=rr(6,13)}\n      maxSpeed=f.sleepy?0:(turtle?7:small?20:13)*(f.hunger>78?.7:1);\n      if(turtle){f.restT=(f.restT||0)-dt;if(f.restT<-rr(6,14))f.restT=rr(4,10);if(f.restT>0)maxSpeed=0}   // turtles stop for a sit on the pebbles\n    }\n    maxSpeed*=f.spd;\n    if(f.scare>0){f.scare-=dt;const a=Math.atan2(f.y-f.scy,f.x-f.scx);let ax=f.x+Math.cos(a)*90-C,ay=f.y+Math.sin(a)*90-C;const ad=Math.hypot(ax,ay);if(ad>150){ax*=150/ad;ay*=150/ad}f.tx=C+ax;f.ty=C+ay;maxSpeed=Math.max(maxSpeed,f.dash*Math.min(1,f.scare+.3));f.sleepy=false;if(f.restT>0)f.restT=0;if(f.retarget!=null)f.retarget=Math.max(f.retarget,.5);if(f.goShell)f.scare=0}\n    let want=Math.atan2(f.ty-f.y,f.tx-f.x);\n    if(!chasing&&!(f.scare>0)){   // personal space: ease away from neighbours instead of piling up (only between big fish and the turtle; small fish may pass over or under)\n      let ax=0,ay=0;for(const o of fish){if(o===f||f.kind==='small'||o.kind==='small')continue;const dx=f.x-o.x,dy=f.y-o.y,d=Math.hypot(dx,dy),rad=(f.L+o.L)*.8+12;\n        if(d>0&&d<rad){const w=(rad-d)/rad;ax+=dx/d*w;ay+=dy/d*w}}\n      if(ax||ay)want=Math.atan2(Math.sin(want)+ay*1.8,Math.cos(want)+ax*1.8);\n    }\n    let diff=want-f.ang;diff=Math.atan2(Math.sin(diff),Math.cos(diff));\n    const resting=f.sleepy&&!chasing;\n    const turn=resting?0:(turtle?(f.speed>2?.8:0):small?2.4:1.5)*(chasing?1.4:1);\n    const dAng=clamp(diff,-turn*dt,turn*dt);\n    f.ang+=dAng;\n    f.bend+=((dt>0&&turn?dAng/dt/turn:0)-f.bend)*Math.min(1,dt*3);   // body curls into turns ;\n  if(glow>0){const g2=ctx.createRadialGradient(S*.05,S*.55,10,S*.05,S*.55,S*.9);g2.addColorStop(0,`rgba(255,140,80,${.32*glow})`);g2.addColorStop(1,'rgba(255,140,80,0)');ctx.fillStyle=g2;ctx.fillRect(0,0,S,S)}\n  // drifting cloud reflections, tinted by the hour\n  const tg=cloudTint.getContext('2d');tg.globalCompositeOperation='source-over';tg.clearRect(0,0,CW,CW);tg.drawImage(cloudMask,0,0);\n  tg.globalCompositeOperation='source-in';tg.fillStyle=css(sky.cloud);tg.fillRect(0,0,CW,CW);\n  const cx=-((t*3.2)%CW), cy=-120+Math.sin(t*.02)*20;\n  ctx.globalAlpha=.55+.35*day;ctx.drawImage(cloudTint,cx,cy);ctx.drawImage(cloudTint,cx+CW,cy);ctx.globalAlpha=1;\n  // dappled light\n  if(day>.2){ctx.globalCompositeOperation='screen';\n    for(let i=0;i<7;i++){const x=C+Math.sin(t*.13+i*1.7)*140,y=C+Math.cos(t*.11+i*2.3)*125,r=34+Math.sin(t*.3+i)*10;\n      const cg=ctx.createRadialGradient(x,y,0,x,y,r);cg.addColorStop(0,`rgba(220,255,240,${.1*day})`);cg.addColorStop(1,'rgba(220,255,240,0)');ctx.fillStyle=cg;ctx.fillRect(x-r,y-r,r*2,r*2)}\n    ctx.globalCompositeOperation='source-over'}\n  // fish shadows\n  for(const f of fish){ctx.save();{const h=.35+.9*(1-(f.depth||0));ctx.translate(f.x+6*h,f.y+9*h)}ctx.rotate(f.ang);ctx.beginPath();ctx.ellipse(-f.L*.05,0,f.L*.4,f.L*f.W*.9,0,0,6.283);ctx.fillStyle=`rgba(0,10,20,${.12+.12*day})`;ctx.shadowColor='rgba(0,10,20,.4)';ctx.shadowBlur=7;ctx.fill();ctx.restore()}\n  if(selected){ctx.save();ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.5;ctx.setLineDash([3,5]);ctx.lineDashOffset=-t*8;ctx.beginPath();ctx.arc(selected.x,selected.y,selected.L*.55+4,0,6.283);ctx.stroke();ctx.restore()}\n  // small fish first, koi over them\n  for(const pass of ['small','turtle','koi'])for(const f of fish){if(f.kind!==pass)continue;drawDeep(f,sky)}\n  // white ripple strokes\n  ctx.lineCap='round';\n  for(const w of wakes){const k=w.t/2.2,a=(1-k)*.55;ctx.strokeStyle=`rgba(255,255,255,${a})`;\n    for(const s of [-1,1]){const r=w.s*(.22+k*.5);ctx.lineWidth=1.6*(1-k)+.4;ctx.beginPath();\n      ctx.arc(w.x,w.y,r,w.a+Math.PI+s*.55-.35,w.a+Math.PI+s*.55+.35);ctx.stroke()}}\n  for(const r of taps)waterRing(r.x,r.y,r.t,2.4,88,4,1);\n  for(const r of ripples)waterRing(r.x,r.y,r.t,1.6,30,2,.6);\n  // food on the surface\n  for(const p of food){const a=Math.min(1,p.life/5),bob=Math.sin(t*2+p.ph)*.4;\n    ctx.beginPath();ctx.arc(p.x,p.y+bob,5,0,6.283);ctx.fillStyle=`rgba(230,170,90,${.2*a})`;ctx.fill();\n    ctx.beginPath();ctx.arc(p.x,p.y+bob,2.6,0,6.283);ctx.fillStyle=`rgba(196,120,52,${.95*a})`;ctx.fill()}\n  // floating leaves and petals, then the lily pads and lotus\n  for(const p of floaters){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);\n    ctx.shadowColor='rgba(0,15,25,.35)';ctx.shadowBlur=3;ctx.shadowOffsetX=2;ctx.shadowOffsetY=3;\n    ctx.beginPath();ctx.moveTo(-p.len,0);ctx.quadraticCurveTo(0,p.len*(p.kind==='leaf'?.36:.6),p.len,0);ctx.quadraticCurveTo(0,-p.len*(p.kind==='leaf'?.36:.6),-p.len,0);\n    ctx.fillStyle=p.col;ctx.globalAlpha=.9;ctx.fill();\n    if(p.kind==='leaf'){ctx.shadowColor='transparent';ctx.strokeStyle='rgba(40,80,30,.35)';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(-p.len*.9,0);ctx.lineTo(p.len*.9,0);ctx.stroke()}\n    ctx.restore()}\n  ctx.save();ctx.translate(LOTUS[0],LOTUS[1]);ctx.rotate(Math.sin(t*.25)*.015);ctx.translate(-LOTUS[0],-LOTUS[1]);ctx.drawImage(padL,0,0);ctx.restore();\n  // light of the hour\n  ctx.globalCompositeOperation='multiply';ctx.fillStyle=css(sky.amb);ctx.fillRect(0,0,S,S);ctx.globalCompositeOperation='source-over';\n  if(night>.05){\n    const nh=((hour-19+24)%24)/10, mx=S*(.78-.5*clamp(nh,0,1)), my=S*(.62-.14*Math.sin(nh*3.14));\n    ctx.globalCompositeOperation='screen';\n    const mg=ctx.createRadialGradient(mx,my,0,mx,my,95);mg.addColorStop(0,`rgba(190,210,255,${.26*night})`);mg.addColorStop(1,'rgba(190,210,255,0)');ctx.fillStyle=mg;ctx.fillRect(0,0,S,S);\n    if(nh<=1){   // moon on rippling water: the disc breaks into wavering slivers, with stray glints trailing off\n      for(let k=-18;k<=18;k++){const y=my+k*3,core=Math.max(0,1-(k/6.5)**2),tail=Math.exp(-Math.abs(k)/7);\n        const w0=13*Math.sqrt(core)+5*tail, n=core>0?2:1;\n        for(let j=0;j<n+1;j++){const ph=t*1.25+k*.83+j*2.1, ph2=t*.7-k*.41+j*1.3;\n          const seg=w0*(.35+.4*Math.abs(Math.sin(ph2*1.7+j)))*(core>0?1:.7), off=(j-n/2)*w0*.7+Math.sin(ph)*(3+11*(1-core))+Math.sin(ph2*2.3)*1.5;\n          const a=(core>0?.38+.32*core:.55*tail)*(.45+.55*Math.abs(Math.sin(ph2+j*.9)))*night;if(a<.03||seg<.8)continue;\n          ctx.fillStyle=`rgba(236,242,255,${a})`;ctx.beginPath();ctx.ellipse(mx+off,y+Math.sin(ph*1.4)*.6,seg,.7+.7*core,Math.sin(ph)*.05,0,6.283);ctx.fill()}}\n    }\n    for(let i=0;i<34;i++){const sx=(i*97.3)%S,sy=(i*61.7+i*i*3.1)%S,tw=.4+.6*Math.abs(Math.sin(t*.8+i));ctx.fillStyle=`rgba(255,255,255,${.6*night*tw})`;ctx.fillRect(sx,sy,1.4,1.4)}\n    ctx.globalCompositeOperation='source-over';\n  }\n  for(const p of pops){const a=1-p.t/1.4;drawHeart(p.x,p.y-p.t*22,1.1+p.t*.3,a)}\n  ctx.font='italic 11px Karla, sans-serif';ctx.fillStyle='rgba(230,235,255,.8)';\n  for(const f of fish){if(f.sleepy&&f.kind!=='small'){const k=((t*.5+f.z)%2)/2;ctx.globalAlpha=Math.sin(k*3.14)*.9;ctx.fillText('z',f.x+8+k*8,f.y-10-k*16);ctx.globalAlpha=1}}\n  // rice paper grain\n  ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.35;ctx.drawImage(paperL,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';\n  // porcelain wall and pooled pigment at the rim\n  const rg=ctx.createRadialGradient(C,C,R*.84,C,C,R);rg.addColorStop(0,'rgba(255,255,255,0)');rg.addColorStop(.85,'rgba(255,255,255,.16)');rg.addColorStop(1,'rgba(255,255,255,.04)');\n  ctx.fillStyle=rg;ctx.fillRect(0,0,S,S);\n  ctx.beginPath();ctx.arc(C,C,R-2,0,6.283);ctx.strokeStyle='rgba(0,10,20,.35)';ctx.lineWidth=3;ctx.shadowColor='rgba(0,10,20,.5)';ctx.shadowBlur=6;ctx.stroke();ctx.shadowBlur=0;\n  // hour label\n  const [cn]=periodOf(hour);\n  ctx.textAlign='center';ctx.fillStyle='rgba(245,242,232,.82)';ctx.font='22px \"Ma Shan Zheng\", KaiTi, serif';ctx.fillText(cn,C,48);\n  ctx.font='600 12px Karla, sans-serif';ctx.fillText(fmt(hour),C,64);ctx.textAlign='start';\n  ctx.restore();\n}\nfunction fmt(h){h=((h%24)+24)%24;const hh=Math.floor(h),mm=Math.floor((h-hh)*60);return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')}\n\n/* ---------- loop ---------- */\nlet last=performance.now(), tAcc=0, uiAcc=0, saveAcc=0;\nconst reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;\nfunction step(dt){\n  tAcc+=dt;\n  if(playing){hour=(hour+dt*.25)%24}else if(live){hour=nowHour()}\n  update(dt,tAcc);\n  uiAcc+=dt;if(uiAcc>.25){uiAcc=0;syncUI()}\n  saveAcc+=dt;if(saveAcc>5){saveAcc=0;save()}\n}\nfunction frame(now){\n  if(now-last<30){requestAnimationFrame(frame);return}   // about 30 fps: calm fish don't need more, and phones stay cool\n  let dt=Math.min(.1,(now-last)/1000);last=now;\n  if(reduced)dt*=.6;\n  step(dt);render(tAcc);\n  requestAnimationFrame(frame);\n}\n\n/* ---------- UI ---------- */\nconst $=id=>document.getElementById(id);\nconst slider=$('time-slider'), card=$('card');\n(()=>{const stops=[];for(let h=0;h<=24;h+=.5){const s=skyAt(h);stops.push(css(s.deep.map((v,i)=>v*.45+s.sky[i]*.55))+' '+(h/24*100).toFixed(1)+'%')}$('skybar').style.background=`linear-gradient(90deg,${stops.join(',')})`})();\n\nconst rosterEl=$('roster'); const rows={};\nfish.forEach(f=>{\n  const li=document.createElement('li');li.tabIndex=0;\n  const sw=f.kind==='turtle'?'radial-gradient(circle at 40% 35%,#9a9358,#6a6640 55%,#2f2d18)':f.id==='tuan'?'radial-gradient(circle at 35% 40%,#e5532a 0 30%,#f5f2ec 31% 60%,#e5532a 61%)':f.id==='tao'?'radial-gradient(circle at 50% 30%,#d8332a 0 28%,#f6f3ee 29%)':f.pal.body;\n  li.innerHTML=`<span class=\"dot\" style=\"background:${sw}\"><\/span><span class=\"nm\">${f.cn}<small>${f.py}<\/small><\/span><span class=\"md\"><\/span><div class=\"bar\"><i><\/i><\/div>`;\n  li.addEventListener('click',()=>select(f));li.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(f)}});\n  rosterEl.appendChild(li);rows[f.id]=li;\n});\nlet cardTimer=0;\nfunction select(f){selected=f;card.hidden=false;f.mood=clamp(f.mood+3,0,100);pop(f.x,f.y-f.L*.3);cardTimer=12;syncUI()}\nfunction closeCard(){selected=null;card.hidden=true;syncUI()}\n$('card-x').addEventListener('click',e=>{e.stopPropagation();closeCard()});\n\nfunction syncUI(){\n  syncRimLight();\n  if(document.body.classList.contains('full'))syncGardenLight();\n  $('clock').textContent=fmt(hour);\n  const [cn,en]=periodOf(hour);$('period').innerHTML=cn+' <small>'+en+'<\/small>';\n  const tag=$('livetag');tag.textContent=playing?'Playing a day':live?'Live clock':'Preview';tag.classList.toggle('off',!live);\n  if(document.activeElement!==slider)slider.value=hour.toFixed(2);\n  $('btn-live').setAttribute('aria-pressed',String(live&&!playing));\n  $('btn-play').setAttribute('aria-pressed',String(playing));\n  for(const f of fish){const li=rows[f.id];const [mc,me]=moodOf(f);li.querySelector('.md').textContent=mc+' '+me;\n    const bi=li.querySelector('i');bi.style.width=f.hunger.toFixed(0)+'%';bi.style.background=hungerColor(f.hunger);li.classList.toggle('sel',f===selected)}\n  if(selected){\n    const f=selected,[mc,me]=moodOf(f);\n    $('c-seal').textContent=f.seal;\n    $('c-name').innerHTML=`${f.cn}<small>${f.py}<\/small>`;\n    $('c-meta').textContent=`${f.breed} \u00b7 ${f.colorName} \u00b7 ${ageText(f)} old`;\n    $('c-mood').textContent=mc+' '+me;$('c-moodbar').style.width=f.mood.toFixed(0)+'%';$('c-moodbar').style.background='#2d4c8c';\n    $('c-hunger').textContent=hungerText(f.hunger);$('c-hungerbar').style.width=f.hunger.toFixed(0)+'%';$('c-hungerbar').style.background=hungerColor(f.hunger);\n    cardTimer-=.25;if(cardTimer<=0)closeCard();\n  }\n}\n\nslider.addEventListener('input',()=>{live=false;playing=false;hour=parseFloat(slider.value);syncUI()});\n$('btn-live').addEventListener('click',()=>{live=true;playing=false;hour=nowHour();syncUI()});\n$('btn-play').addEventListener('click',()=>{playing=!playing;if(playing)live=false;syncUI()});\n$('jumps').addEventListener('click',e=>{const b=e.target.closest('button[data-h]');if(!b)return;live=false;playing=false;hour=+b.dataset.h;syncUI()});\n$('btn-speed').addEventListener('click',e=>{lifeSpeed=lifeSpeed===1?60:1;e.currentTarget.setAttribute('aria-pressed',String(lifeSpeed>1))});\n$('btn-reset').addEventListener('click',()=>{fish.forEach(f=>{f.hunger=START_HUNGER[f.id];f.mood=60;f.bornAt=Date.now()-f.born*DAY});save();$('reset-msg').hidden=false;setTimeout(()=>$('reset-msg').hidden=true,2500);syncUI()});\n\nfunction toTank(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*S/r.width,(e.clientY-r.top)*S/r.height]}\n/* tapping the glass: a ripple rings out and nearby creatures startle away from it */\nfunction tapGlass(x,y){\n  taps.push({x,y,t:0});\n  for(const f of fish){const d=Math.hypot(f.x-x,f.y-y);if(d>170)continue;const k=1-d/170;\n    f.mood=clamp(f.mood-3*k,0,100);\n    if(f.kind==='snail'){f.retract=Math.max(f.retract||0,1.5+k*2.5);continue}   // snails just pull into their shells\n    if(f.swap)continue;\n    if(f.kind==='puffer'&&d<110)f.puff=1;\n    f.scare=.7+k*1.3;f.scx=x;f.scy=y;\n    f.dash=f.kind==='turtle'?16:f.kind==='crab'?36:f.kind==='puffer'?26:f.kind==='small'?82:66;\n    if(f.kind!=='crab'&&f.kind!=='turtle'){   // a quick flick of the body away from the tap\n      const away=Math.atan2(f.y-y,f.x-x);let diff=Math.atan2(Math.sin(away-f.ang),Math.cos(away-f.ang));f.ang+=diff*.55;}\n    f.speed=Math.max(f.speed,f.dash*.5*k+4);\n  }\n}\nlet lastTap={t:0,x:0,y:0}, pending=null;\ncv.addEventListener('pointerup',e=>{\n  const [x,y]=toTank(e);if(Math.hypot(x-C,y-C)>R)return;\n  const now=performance.now();\n  if(now-lastTap.t<320&&Math.hypot(x-lastTap.x,y-lastTap.y)<40){\n    clearTimeout(pending);pending=null;lastTap.t=0;dropFood(x,y);return;\n  }\n  lastTap={t:now,x,y};\n  clearTimeout(pending);\n  pending=setTimeout(()=>{pending=null;\n    let hit=null,best=1e9;for(const f of fish){const d=Math.hypot(f.x-x,f.y-y);if(d<Math.max(18,f.L*.55)&&d<best){best=d;hit=f}}\n    if(hit)select(hit);else{if(selected)closeCard();tapGlass(x,y)}\n  },280);\n});\ncv.addEventListener('dblclick',e=>e.preventDefault());\n$('screen').addEventListener('wheel',e=>{e.preventDefault();live=false;playing=false;hour=((hour+Math.sign(e.deltaY)*.25)%24+24)%24;syncUI()},{passive:false});\naddEventListener('pagehide',save);\n\n// full screen: the tank fills the window (and the real screen where the browser allows it)\nconst btnFull=$('btn-full');\nfunction setFull(on){\n  document.body.classList.toggle('full',on);btnFull.setAttribute('aria-pressed',String(on));\n  if(on){try{const r=document.documentElement.requestFullscreen?.();if(r&&r.catch)r.catch(()=>{})}catch(e){}}\n  else if(document.fullscreenElement){try{const r=document.exitFullscreen();if(r&&r.catch)r.catch(()=>{})}catch(e){}}\n  fitCanvas();if(on)requestAnimationFrame(paintGarden);\n  (on?$('btn-exit'):btnFull).focus();\n}\nbtnFull.addEventListener('click',()=>setFull(true));\n$('btn-exit').addEventListener('click',()=>setFull(false));\naddEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('full'))setFull(false)});\ndocument.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('full'))setFull(false)});\n// the zen garden around the bowl: raked gravel rings, moss islands and mossy stones\nconst garden=$('garden');\nfunction paintGarden(){\n  if(!document.body.classList.contains('full'))return;\n  const dpr=.35,W=innerWidth,H=innerHeight;   // painted small and scaled up: the softness is the point, and it's quick\n  garden.width=Math.round(W*dpr);garden.height=Math.round(H*dpr);\n  const g=garden.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);\n  const blob=(x,y,rx,ry,rot,c,bl)=>{g.save();g.shadowColor=c;g.shadowBlur=bl*dpr;g.shadowOffsetX=10000*dpr;g.beginPath();g.ellipse(x-10000,y,rx,ry,rot,0,6.283);g.fillStyle='#000';g.fill();g.restore()};   // soft blob at this canvas's scale\n  const rnd=mulberry(88),br=document.querySelector('.bowl').getBoundingClientRect();\n  const bx=br.left+br.width/2,by=br.top+br.height/2,bR=br.width/2,u=Math.max(.8,Math.min(W,H)/520);\n  // damp earth with a loose underpainting of greens and browns\n  g.fillStyle='#2c3520';g.fillRect(0,0,W,H);\n  for(let i=0;i<46;i++){const r=(60+rnd()*160)*u;blob(rnd()*W,rnd()*H,r,r*(.5+rnd()*.5),rnd()*3,['rgba(86,108,44,.55)','rgba(62,54,36,.5)','rgba(110,128,52,.4)','rgba(40,58,30,.55)'][i%4],r*.7)}\n  // weathered rocks, placed first so the moss can grow around them\n  const rocks=[];\n  for(let tries=0;tries<300&&rocks.length<10;tries++){\n    const x=-W*.05+rnd()*W*1.1,y=-H*.05+rnd()*H*1.1,r=Math.min(W,H)*(.07+rnd()*.11)+20;\n    if(Math.hypot(x-bx,y-by)<bR+r*.6)continue;\n    if(rocks.some(s=>Math.hypot(s.x-x,s.y-y)<s.r+r+30*u))continue;\n    rocks.push({x,y,r,pts:[...Array(12)].map((_,i)=>[i/12*6.283+(rnd()-.5)*.3,.72+rnd()*.34]),sq:.7+rnd()*.2});\n  }\n  const inRock=(x,y,pad=0)=>rocks.some(s=>((x-s.x)/(s.r+pad))**2+((y-s.y)/((s.r+pad)*s.sq))**2<.85);\n  // moss: thousands of fine fibres in cushions, lit from the top left so each cushion looks soft and round\n  const SH=['#1d2c14','#28401a','#33521f','#406526','#4f7a2c','#628f34','#7aa63e','#96bd52','#b6d36e'];\n  const fibre=SH.map(()=>new Path2D());\n  const cushion=(cx,cy,r)=>{const tone=(rnd()-.5)*.4;\n    blob(cx+r*.18,cy+r*.25,r*.95,r*.85,0,'rgba(10,14,6,.45)',r*.5);\n    const sh=k=>SH[Math.max(0,Math.min(SH.length-1,Math.round(k+tone*6)))];   // a soft cushion: body, then a lit top-left\n    blob(cx,cy,r*.85,r*.75,0,sh(4),r*.35);\n    blob(cx-r*.22,cy-r*.28,r*.5,r*.4,0,sh(6)+'b0',r*.35);\n  };\n  const flush=()=>{g.save();g.lineCap='round';g.lineWidth=1.1*u;SH.forEach((c,i)=>{g.strokeStyle=c;g.stroke(fibre[i]);fibre[i]=new Path2D()});g.restore()};\n  const step=24*u;\n  for(let y=-step;y<H+step;y+=step*.8)for(let x=-step;x<W+step;x+=step*.85){\n    const cx=x+(rnd()-.5)*step*.8,cy=y+(rnd()-.5)*step*.8;\n    if(Math.hypot(cx-bx,cy-by)<bR*.92||inRock(cx,cy)||rnd()<.16)continue;   // a few bare gaps of earth\n    cushion(cx,cy,step*(.35+rnd()*.85));\n  }\n  flush();\n  // the rocks: rounded, cracked, flecked with lichen\n  for(const st of rocks){\n    const pt=i=>{const [a,k]=st.pts[(i+12)%12];return[st.x+Math.cos(a)*st.r*k,st.y+Math.sin(a)*st.r*k*st.sq]};\n    const path=()=>{g.beginPath();for(let i=0;i<=12;i++){const [x1,y1]=pt(i),[x2,y2]=pt(i+1),mx=(x1+x2)/2,my=(y1+y2)/2;if(!i){const [x0,y0]=pt(-1);g.moveTo((x0+x1)/2,(y0+y1)/2)}g.quadraticCurveTo(x1,y1,mx,my)}g.closePath()};\n    g.save();g.shadowColor='rgba(10,12,6,.6)';g.shadowBlur=18*u;g.shadowOffsetX=8*u;g.shadowOffsetY=12*u;path();g.fillStyle='#5f5b50';g.fill();g.restore();\n    g.save();path();g.clip();\n    const gr=g.createRadialGradient(st.x-st.r*.4,st.y-st.r*.5,st.r*.05,st.x,st.y,st.r*1.15);gr.addColorStop(0,'#c9c2b0');gr.addColorStop(.5,'#8e887a');gr.addColorStop(1,'#4b4840');\n    g.fillStyle=gr;g.fillRect(st.x-st.r*1.3,st.y-st.r*1.3,st.r*2.6,st.r*2.6);\n    for(let k=0;k<8;k++)blob(st.x+(rnd()-.5)*st.r*1.4,st.y+(rnd()-.5)*st.r,st.r*(.15+rnd()*.25),st.r*(.1+rnd()*.15),rnd()*3,k%2?'rgba(255,250,235,.18)':'rgba(30,28,22,.2)',st.r*.15);\n    for(let k=0;k<st.r*st.r*.08;k++){g.fillStyle=rnd()<.5?'rgba(40,36,28,.3)':'rgba(240,235,220,.3)';g.fillRect(st.x+(rnd()-.5)*st.r*2.2,st.y+(rnd()-.5)*st.r*2,1,1)}\n    g.strokeStyle='rgba(35,32,26,.5)';g.lineWidth=1.1*u;g.lineCap='round';\n    for(let k=0;k<4;k++){let x=st.x+(rnd()-.5)*st.r,y=st.y+(rnd()-.5)*st.r*.8,a=rnd()*6.283;g.beginPath();g.moveTo(x,y);for(let j=0;j<6;j++){a+=(rnd()-.5)*1.2;x+=Math.cos(a)*st.r*.09;y+=Math.sin(a)*st.r*.09;g.lineTo(x,y)}g.stroke()}\n    for(let k=0;k<6;k++){const lx=st.x+(rnd()-.5)*st.r*1.3,ly=st.y+(rnd()-.5)*st.r;blob(lx,ly,(3+rnd()*7)*u,(2+rnd()*5)*u,rnd()*3,rnd()<.5?'rgba(214,214,160,.65)':'rgba(190,200,120,.6)',3*u)}\n    g.restore();\n  }\n  // moss creeping over the rock edges and caps\n  for(const st of rocks){\n    for(let k=0;k<14;k++){const a=rnd()*6.283,x=st.x+Math.cos(a)*st.r*(.85+rnd()*.2),y=st.y+Math.sin(a)*st.r*st.sq*(.85+rnd()*.2);if(Math.hypot(x-bx,y-by)<bR)continue;cushion(x,y,step*(.3+rnd()*.4))}\n    for(let k=0;k<3;k++)cushion(st.x+st.r*(rnd()-.3)*.6,st.y+st.r*(.1+rnd()*.3)*st.sq,st.r*(.12+rnd()*.14));\n  }\n  flush();\n  // spore stalks: fine reddish threads with tiny capsules\n  g.lineCap='round';\n  for(let k=0;k<W*H/14000;k++){const x=rnd()*W,y=rnd()*H;if(Math.hypot(x-bx,y-by)<bR||inRock(x,y))continue;\n    const a=-Math.PI/2+(rnd()-.5)*1.4,len=(6+rnd()*9)*u,ex=x+Math.cos(a)*len,ey=y+Math.sin(a)*len;\n    g.strokeStyle='rgba(150,84,40,.7)';g.lineWidth=.7*u;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+(rnd()-.5)*4*u,y-len*.5,ex,ey);g.stroke();\n    g.beginPath();g.ellipse(ex,ey,1.1*u,1.8*u,a+Math.PI/2,0,6.283);g.fillStyle=rnd()<.5?'#a8642c':'#c98a3c';g.fill()}\n  // painterly speckle\n  for(let k=0;k<W*H/400;k++){g.fillStyle=rnd()<.5?'rgba(255,255,220,.08)':'rgba(0,0,0,.1)';g.fillRect(rnd()*W,rnd()*H,1.5,1.5)}\n  // soft focus, baked in: shrink the painting and scale it back up (works in every browser, costs nothing per frame)\n  {const sm=document.createElement('canvas');sm.width=Math.max(8,garden.width/5|0);sm.height=Math.max(8,garden.height/5|0);const q=sm.getContext('2d');q.imageSmoothingQuality='high';q.drawImage(garden,0,0,sm.width,sm.height);\n   g.save();g.setTransform(1,0,0,1,0,0);g.imageSmoothingQuality='high';g.drawImage(sm,0,0,garden.width,garden.height);g.restore()}\n  // the bowl's soft shadow on the ground\n  const sg=g.createRadialGradient(bx+14,by+22,bR*.7,bx+14,by+22,bR*1.3);sg.addColorStop(0,'rgba(10,12,5,.5)');sg.addColorStop(1,'rgba(10,12,5,0)');\n  g.fillStyle=sg;g.fillRect(0,0,W,H);\n  syncGardenLight();\n}\nlet PAPER0=null;\nfunction syncRimLight(){const a=skyAt(hour).amb,n=nightness(hour),k=1-.38*n;$('rim-light').style.backgroundColor=css(a.map(v=>v*k));\n  // the page around the tank takes a gentler wash of the same light, so text stays easy to read\n  if(!PAPER0)PAPER0=hex(getComputedStyle(document.documentElement).getPropertyValue('--paper').trim()||'#f2ead9');\n  const lit=PAPER0.map((v,i)=>v*a[i]/255*(1-.18*n));document.documentElement.style.setProperty('--paper',css(mix(PAPER0,lit,.6)))}\nfunction syncGardenLight(){const a=skyAt(hour).amb;$('garden-light').style.backgroundColor=css(a.map(v=>v*.92+20))}\naddEventListener('resize',()=>{clearTimeout(paintGarden.t);paintGarden.t=setTimeout(paintGarden,150)});\n\n/* ---------- blue-and-white porcelain rim: diamond lattice on top, Greek key around the outer edge ---------- */\nconst rimCv=document.getElementById('rim');\nfunction paintRim(){\n  const box=rimCv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1),D=Math.round(box.width*dpr);if(!D)return;\n  if(rimCv.width!==D){rimCv.width=rimCv.height=D}\n  const g=rimCv.getContext('2d'),Rb=D/2,scr=document.getElementById('screen').getBoundingClientRect().width*dpr,Ri=scr/2,RW=Rb-Ri;\n  g.clearRect(0,0,D,D);g.save();g.translate(Rb,Rb);\n  const ink='#23468f',inkSoft='rgba(35,70,143,.55)';\n  const ring=(fr,w,col)=>{g.beginPath();g.arc(0,0,Ri+RW*fr,0,6.283);g.strokeStyle=col||ink;g.lineWidth=w*dpr;g.stroke()};\n  // a band runs from radius fraction a to b; (u,v) inside one repeat -> canvas point\n  const band=(a,b,n)=>{const r0=Ri+RW*a,r1=Ri+RW*b;return(i,u,v)=>{const ang=(i+u)/n*6.283-Math.PI/2,r=r0+(r1-r0)*v;return[Math.cos(ang)*r,Math.sin(ang)*r]}};\n  const poly=(P,i,pts,close)=>{g.beginPath();pts.forEach(([u,v],k)=>{\n      if(k){const [pu,pv]=pts[k-1];for(let s=1;s<=4;s++){const [x,y]=P(i,pu+(u-pu)*s/4,pv+(v-pv)*s/4);g.lineTo(x,y)}}else{const [x,y]=P(i,u,v);g.moveTo(x,y)}});\n    if(close)g.closePath()};\n  // lattice band: a ring of diamonds, each holding a little four-petal flower\n  const la=.12,lb=.6,lw=RW*(lb-la),nL=Math.max(24,Math.round(2*Math.PI*(Ri+RW*(la+lb)/2)/lw));\n  const L=band(la,lb,nL);\n  g.lineJoin='round';g.lineCap='round';\n  for(let i=0;i<nL;i++){\n    g.lineWidth=Math.max(.8,lw*.045);g.strokeStyle=ink;\n    poly(L,i,[[.5,0],[1,.5],[.5,1],[0,.5]],true);g.stroke();\n    // corner triangles filled in light blue wash\n    g.fillStyle='rgba(35,70,143,.18)';\n    for(const tri of [[[0,0],[.5,0],[0,.5]],[[1,0],[.5,0],[1,.5]],[[0,1],[.5,1],[0,.5]],[[1,1],[.5,1],[1,.5]]]){poly(L,i,tri,true);g.fill()}\n    // inner square and flower\n    g.lineWidth=Math.max(.7,lw*.035);poly(L,i,[[.5,.2],[.8,.5],[.5,.8],[.2,.5]],true);g.stroke();\n    g.fillStyle=ink;for(const [u,v] of [[.5,.36],[.64,.5],[.5,.64],[.36,.5]]){const [x,y]=L(i,u,v);g.beginPath();g.arc(x,y,lw*.055,0,6.283);g.fill()}\n    const [cx,cy]=L(i,.5,.5);g.beginPath();g.arc(cx,cy,lw*.035,0,6.283);g.fillStyle='#fff';g.fill();\n  }\n  ring(la,1.6);ring(lb,1.6);ring(lb+.035,.8,inkSoft);\n  // Greek key band around the outer edge\n  const ka=.68,kb=.93,kw=RW*(kb-ka),nK=Math.max(30,Math.round(2*Math.PI*(Ri+RW*(ka+kb)/2)/(kw*1.15)));\n  const Kp=band(ka,kb,nK);\n  g.lineWidth=Math.max(.8,kw*.1);g.strokeStyle=ink;g.lineCap='square';\n  for(let i=0;i<nK;i++){\n    poly(Kp,i,[[.08,.88],[.08,.12],[.82,.12],[.82,.72],[.32,.72],[.32,.4],[.58,.4]],false);g.stroke();\n    poly(Kp,i,[[.08,.88],[1.08,.88]],false);g.stroke();\n  }\n  ring(ka-.02,1.4);ring(kb+.02,1.4);\n  ring(.03,1,inkSoft);   // a fine line where the glaze meets the water\n  g.restore();\n}\nif(rimCv){paintRim();addEventListener('resize',paintRim);if(window.ResizeObserver)new ResizeObserver(paintRim).observe(rimCv)}\nfunction fitCanvas(){\n  const w=cv.getBoundingClientRect().width||S;\n  const k=Math.round(clamp(w*(window.devicePixelRatio||1)/S,1,2)*4)/4;\n  if(k!==K){K=k;cv.width=cv.height=Math.round(S*K)}\n}\naddEventListener('resize',fitCanvas);\nfitCanvas();\nwindow.__tank={taps,step,render,setHour:h=>{live=false;playing=false;hour=h},fish,dropFood};\n\nconst go=()=>requestAnimationFrame(t=>{last=t;frame(t)});\n(document.fonts&&document.fonts.load?Promise.race([document.fonts.load('22px \"Ma Shan Zheng\"'),new Promise(r=>setTimeout(r,1200))]):Promise.resolve()).then(go,go);\nsyncUI();\n})();\n<\/script>\n<\/body><\/html>", "lotus": "<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>[hidden]{display:none!important}body{margin:0}<\/style><\/head><body><title>Lotus Pond<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Karla:ital,wght@0,400;0,600;1,400&display=swap\">\n<style>\n/* Layout: a porcelain bowl holding the 480px round screen, with a rice-paper control sheet beside it (stacked on phones). */\n:root{\n  --paper:#f2ead9;\n  --paper-deep:#e6dbc4;\n  --ink:#2b2622;\n  --ink-soft:#6f655a;\n  --cinnabar:#b83a2a;\n  --cobalt:#2d4c8c;\n  --jade:#4f7f4c;\n  --porcelain:#fbfaf6;\n  --f-brush:\"Ma Shan Zheng\",\"STKaiti\",\"KaiTi\",\"Kaiti SC\",serif;\n  --f-text:\"Karla\",\"PingFang SC\",\"Hiragino Sans GB\",\"Microsoft YaHei\",system-ui,sans-serif;\n  --scr:min(480px, calc(100vw - 72px));\n  color-scheme:light;\n}\nhtml,body{min-height:100%}\n[hidden]{display:none!important}\nbody{\n  background:\n    radial-gradient(1200px 600px at 20% -10%, rgba(255,255,255,.55), transparent 60%),\n    radial-gradient(900px 700px at 110% 110%, rgba(170,140,90,.12), transparent 60%),\n    var(--paper);\n  color:var(--ink);\n  font-family:var(--f-text);\n  font-size:15px;\n  line-height:1.5;\n}\n.page{\n  max-width:1060px;margin:0 auto;\n  padding-block:28px 48px;\n  padding-left:max(16px, env(safe-area-inset-left, 0px));\n  padding-right:max(16px, env(safe-area-inset-right, 0px));\n  display:grid;gap:28px;\n}\nheader{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}\nheader h1{font-family:var(--f-brush);font-weight:400;font-size:52px;line-height:1;margin:0;letter-spacing:.04em}\nheader .sub{color:var(--ink-soft);padding-bottom:6px}\n.seal{\n  display:inline-grid;place-items:center;width:40px;height:40px;border-radius:6px;\n  background:var(--cinnabar);color:var(--porcelain);font-family:var(--f-brush);font-size:20px;line-height:1;\n  transform:rotate(-4deg);margin-bottom:6px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)\n}\n.main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:36px;align-items:start}\n@media (max-width:900px){.main{grid-template-columns:1fr;justify-items:center}}\n\n/* The porcelain bowl */\n.bowl{\n  --rim:calc(var(--scr) * .075);\n  position:relative;width:calc(var(--scr) + var(--rim)*2);aspect-ratio:1;max-width:100%;\n  border-radius:50%;\n  background:radial-gradient(circle at 38% 32%, #ffffff 0 40%, #f1eee6 66%, #d9d3c6 100%);\n  box-shadow:0 22px 40px -18px rgba(60,45,25,.45), 0 4px 10px rgba(60,45,25,.12);\n  display:grid;place-items:center;\n}\n.bowl::before{ /* qinghua cobalt bands on the rim */\n  content:\"\";position:absolute;inset:calc(var(--rim)*.22);border-radius:50%;\n  border:2px solid rgba(45,76,140,.55);\n  box-shadow:0 0 0 4px rgba(255,255,255,0), 0 0 0 5px rgba(45,76,140,.3);\n  pointer-events:none;\n}\n.screen{\n  position:relative;width:var(--scr);height:var(--scr);border-radius:50%;overflow:hidden;\n  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08), 0 0 0 3px rgba(255,255,255,.9);\n  font-size:calc(var(--scr) * .027);\n  touch-action:manipulation;user-select:none;-webkit-user-select:none;\n}\ncanvas#tank{display:block;width:100%;height:100%;cursor:pointer}\n\n/* Fish card on the screen */\n.card{\n  position:absolute;left:50%;bottom:9%;transform:translateX(-50%);\n  width:64%;padding:.9em 1.1em .85em;\n  background:rgba(250,245,233,.93);\n  border-radius:.6em;\n  box-shadow:0 .4em 1.2em rgba(40,30,20,.25); px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:20px;border:1px solid currentColor;color:var(--jade)}\n.timebig .tag.off{color:var(--ink-soft)}\n.skybar{height:14px;border-radius:8px;margin:12px 0 4px;position:relative}\ninput[type=range]{width:100%;margin:0;accent-color:var(--cobalt)}\n.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}\n.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}\nbutton.btn{\n  font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;cursor:pointer;\n  border:1px solid rgba(43,38,34,.28);background:rgba(255,255,255,.45);color:var(--ink);\n}\nbutton.btn:hover{background:rgba(255,255,255,.8)}\nbutton.btn[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}\nbutton:focus-visible,input:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}\n.roster{display:grid;gap:2px;margin:0;padding:0;list-style:none}\n.roster li{\n  display:grid;grid-template-columns:22px minmax(0,1fr) 84px 70px;gap:10px;align-items:center;\n  padding:6px 8px;border-radius:8px;cursor:pointer\n}\n.roster li:hover,.roster li.sel{background:rgba(255,255,255,.5)}\n.roster .dot{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}\n.roster .nm{font-family:var(--f-brush);font-size:20px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.roster .nm small{font-family:var(--f-text);font-size:12px;color:var(--ink-soft);margin-left:6px}\n.roster .md{font-size:13px;color:var(--ink-soft);white-space:nowrap}\n.roster .hdr{cursor:default;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding-block:0}\n.roster .hdr:hover{background:none}\n.howto{margin:0;padding:0;list-style:none;display:grid;gap:6px}\n.howto li{display:grid;grid-template-columns:110px 1fr;gap:10px}\n.howto b{font-weight:600}\n.note{color:var(--ink-soft);font-size:13px;max-width:62ch}\n@media (max-width:480px){\n  header h1{font-size:42px}\n  .roster li{grid-template-columns:18px minmax(0,1fr) 64px 56px;gap:8px}\n  .howto li{grid-template-columns:1fr;gap:0}\n}\n@media (prefers-reduced-motion:reduce){.card{animation:none}}\n/* Full screen tank */\n.stage{display:grid;justify-items:center;gap:14px;min-width:0;max-width:100%}\n.fs-exit{display:none}\nbody.full{overflow:hidden}\nbody.full .stage{\n  position:fixed;inset:0;z-index:50;place-content:center;justify-content:center;gap:0;overflow:hidden;\n  background:#55673a;\n  --scr:min(70vw, 76vh);\n}\n@supports (height:1dvh){body.full .stage{--scr:min(70vw, 76dvh)}}\n/* tall screens (phones): the bowl spills past the sides so the water is as big as it can be */\n@media (max-aspect-ratio:1/1){\n  body.full .stage{--scr:min(112vw, 78vh)}\n  @supports (height:1dvh){body.full .stage{--scr:min(112vw, 78dvh)}}\n}\n.garden,.garden-light{display:none}\nbody.full .garden{display:block;position:absolute;inset:0;width:100%;height:100%}\nbody.full .garden-light{display:block;position:absolute;inset:0;mix-blend-mode:multiply;pointer-events:none;transition:background-color 1s}\nbody.full .bowl{z-index:1;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:none;box-shadow:0 30px 50px -20px rgba(20,25,10,.65), 0 6px 14px rgba(20,25,10,.35)}\nbody.full .fs-open{display:none}\nbody.full .fs-exit{\n  display:grid;place-items:center;position:fixed;z-index:51;\n  top:calc(12px + env(safe-area-inset-top, 0px));right:calc(12px + env(safe-area-inset-right, 0px));\n  width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);\n  background:rgba(35,32,26,.72);color:#f2ead9;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:26px;line-height:1;cursor:pointer;\n}\nbody.full .fs-exit:hover{background:rgba(35,32,26,.9)}\n\n/* qinghua rim: painted on a canvas that sits in the bowl's rim */\n.bowl::before{display:none}\n.bowl .rim{position:absolute;inset:0;width:100%;height:100%;border- mall>The fish<\/small><\/h2>\n        <ul class=\"roster\" id=\"roster\">\n          <li class=\"hdr\"><span><\/span><span>Name<\/span><span>Mood<\/span><span>Hunger<\/span><\/li>\n        <\/ul>\n        <div class=\"row\">\n          <button class=\"btn\" id=\"btn-speed\" aria-pressed=\"false\">Fast hunger (60\u00d7)<\/button>\n          <button class=\"btn\" id=\"btn-reset\">Reset the fish<\/button>\n        <\/div>\n        <p class=\"note\" id=\"reset-msg\" hidden>Fish reset to their starting stats.<\/p>\n      <\/section>\n\n      <section class=\"block\">\n        <h2>\u73a9\u6cd5 <small>How to play<\/small><\/h2>\n        <ul class=\"howto\">\n          <li><b>Double-tap<\/b><span>Drop a pinch of food. Hungry koi race to it; full ones ignore it.<\/span><\/li>\n          <li><b>Tap a fish<\/b><span>Opens its card with name, colour, age, mood and hunger. A tap is also a little pat, which cheers it up.<\/span><\/li>\n          <li><b>Scroll on tank<\/b><span>Stands in for turning the knob: moves the hour to preview the light.<\/span><\/li>\n        <\/ul>\n        <p class=\"note\">Fish get hungrier over about 8 hours, and stats are kept in this browser. Mood drifts toward a level set by hunger, rises with food and pats, and fish get sleepy after dark.<\/p>\n      <\/section>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n(() => {\n'use strict';\nconst S = 480, C = S / 2, R = 238;\nconst cv = document.getElementById('tank');\nlet ctx = cv.getContext('2d');   // swapped briefly when a fish is drawn into its depth buffer\nlet K = 1;   // drawing scale: the tank is laid out in 480 units and drawn sharper on bigger screens\n\n/* ---------- helpers ---------- */\nfunction mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\nconst rnd = mulberry(20261115);\nconst rr = (a,b)=>a+(b-a)*Math.random();\nconst clamp=(v,a,b)=>v<a?a:v>b?b:v;\nfunction off(w=S,h=S){const c=document.createElement('canvas');c.width=w;c.height=h;return c}\nfunction hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}\nfunction mix(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}\nconst css=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;\n// soft blur that works in every browser: draw far off-canvas and let the shadow land in place\nfunction softBlob(g,x,y,rx,ry,rot,color,blur){g.save();g.shadowColor=color;g.shadowBlur=blur;g.shadowOffsetX=10000;g.beginPath();g.ellipse(x-10000,y,rx,ry,rot,0,6.283);g.fillStyle='#000';g.fill();g.restore()}\n\n/* ---------- time of day palette, read from the sky reference ---------- */\n// [hour, deep water, sky reflection, cloud tint, ambient light]\nconst SKY = [\n  [0,   '#0a1428','#18244e','#4a5a8e','#7c86b4'],\n  [4.5, '#0b152c','#1b2852','#4e5e92','#7e88b6'],\n  [5.5, '#122a44','#2f5872','#7c98ae','#a6b6c4'],\n  [6,   '#10384a','#3a8a86','#b4e2d0','#dcefe6'],\n  [7,   '#12344e','#6e98b8','#f2d8c0','#f8efe0'],\n  [8,   '#0f2c4c','#3f6fa8','#e8f0ff','#ffffff'],\n  [12,  '#0d2a4c','#356aac','#eef4ff','#ffffff'],\n  [15,  '#0f2c4c','#4474ae','#eef2fc','#fffdf8'],\n  [16,  '#152c4a','#6a84b4','#fbeee8','#fdf5ee'],\n  [17,  '#2a3150','#c49aa0','#ffd0c2','#fde6d8'],\n  [18,  '#3a2440','#d0603e','#ff9e78','#f6c0a4'],\n  [18.6,'#221c3a','#6a4a6c','#b08aa8','#b8a0b8'],\n  [19,  '#0e1838','#25326c','#5e68a0','#8088b8'],\n  [21,  '#0a1430','#1c285c','#4e5e94','#7c86b4'],\n  [24,  '#0a1428','#18244e','#4a5a8e','#7c86b4'],\n].map(k=>[k[0],hex(k[1]),hex(k[2]),hex(k[3]),hex(k[4])]);\nfunction skyAt(h){\n  h=((h%24)+24)%24;\n  for(let i=0;i<SKY.length-1;i++){\n    const a=SKY[i],b=SKY[i+1];\n    if(h>=a[0]&&h<=b[0]){const t=(h-a[0])/(b[0]-a[0]);const s=t*t*(3-2*t);\n      return{deep:mix(a[1],b[1],s),sky:mix(a[2],b[2],s),cloud:mix(a[3],b[3],s),amb:mix(a[4],b[4],s)}}\n  }\n  const a=SKY[0];return{deep:a[1],sky:a[2],cloud:a[3],amb:a[4]};\n}\nfunction daylight(h){h=((h%24)+24)%24;if(h<5||h>=19.2)return 0;if(h<7)return (h-5)/2;if(h>17.8)return Math.max(0,(19.2-h)/1.4);return 1}\nfunction nightness(h){return 1-daylight(h)}\nfunction sunsetGlow(h){return Math.max(0,1-Math.abs(h-17.9)/1.0)}\nfunction periodOf(h){\n  h=((h%24)+24)%24;\n  if(h<5)return['\u6df1\u591c','Late night'];if(h<7)return['\u9ece\u660e','Dawn'];if(h<11)return['\u4e0a\u5348','Morning'];\n  if(h<13)return['\u6b63\u5348','Noon'];if(h<16.5)return['\u4e0b\u5348','Afternoon'];if(h<18.6)return['\u9ec4\u660f','Sunset'];\n  if(h<21)return['\u508d\u665a','Evening'];return['\u591c','Night'];\n}\n\n/* ---------- pre-painted layers (the ESP32 plan too: bake once, blit every frame) ---------- */\n// rice paper grain\nconst paperL = off();\n(()=>{const g=paperL.getContext('2d');const im=g.createImageData(S,S);\n  for(let i=0;i<im.data.length;i+=4){const v=232+rnd()*23;im.data[i]=v;im.data[i+1]=v-2;im.data[i+2]=v-6;im.data[i+3]=255}\n  g.putImageData(im,0,0);\n  g.globalAlpha=.07;g.strokeStyle='#8a7a60';g.lineWidth=.6;\n  for(let i=0;i<260;i++){const x=rnd()*S,y=rnd()*S,a=rnd()*6.28,l=6+rnd()*22;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a+.6)*l*.5,y+Math.sin(a+.6)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}\n})();\n// pigment pools: soft blooms with a faint dried edge\nconst washL = off(S+40,S+40);\n(()=>{const g=washL.getContext('2d');\n  for(let i=0;i<34;i++){\n    const x=rnd()*(S+40),y=rnd()*(S+40),r=26+rnd()*80,a=.07+rnd()*.1,rot=rnd()*3;\n    softBlob(g,x,y,r,r*(.6+rnd()*.4),rot,`rgba(10,30,45,${a})`,24);\n    g.save();g.strokeStyle=`rgba(10,30,45,${a*.6})`;g.lineWidth=2;g.shadowColor=`rgba(10,30,45,${a})`;g.shadowBlur=5;\n    g.beginPath();g.ellipse(x,y,r*.9,r*.9*(.6+rnd()*.4),rot,rnd()*3,rnd()*3+3.5);g.stroke();g.restore();\n  }\n})();\n// pebble bed on the bottom of the bowl\nconst pebbleL = off();\n(()=>{const g=pebbleL.getContext('2d');\n  const tones=[[148,140,128],[118,114,108],[176,158,134],[92,98,104],[156,120,96],[200,190,170],[128,136,128]];\n  const placed=[];\n  for(let tries=0;tries<6000&&placed.length<520;tries++){\n    const a=rnd()*6.283,d=Math.sqrt(rnd())*(R-6),x=C+Math.cos(a)*d,y=C+Math.sin(a)*d;\n    const r=(d>R-60?6:4.5)+rnd()*(d>R-60?9:7);\n    if(placed.some(p=>Math.hypot(p[0]-x,p[1]-y)<(p[2]+r)*.72))continue;\n    placed.push([x,y,r]);\n  }\n  placed.sort((p,q)=>p[2]-q[2]);\n  for(const [x,y,r] of placed){\n    const t=tones[(rnd()*tones.length)|0].map(v=>v+(rnd()-.5)*20),rot=rnd()*3.14,ry=r*(.62+rnd()*.3);\n    g.save();g.translate(x,y);g.rotate(rot);\n    g.beginPath();g.ellipse(1.5,2.2,r,ry,0,0,6.283);g.fillStyle='rgba(20,18,14,.35)';g.shadowColor='rgba(20,18,14,.4)';g.shadowBlur=3;g.fill();g.shadowBlur=0;\n    g.beginPath();g.ellipse(0,0,r,ry,0,0,6.283);\n    const gr=g.createRadialGradient(-r*.35,-ry*.4,1,0,0,r*1.05);\n    gr.addColorStop(0,css(t.map(v=>Math.min(255,v+22))));gr.addColorStop(.6,css(t));gr.addColorStop(1,css(t.map(v=>v*.7)));\n    g.fillStyle=gr;g.fill();\n    g.strokeStyle=css(t.map(v=>v*.55),.5);g.lineWidth=.8;g.stroke();\n    if(rnd()<.3){g.beginPath();g.ellipse(-r*.2,ry*.1,r*.5,ry*.15,.3,0,6.283);g.fillStyle=css(t.map(v=>v*.85),.5);g.fill()}\n    g.restore();\n  }\n  for(let i=0;i<700;i++){const a=rnd()*6.283,d=Math.sqrt(rnd())*R;g.fillStyle=`rgba(${150+rnd()*60|0},${135+rnd()*50|0},110,${.25+rnd()*.3})`;g.fillRect(C+Math.cos(a)*d,C+Math.sin(a)*d,1.3,1.3)}\n})();\n// water weeds deep below: feathery hornwort and ribbon eelgrass, leaning every which way\nconst deepL = off();\n(()=>{const g=deepL.getContext('2d');\n  const cols=['#0b2628','#0f302f','#123a36','#163f37'];\n  const clumps=[];\n  for(let i=0;i<17;i++){const a=i/17*6.283+rnd()*.3,rad=185+rnd()*40;clumps.push([C+Math.cos(a)*rad,C+Math.sin(a)*rad,rad,i%3===1?'grass':'wort',a])}   // a ring of plants by the wall\n  for(const [cx,cy,rad,type,pos] of clumps){\n    const lean=pos+Math.PI/2*(rnd()<.5?1:-1)+(rnd()-.5)*1.2;   // each clump leans its own way along the wall\n    const n=type==='grass'?7+(rnd()*5|0):5+(rnd()*5|0);\n    for(let s=0;s<n;s++){\n      const col=cols[(rnd()*cols.length)|0];\n      let ang=lean+(rnd()-.5)*2.2, x=cx+(rnd()-.5)*20, y=cy+(rnd()-.5)*20;\n      const curl=(rnd()-.5)*.09, len=40+rnd()*(type==='grass'?100:80), steps=Math.max(6,len/5|0);\n      g.save();g.strokeStyle=col;g.fillStyle=col;g.lineCap='round';g.shadowColor=col;g.shadowBlur=5;g.globalAlpha=.8;\n      if(type==='grass'){\n        const L=[],R2=[];\n        for(let k=0;k<=steps;k++){const w=2.6*(1-k/steps)+.4;const nx=-Math.sin(ang),ny=Math.cos(ang);L.push([x+nx*w,y+ny*w]);R2.push([x-nx*w,y-ny*w]);\n          ang+=curl+(rnd()-.5)*.05;x+=Math.cos(ang)*5;y+=Math.sin(ang)*5;\n          if(Math.hypot(x-C,y-C)>R-8)ang+=.25;if(Math.hypot(x-C,y-C)<150){const o=Math.atan2(y-C,x-C);ang+=Math.atan2(Math.sin(o-ang),Math.cos(o-ang))*.35}}\n        g.beginPath();L.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));R2.reverse().forEach(p=>g.lineTo(p[0],p[1]));g.closePath();g.fill();\n      }else{\n        g.lineWidth=1.6;g.beginPath();\n        for(let k=0;k<steps;k++){ang+=curl+(rnd()-.5)*.2;x+=Math.cos(ang)*5;y+=Math.sin(ang)*5;\n          if(Math.hypot(x-C,y-C)>R-10)ang+=.3;\n          if(Math.hypot(x-C,y-C)<150){const o=Math.atan2(y-C,x-C);ang+=Math.atan2(Math.sin(o-ang),Math.cos(o-ang))*.35}\n          const nl=(11-k/steps*5)*(.8+rnd()*.4);\n          for(let j=0;j<6;j++){const na=ang+j/6*6.283+rnd()*.4;g.moveTo(x,y);g.lineTo(x+Math.cos(na)*nl,y+Math.sin(na)*nl)}}\n        g.stroke();\n      }\n      g.restore();\n    }\n  }\n})();\n// cloud reflections: a white mask that tiles horizontally, tinted by the hour each frame\nconst CW=720;\nconst cloudMask=off(CW,CW), cloudTint=off(CW,CW);\n(()=>{const g=cloudMask.getContext('2d');\n  for(let b=0;b<6;b++){\n    const bx=rnd()*CW,by=rnd()*CW,bw=110+rnd()*120,bh=50+rnd()*60,rot=-.4+rnd()*.3;\n    for(let k=0;k<16;k++){\n      const x=bx+(rnd()-.5)*bw*1.6,y=by+(rnd()-.5)*bh,rx=30+rnd()*60,ry=16+rnd()*30,a=.10+rnd()*.16;\n      for(const ox of [-CW,0,CW])for(const oy of [-CW,0,CW])softBlob(g,x+ox,y+oy,rx,ry,rot,`rgba(255,255,255,${a})`,26+rnd()*20);\n    }\n  }\n})();\n// painterly lily pads: flat greens, a fuzzy lighter rim made of stipple, dew drops; pink lotus flowers\nconst padL = off();\nconst PADS=[[112,146,34,.3],[70,200,27,2.1],[148,210,24,4.2],[92,256,20,1.2],[176,120,19,3.3],[56,140,16,5.4],\n            [372,338,32,3.6],[330,392,24,1.0],[410,286,20,5.0],[300,424,16,2.6],[396,388,15,4.4],[352,82,18,1.9],[392,118,13,0.6]];\nconst LOTUS=[146,174], LOTUS2=[364,350], BUDS=[[96,214],[338,96]];\n(()=>{const g=padL.getContext('2d');\n  const greens=[['#3f9a4a','#5cb65a','#a9dc7c'],['#2f8a4a','#4ea957','#9bd37a'],['#4a9e3e','#6abd52','#c0e48a']];\n  for(const [x,y,r,notch] of PADS){\n    const [dark,mid,rim]=greens[(rnd()*3)|0];\n    const path=(rr2=r)=>{g.beginPath();g.moveTo(x,y);g.arc(x,y,rr2,notch+.24,notch-.24+6.283);g.closePath()};\n    // soft shadow on the water\n    g.save();g.shadowColor='rgba(0,10,24,.5)';g.shadowBlur=10;g.shadowOffsetX=4;g.shadowOffsetY=6;path();g.fillStyle=dark;g.fill();g.restore();\n    // flat body, lighter toward the rim\n    path();const gr=g.createRadialGradient(x,y,r*.1,x,y,r);gr.addColorStop(0,mid);gr.addColorStop(.72,mid);gr.addColorStop(1,rim);g.fillStyle=gr;g.fill();\n    g.save();path();g.clip();\n    // a few soft blotches of darker green\n    for(let k=0;k<4;k++)softBlob(g,x+(rnd()-.5)*r,y+(rnd()-.5)*r,r*.35,r*.25,rnd()*3,dark+'55',8);\n    // faint veins\n    g.strokeStyle='rgba(30,90,40,.22)';g.lineWidth=.9;g.lineCap='round';\n    for(let k=0;k<8;k++){const a=notch+.5+k/8*5.4;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a+.08)*r*.5,y+Math.sin(a+.08)*r*.5,x+Math.cos(a)*r*.86,y+Math.sin(a)*r*.86);g.stroke()}\n    g.restore();\n    // fuzzy stippled rim: dots scattered on both sides of the edge\n    const nDots=Math.round(r*14);\n    for(let k=0;k<nDots;k++){\n      let a=rnd()*6.283;const da=Math.atan2(Math.sin(a-notch),Math.cos(a-notch));if(Math.abs(da)<.26)continue;\n      const d=r*(.8+rnd()*.24),px=x+Math.cos(a)*d,py=y+Math.sin(a)*d,sz=.5+rnd()*1.3;\n      g.fillStyle=rnd()<.7?rim:(rnd()<.5?'#e2f4b0':mid);g.globalAlpha=.45+rnd()*.5;\n      g.beginPath();g.arc(px,py,sz,0,6.283);g.fill();\n    }\n    // stipple inside the leaf too, very light\n    for(let k=0;k<r*5;k++){const a=rnd()*6.283,d=Math.sqrt(rnd())*r*.8;g.fillStyle=rnd()<.5?rim:dark;g.globalAlpha=.18;g.fillRect(x+Math.cos(a)*d,y+Math.sin(a)*d,1.1,1.1)}\n    g.globalAlpha=1;\n    // dew drops\n    const drops=r>22?2+(rnd()*3|0):1+(rnd()*2|0);\n    for(let k=0;k<drops;k++){const a=rnd()*6.283,d=rnd()*r*.6,dx=x+Math.cos(a)*d,dy=y+Math.sin(a)*d,dr=1.6+rnd()*2.6;\n      g.beginPath();g.arc(dx+.6,dy+.9,dr,0,6.283);g.fillStyle='rgba(20,70,30,.35)';g.fill();\n      g.beginPath();g.arc(dx,dy,dr,0,6.283);const dg=g.createRadialGradient(dx-dr*.3,dy-dr*.3,0,dx,dy,dr);dg.addColorStop(0,'rgba(240,255,235,.9)');dg.addColorStop(.6,'rgba(190,235,180,.45)');dg.addColorStop(1,'rgba(120,190,110,.5)');g.fillStyle=dg;g.fill();\n      g.beginPath();g.arc(dx-dr*.35,dy-dr*.35,dr*.3,0,6.283);g.fillStyle='rgba(255,255,255,.95)';g.fill()}\n  }\n  const lotus=(lx,ly,sc)=>{\n    g.save();g.translate(lx,ly);g.scale(sc,sc);\n    const ring=(n,len,wid,rot,c1,c2)=>{for(let k=0;k<n;k++){const a=rot+k/n*6.283;g.save();g.rotate(a);\n      g.beginPath();g.moveTo(0,0);g.bezierCurveTo(wid,len*.3,wid*.8,len*.8,0,len);g.bezierCurveTo(-wid*.8,len*.8,-wid,len*.3,0,0);\n      const gr=g.createLinearGradient(0,0,0,len);gr.addColorStop(0,c2);gr.addColorStop(1,c1);g.fillStyle=gr;\n      g.shadowColor='rgba(60,0,30,.35)';g.shadowBlur=4;g.fill();g.shadowBlur=0;\n      // fuzzy petal tip\n      for(let d=0;d<10;d++){const t=.7+rnd()*.32,px=(rnd()-.5)*wid*.9*(1.1-t),py=len*t;g.fillStyle='rgba(255,220,235,.6)';g.fillRect(px,py,1,1)}\n      g.strokeStyle='rgba(200,80,130,.18)';g.lineWidth=.6;g.beginPath();g.moveTo(0,len*.15);g.lineTo(0,len*.85);g.stroke();\n      g.restore()}};\n    ring(9,22,9,0,'#ee7fa6','#fbd2e0');\n    ring(8,16,7,.35,'#f59bbb','#fff0f5');\n    ring(6,10,5,.1,'#fbbcd2','#ffffff');\n    g.beginPath();g.arc(0,0,5,0,6.283);g.fillStyle='#f4c73a';g.fill();\n    for(let k=0;k<12;k++){const a=k/12*6.283;g.beginPath();g.arc(Math.cos(a)*5.6,Math.sin(a)*5.6,1,0,6.283);g.fillStyle='#e8a22a';g.fill()}\n    g.restore();\n  };\n  lotus(...LOTUS,1);lotus(...LOTUS2,.85);\n  for(const [bx,by] of BUDS){g.save();g.translate(bx,by);g.rotate(rnd()*6.28);\n    g.shadowColor='rgba(0,10,24,.45)';g.shadowBlur=5;g.shadowOffsetX=2;g.shadowOffsetY=3;\n    g.beginPath();g.moveTo(0,-9);g.bezierCurveTo(7,-4,6,6,0,8);g.bezierCurveTo(-6,6,-7,-4,0,-9);\n    const gr=g.createLinearGradient(0,-9,0,8);gr.addColorStop(0,'#f06c9a');gr.addColorStop(1,'#fcd6e2');g.fillStyle=gr;g.fill();g.restore()}\n})();\n// painterly stipple over everything: soft light and dark specks\nconst speckL=off();\n(()=>{const g=speckL.getContext('2d');\n  for(let i=0;i<9000;i++){const x=rnd()*S,y=rnd()*S,l=rnd()<.5;g.fillStyle=l?'rgba(255,255,255,.5)':'rgba(0,0,0,.5)';g.globalAlpha=.1+rnd()*.25;g.fillRect(x,y,.8+rnd()*.9,.8+rnd()*.9)}\n})();\n\n/* ---------- fish ---------- */\nconst DAY = 86400000;\nconst ROSTER = [\n  {id:'jin', cn:'\u5c0f\u91d1', py:'Xi\u01ceo J\u012bn', kind:'koi', breed:'Orange ogon koi', colorName:'\u6a59 orange', L:62, W:.15, born:410, seal:'\u91d1',\n   pal:{body:'#e4582a',light:'#f6a062',edge:'#a8341c',fin:'#f08c55'}, spots:[]},\n  {id:'tuan', cn:'\u56e2\u56e2', py:'Tu\u00e1ntuan', kind:'koi', breed:'Kohaku koi', colorName:'\u7ea2\u767d red & white', L:58, W:.15, born:190, seal:'\u56e2',\n   pal:{body:'#f5f2ec',light:'#ffffff',edge:'#9d9488',fin:'#f7f4ef'},\n   spots:[{s:.14,l:.1,r:.08,c:'#e5532a'},{s:.38,l:-.35,r:.09,c:'#e5532a'},{s:.42,l:.45,r:.06,c:'#e5532a'},{s:.66,l:.05,r:.07,c:'#ef6a35'}]},\n  {id:'tao', cn:'\u6843\u6843', py:'T\u00e1otao', kind:'koi', breed:'Tancho koi', colorName:'\u4e39\u9876 red crown', L:54, W:.145, born:95, seal:'\u6843',\n   pal:{body: est=null,bs=-1;\n  for(let k=0;k<8;k++){const a=Math.random()*6.283,d=(.3+.7*Math.sqrt(Math.random()))*maxR,x=C+Math.cos(a)*d,y=C+Math.sin(a)*d;let m=1e9;\n    for(const o of fish){if(o===f||(o.kind==='small'&&(!f||f.kind==='small')))continue;m=Math.min(m,Math.hypot(o.x-x,o.y-y),Math.hypot(o.tx-x,o.ty-y)*1.2)}\n    if(m>bs){bs=m;best=[x,y]}}\n  return best}\nfunction update(dt,t){\n  const night=nightness(hour);\n  school.t-=dt;if(school.t<=0){[school.x,school.y]=openSpot(null,150);school.t=rr(7,13)}\n  for(const f of fish){\n    const small=f.kind==='small', turtle=f.kind==='turtle';\n    f.hunger=clamp(f.hunger+dt*HUNGER_PER_SEC*lifeSpeed,0,100);\n    const base=78-Math.max(0,f.hunger-25)*.9-night*8;\n    f.mood=clamp(f.mood+(base-f.mood)*dt*.004*lifeSpeed,0,100);\n    f.sleepy = night>.7 && f.hunger<80;   // only a starving fish stays up\n\n    let chasing=null;\n    if(f.hunger>12&&food.length){\n      let best=1e9;for(const p of food){const d=(p.x-f.x)**2+(p.y-f.y)**2;if(d<best){best=d;chasing=p}}\n    }\n    let maxSpeed;\n    if(chasing){f.tx=chasing.x;f.ty=chasing.y;maxSpeed=(turtle?20:small?44:36)*(.8+f.hunger/200)}\n    else{\n      f.retarget-=dt;\n      const near=Math.hypot(f.tx-f.x,f.ty-f.y)<14;\n      if(small){if(f.retarget<=0||near){f.tx=school.x+rr(-30,30);f.ty=school.y+rr(-30,30);f.retarget=rr(1.6,3.2)}}\n      else if(f.retarget<=0||near){[f.tx,f.ty]=openSpot(f,165);f.retarget=rr(6,13)}\n      maxSpeed=f.sleepy?0:(turtle?7:small?20:13)*(f.hunger>78?.7:1);\n      if(turtle){f.restT=(f.restT||0)-dt;if(f.restT<-rr(6,14))f.restT=rr(4,10);if(f.restT>0)maxSpeed=0}   // turtles stop for a sit on the pebbles\n    }\n    maxSpeed*=f.spd;\n    if(f.scare>0){f.scare-=dt;const a=Math.atan2(f.y-f.scy,f.x-f.scx);let ax=f.x+Math.cos(a)*90-C,ay=f.y+Math.sin(a)*90-C;const ad=Math.hypot(ax,ay);if(ad>150){ax*=150/ad;ay*=150/ad}f.tx=C+ax;f.ty=C+ay;maxSpeed=Math.max(maxSpeed,f.dash*Math.min(1,f.scare+.3));f.sleepy=false;if(f.restT>0)f.restT=0;if(f.retarget!=null)f.re ;tg.fillRect(0,0,CW,CW);\n  const cx=-((t*3.2)%CW), cy=-120+Math.sin(t*.02)*20;\n  ctx.globalAlpha=.28+.22*day;ctx.drawImage(cloudTint,cx,cy);ctx.drawImage(cloudTint,cx+CW,cy);ctx.globalAlpha=1;\n  // dappled light\n  if(day>.2){ctx.globalCompositeOperation='screen';\n    for(let i=0;i<7;i++){const x=C+Math.sin(t*.13+i*1.7)*140,y=C+Math.cos(t*.11+i*2.3)*125,r=34+Math.sin(t*.3+i)*10;\n      const cg=ctx.createRadialGradient(x,y,0,x,y,r);cg.addColorStop(0,`rgba(220,255,240,${.1*day})`);cg.addColorStop(1,'rgba(220,255,240,0)');ctx.fillStyle=cg;ctx.fillRect(x-r,y-r,r*2,r*2)}\n    ctx.globalCompositeOperation='source-over'}\n  // fish shadows\n  for(const f of fish){ctx.save();{const h=.35+.9*(1-(f.depth||0));ctx.translate(f.x+6*h,f.y+9*h)}ctx.rotate(f.ang);ctx.beginPath();ctx.ellipse(-f.L*.05,0,f.L*.4,f.L*f.W*.9,0,0,6.283);ctx.fillStyle=`rgba(0,10,20,${.12+.12*day})`;ctx.shadowColor='rgba(0,10,20,.4)';ctx.shadowBlur=7;ctx.fill();ctx.restore()}\n  if(selected){ctx.save();ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.5;ctx.setLineDash([3,5]);ctx.lineDashOffset=-t*8;ctx.beginPath();ctx.arc(selected.x,selected.y,selected.L*.55+4,0,6.283);ctx.stroke();ctx.restore()}\n  // small fish first, koi over them\n  for(const pass of ['small','turtle','koi'])for(const f of fish){if(f.kind!==pass)continue;drawDeep(f,sky)}\n  // white ripple strokes\n  ctx.lineCap='round';\n  for(const w of wakes){const k=w.t/2.2,a=(1-k)*.55;ctx.strokeStyle=`rgba(255,255,255,${a})`;\n    for(const s of [-1,1]){const r=w.s*(.22+k*.5);ctx.lineWidth=1.6*(1-k)+.4;ctx.beginPath();\n      ctx.arc(w.x,w.y,r,w.a+Math.PI+s*.55-.35,w.a+Math.PI+s*.55+.35);ctx.stroke()}}\n  for(const r of taps)waterRing(r.x,r.y,r.t,2.4,88,4,1);\n  for(const r of ripples)waterRing(r.x,r.y,r.t,1.6,30,2,.6);\n  // food on the surface\n  for(const p of food){const a=Math.min(1,p.life/5),bob=Math.sin(t*2+p.ph)*.4;\n    ctx.beginPath();ctx.arc(p.x,p.y+bob,5,0,6.283);ctx.fillStyle=`rgba(230,170,90,${.2*a})`;ctx.fill();\n    ctx.b
